name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, test and validate content
        run: make check
      # Every gate this repository declares, plus re-verification: an item that
      # claims to pass is re-run rather than trusted (lecture 08 — the harness
      # owns state, not the agent). `make check` above already runs the same
      # command without --reverify; this is the strict pass.
      - name: Harness gates and re-verification
        run: pnpm exec harnessimo check --reverify
      # The acceptance signal must live outside what the loop can change.
      - name: Locked surfaces
        run: pnpm exec harnessimo locked "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" HEAD
      # Lecture 12: debris a build compiles happily, and a progress file that
      # went stale while the code around it changed.
      - name: Clean state
        run: pnpm exec harnessimo clean-exit "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" HEAD

  cold-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fresh clone installs and verifies from the repository alone
        run: pnpm exec harnessimo cold-start
