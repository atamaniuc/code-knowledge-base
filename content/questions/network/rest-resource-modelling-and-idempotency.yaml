slug: rest-resource-modelling-and-idempotency
lang: en

domain: network
topic: api-design
subtopic: rest

tracks: [backend, fullstack]
levels: [senior, staff]

tech:
  name: HTTP APIs
  version_range: ">=2022"

question: >-
  Design the HTTP surface for a wallet: create a transfer, list transfers, and cancel a
  pending transfer. Then tell me what a client should do when the connection drops just
  after it sent the create.
probes: >-
  Whether the candidate separates modelling from retry safety, and whether they know that
  POST is not idempotent by definition while HTTP already defines which methods are. The
  dropped-connection follow-up is where the idempotency design either exists or does not.
answer_strategy: >-
  Model the nouns first and keep it boring: a collection and an item, with the cancel as a
  state change on the item or its own sub-resource. Then separate the two cases — a
  client-generated identifier makes creation safe to retry with PUT; everything else needs an
  idempotency key. Spend the rest on the key's mechanics, because that is the part candidates
  hand-wave, and finish with conditional requests for the cancel.
expected_answer:
  - text: >-
      Models transfers as a collection and an item, and expresses cancel as a documented state
      change or a sub-resource rather than an undeclared verb on the item.
    weight: 4
    min_level: senior
  - text: >-
      States that GET, PUT and DELETE are idempotent by definition while POST is not, and that
      PATCH is only idempotent if written that way.
    weight: 5
    min_level: senior
  - text: >-
      Offers two legitimate retry-safe designs: PUT to an item with a client-generated id, or a
      POST carrying an idempotency key.
    weight: 5
    min_level: senior
  - text: >-
      Describes the key store correctly: scope the key to the tenant, store the response body and
      status, honour it for a documented window, and return the stored response on a repeat.
    weight: 4
    min_level: staff
  - text: >-
      Handles the concurrent duplicate with a unique constraint or a lease in the same
      transaction as the effect, rather than a check followed by an insert.
    weight: 5
    min_level: staff
  - text: >-
      Uses an ETag with If-Match on the cancel so a concurrent state change produces a conflict
      instead of a silent overwrite.
    weight: 3
    min_level: staff
  - text: >-
      Says what the client does on a timeout: retry with the same key, and treat a 409 as
      "in progress" rather than as failure.
    weight: 3
    min_level: senior

follow_ups:
  - The idempotency window has expired and the client retries anyway. What happens?
  - Should the key be scoped per account or per API key, and what breaks if you choose wrong?
  - How would you return an error for a transfer that violates a limit, in a way the client can branch on?

common_mistakes:
  - >-
          Adding a client-side retry with the same body and calling creation idempotent.
  - >-
          Deduplicating by a hash of the payload, which silently collapses two legitimate identical
          transfers into one.
  - >-
          Keeping the key in a cache whose TTL is shorter than the client's retry schedule.
  - >-
          Treating a duplicate as an error and returning 409 when the first request already succeeded.

related_questions: [idempotency-key-concurrent-duplicates, api-versioning-and-idempotency]

