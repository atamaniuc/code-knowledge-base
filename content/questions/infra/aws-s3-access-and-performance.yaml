slug: aws-s3-access-and-performance
lang: en

domain: infra
topic: aws
subtopic: storage

tracks: [backend, any]
levels: [senior, staff]
tech:
  name: AWS
  version_range: ">=2024"

question: >-
  You are designing storage for user uploads at a high request rate. Walk me
  through consistency, prefix design, access control and the cost levers you
  would reach for.

probes: >-
  Whether the candidate knows S3 is strongly consistent now and therefore does
  not design around a problem that no longer exists, and whether they can state
  the per-prefix request-rate model rather than reaching for random prefixes.

answer_strategy: >-
  Start with the two facts that shape everything — strong read-after-write
  consistency and the per-prefix request rate — then cover access control and
  cost. Correct the old random-prefix advice without being smug about it, and make
  the cost answer specific to this workload rather than a generic list.

expected_answer:
  - text: >-
      States that S3 provides strong read-after-write consistency for PUT and
      DELETE in all Regions, so no consistency workaround belongs in the design.
    weight: 5
    min_level: senior
  - text: >-
      Uses the per-prefix request-rate model — at least 3,500 write and 5,500 read
      requests per second per partitioned prefix — and parallelises across
      prefixes when the workload needs more.
    weight: 5
    min_level: staff
  - text: >-
      Partitions on a natural key such as tenant or date, and knows the old advice
      about random hash prefixes is obsolete because S3 partitions
      automatically.
    weight: 4
    min_level: senior
  - text: >-
      Keeps buckets private with Block Public Access and grants clients access
      through short-lived presigned URLs rather than credentials or a public
      bucket.
    weight: 4
    min_level: senior
  - text: >-
      Uses multipart upload for large objects for both throughput and
      resumability, and byte-range reads to parallelise a single large object.
    weight: 3
    min_level: senior
  - text: >-
      Names the cost levers: lifecycle transitions or Intelligent-Tiering, a rule
      aborting incomplete multipart uploads, VPC gateway endpoints to avoid NAT
      charges, and egress as the expensive direction.
    weight: 4
    min_level: staff
  - text: >-
      Weighs SSE-KMS against SSE-S3, noting that KMS request charges and key policy
      become visible at high request volume.
    weight: 3
    min_level: staff

follow_ups:
  - The upload rate triples overnight. What do you change, and what do you not?
  - How would you serve the same objects to a global audience without paying full egress?
  - What stops a presigned URL from becoming a permanent access grant?

common_mistakes:
  - >-
    Adding a random-prefix scheme for a consistency problem S3 no longer has.
  - >-
    Making a bucket public for convenience and calling it a static-asset decision.
  - >-
    Presigning URLs with day-long expiries, which are credentials with extra
    steps.
  - >-
    Ignoring incomplete multipart uploads and data-transfer charges in the cost
    model.

