question: "You must add a field to an Angular 16 screen that reads from the Laravel API. What Angular concepts do you touch, and what changed in 16 that you should use in new code?"
probes: "Whether the candidate knows the component-service-template flow and reaches for standalone components and signals in new code."
answer_strategy: "Walk the change: the component template, the service using HttpClient with the auth interceptor, and the model type. Then name Angular 16's defaults — standalone components and signals — and say the change should follow them without rewriting the legacy module code around it."
expected_answer:
