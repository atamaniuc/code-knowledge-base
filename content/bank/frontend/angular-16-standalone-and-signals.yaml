    weight: 5
    min_level: middle
  - text: "Uses HttpClient with interceptors for the auth token rather than hand-rolled fetch."
    weight: 4
    min_level: middle
  - text: "Uses standalone components for new code, importing only what the component needs."
    weight: 4
    min_level: middle
  - text: "Uses signals for local state so change detection is dependency-tracked."
    weight: 4
    min_level: middle
  - text: "Keeps the change small and does not migrate surrounding module-based code."
    weight: 3
    min_level: middle
