question: "In Laravel 11 you need the current company resolved before any auth or controller code runs. Where do you register that middleware and how do you guarantee the order?"
probes: "Whether the candidate knows bootstrap/app.php is the Laravel 11 kernel and that middleware order is registration order."
answer_strategy: "Locate the kernel in bootstrap/app.php, register the tenant resolver in the global stack with withMiddleware, and say order is explicit — append or prepend — so the resolver lands before auth. Then mention route middleware as the second layer."
expected_answer:
  - text: "Registers middleware through bootstrap/app.php in Laravel 11."
    weight: 5
    min_level: middle
  - text: "States the global stack runs in registration order, so the tenant resolver is placed before auth."
    weight: 5
    min_level: senior
  - text: "Uses append/prepend to fix ordering rather than relying on defaults."
    weight: 4
