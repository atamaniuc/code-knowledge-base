question: "An invoice total is stored as a float and discount calculations drift by a cent on some accounts. What is the correct model for money and proration?"
probes: "Whether the candidate models money in the smallest integer unit and applies explicit rounding rules instead of floating point."
answer_strategy: "Name the root cause — binary float cannot represent decimal money exactly — then the fix: integer cents with an explicit currency, a value object for the arithmetic, and explicit rounding for proration and discounts. Close with where the conversion happens: at the input/output boundary only."
expected_answer:
  - text: "Explains why float arithmetic corrupts decimal money (0.1 + 0.2 is not 0.3 in binary)."
    weight: 5
    min_level: middle
  - text: "Stores amounts as integer cents, the smallest currency unit, with currency alongside."
    weight: 5
    min_level: senior
  - text: "Computes proration and discounts in cents with an explicit rounding rule."
    weight: 4
    min_level: senior
  - text: "Wraps money in an immutable value object so the rule lives in one place."
    weight: 4
    min_level: senior
  - text: "Converts to display format only at the presentation boundary."
    weight: 3
    min_level: middle
