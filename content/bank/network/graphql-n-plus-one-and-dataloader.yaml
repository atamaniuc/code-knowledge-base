slug: graphql-n-plus-one-and-dataloader
lang: en

domain: network
topic: api-design
subtopic: graphql

tracks: [backend, fullstack]
levels: [senior, staff]

tech:
  name: GraphQL
  version_range: ">=2023"

question: >-
  A GraphQL endpoint's p99 is eight times its p50, and the database shows hundreds of
  near-identical queries for a single request. Walk me through the diagnosis and the fix.
  Then tell me what is still a problem after the fix.
probes: >-
  Whether the candidate can connect a resolver-per-field execution model to a query per item,
  and whether they know that batching fixes query count but not query shape or unbounded
  lists.
answer_strategy: >-
  Describe the trace first: one list query resolves the items, then the relationship resolver
  runs once per item. Name the fix — a per-request batching loader — then be precise about the
  contract of the batch function and the cache lifetime. Finish on the residual problems:
  unbatched nested relationships, unbounded list sizes, and expensive query shapes, which are
  a different control entirely.
expected_answer:
  - text: >-
      Identifies the N+1 pattern from the resolver-per-field execution model: one query for the
      list and one per item for each relationship.
    weight: 5
    min_level: senior
  - text: >-
      Proposes request-scoped batching with DataLoader so keys requested in the same step are
      resolved with a single query.
    weight: 5
    min_level: senior
  - text: >-
      Knows the batch function must return a value for every key in order, including misses, or
      results silently mismatch.
    weight: 4
    min_level: staff
  - text: >-
      Creates the loader per request, because a shared instance is a cache across users and
      leaks data.
    weight: 4
    min_level: staff
  - text: >-
      Notes that a nested relationship still produces N+1 if it is not batched, so the fix is
      per resolver, not global.
    weight: 3
    min_level: staff
  - text: >-
      Separates batching from query-shape control: depth and cost limits address a query that is
      too deep or too wide, which batching cannot fix.
    weight: 3
    min_level: staff
  - text: >-
      Mentions pagination on list fields, since an unbounded list is expensive however well the
      relationships are batched.
    weight: 2
    min_level: senior

follow_ups:
  - The relationship needs a filter that differs per parent. Can the loader still batch?
  - How would you verify from production metrics that the N+1 is gone?
  - What is the difference between the loader's cache and a shared cache in front of the database?

common_mistakes:
  - >-
          Creating one loader at module scope, which caches across requests and returns one user's data
          to another.
  - >-
          Batch-loading the obvious relationship and leaving the nested one unbatched.
  - >-
          Reaching for a shared Redis cache before fixing the per-request query count.
  - >-
          Blaming the database, when the query pattern is generated by the resolver model.

