id: 7d2f5b91-4c6a-4a3e-9f18-2e5c8b7a1d34
slug: finverity-senior-node-js
lang: ru
title: Finverity · Senior Node.js Engineer — защита тестового и разговор с CTO
summary: >-
  Репетиция под один конкретный заход: вакансия Senior Node.js Engineer в британском
  финтехе на SCF-платформе, тестовое задание Program Capacity & Invoice Reservation и
  техническое интервью на 1–1,5 часа с CTO. Группы идут в том порядке, в котором их
  спрашивают: сначала защита решения, потом Node и данные, потом домен, в конце — аудит
  и комплаенс. Вторая половина — защита собственного решения: питч и демо, трейд-оффы,
  продакшен, граничные случаи с номером теста, трудные вопросы, работа с ИИ, истории STAR
  и слабые места, которые лучше назвать первым. high — спросят почти наверняка, medium —
  всплывает как follow-up. Каждый вопрос размечен темами, и тема собирает связанное по
  всем группам.

target:
  role: Senior Node.js / TypeScript Engineer
  company: Finverity (рекрутинг — Itentio)
  domain: fintech
  stack: [Node.js, NestJS, TypeScript, PostgreSQL, Redis, Kafka, Docker, Kubernetes, AWS]

stages:
  - name: Знакомство с рекрутером
    minutes: 30
    note: >-
      Мотивация, релевантный опыт, вилка, сроки выхода, уровень английского. Технику
      почти не спрашивают, но фиксируют, насколько внятно ты рассказываешь о своём
      опыте: это те же навыки, что нужны на созвонах с Product и Support.
  - name: Тестовое задание
    minutes: 120
    note: >-
      Program Capacity & Invoice Reservation: резервы лимита программы, освобождения,
      доступность, поток от казначейства через Kafka, мультивалютность, аутентификация и
      локальный запуск. Оценивают не объём, а отсутствие дыр в ядре и честный README.
  - name: Техническое интервью с CTO
    minutes: 90
    note: >-
      Защита решения и техническая дискуссия. Идут по краям: одновременные запросы,
      дубли и опоздавшие письма, валюты, тенанты, аудит. Плюс общие вопросы про Node,
      Postgres, Kafka и API — на уровне «объясни механизм», а не «перечисли фичи».
  - name: Финальный раунд
    minutes: 30
    note: >-
      CEO и соучредитель. Продукт, культура, ожидания, как ты работаешь с
      неопределённостью. Здесь важнее честность про то, чего ты не знаешь, чем
      вылизанная история успеха.

groups:
  - id: assignment-core
    title: Защита ядра решения
    side: technical
    domain: fintech
    intro: >-
      Первый вопрос почти всегда один и тот же: расскажи, что ты построил. Дальше CTO
      идёт по краям — там, где решение могло развалиться. Держи ответ в форме «три
      операции, один инвариант, где он живёт, что сознательно не сделал».
    wiki_refs: [limits-risk-and-trade-finance, idempotency-and-once-only-effects, reconciliation-and-drift]
    questions:
      - id: assignment-architecture-walkthrough
        question: Расскажи архитектуру сервиса за две минуты. Что в нём есть и почему именно так?
        likelihood: high
        tags: [scope, tradeoff]
        asks: >-
          Есть ли в голове модель целиком — операции, границы, место инварианта, — или
          это набор файлов, написанных по очереди.
        answer:
          - >-
            Сначала три операции и один инвариант (invariant): резерв (reservation), освобождение (release), чтение
            доступности, и занятое никогда не превышает лимит.
          - >-
            Потом границы: HTTP-слой (аутентификация, валидация, идемпотентность),
            доменный слой (переходы резерва), хранилище — единственное место, где лимит (credit limit)
            проверяется.
          - >-
            Дальше два входа в одну модель: синхронный API и консьюмер (consumer) казначейства (treasury).
            Они меняют одни и те же строки, поэтому правила живут в базе, а не в памяти
            сервиса.
          - >-
            В конце — что осталось за рамками: переоценка по курсу (FX rate), UI, настоящий
            провайдер курсов.
        traps:
          - >-
            Перечислять микросервисы вместо операций. Задание на пару часов, и
            количество сервисов уровень не показывает.
        follow_ups:
          - Если бы дали ещё два дня, что сделал бы первым?
      - id: limit-race-atomic-update
        question: Два резерва (reservation) на 800 и 700 тысяч приходят одновременно, свободно миллион. Как гарантируешь, что пройдёт только один?
        likelihood: high
        tags: [concurrency, postgres, money]
        asks: >-
          Ищут не слово «транзакция», а понимание, что проверка и запись должны быть
          одной операцией в базе.
        answer:
          - >-
            Называю окно «прочитал — проверил — записал» источником бага: два читателя
            видят миллион и оба проходят проверку.
          - >-
            Проверка уезжает внутрь записи: условие в WHERE перепроверяется после того,
            как первая транзакция (transaction) отпустит строку, и ноль обновлённых строк означает
            отказ.
          - >-
            Альтернатива — SELECT FOR UPDATE по строке программы (program) в транзакции (transaction), но тогда
            порядок блокировок надо дисциплинировать, иначе дедлок (deadlock).
          - >-
            Обязательный тест: пятьдесят параллельных резервов (reservation) на лимит (credit limit), которого
            хватает на десять. Успешных должно быть ровно десять.
        traps:
          - >-
            Добавить распределённую блокировку (distributed lock) в Redis поверх строки в базе — второй
            источник правды при живом первом.
          - >-
            Сказать «SERIALIZABLE» и не упомянуть, что это ошибки сериализации и их надо
            ретраить (retry), причём идемпотентно.
        follow_ups:
          - Что произойдёт, если такие запросы придут на разные реплики?
      - id: idempotency-key-design
        question: Клиент не дождался ответа и повторил запрос на резерв (reservation). Что произойдёт?
        likelihood: high
        tags: [idempotency, api]
        asks: >-
          Различаешь ли ты повтор и конфликт: тот же запрос с той же суммой против того
          же инвойса с другой суммой.
        answer:
          - >-
            Естественный ключ: один инвойс (invoice) — один активный резерв (reservation), уникальный индекс (index) по
            программе и инвойсу.
          - >-
            Повтор с теми же данными возвращает уже созданный резерв (reservation) и тот же ответ,
            включая код статуса.
          - >-
            Тот же инвойс (invoice) с другой суммой — не повтор, а конфликт: отдельный код и запись
            в журнал (ledger), а не молчаливая перезапись.
          - >-
            Для операций без естественного ключа принимаю Idempotency-Key и храню
            результат вместе с телом ответа.
        traps:
          - >-
            Держать ключ идемпотентности (idempotency) в памяти процесса: после рестарта защита
            исчезает.
      - id: kafka-consumer-dedup
        question: Письмо Kafka пришло дважды. Что именно дедуплицируешь (deduplication) и где ставишь отметку?
        likelihood: high
        tags: [kafka, idempotency]
        asks: >-
          Порядок записи: отметка «обработано» и изменение лимита должны попасть в одну
          транзакцию, иначе остаётся окно, в котором эффект применится дважды.
        answer:
          - >-
            Таблица обработанных сообщений с уникальным идентификатором сообщения или
            парой «программа плюс номер последовательности».
          - >-
            Отметка пишется в той же транзакции (transaction), что и эффект. Падение между шагами тогда
            откатывает (rollback) оба.
          - >-
            Ключ партиционирования (partition) — идентификатор программы (program): порядок сохраняется внутри
            одной ленты, а одна программа живёт в одной ленте.
          - >-
            Дубль после успешной обработки — no-op и метрика, а не ошибка.
        traps:
          - >-
            Дедуплицировать (deduplication) по бизнес-полям вроде суммы и номера инвойса (invoice) и потерять
            настоящие разные события.
      - id: reconciliation-snapshot-asof
        question: Приходит снапшот (snapshot) сверки (reconciliation) за 10:00, а в 10:02 ты зарезервировал ещё миллион. Как его применяешь?
        likelihood: high
        tags: [reconciliation, kafka]
        asks: >-
          Ключевая проверка домена: понимаешь ли ты, что снапшот — истина на момент, а не
          истина сейчас.
        answer:
          - >-
            Снапшот (snapshot) несёт момент, на который он верен: время среза и номер
            последовательности. Всё, что старше уже применённого, пропускается с записью в
            лог.
          - >-
            Применяю как базу на момент среза, а сверху накладываю свои изменения после
            него — иначе только что обещанные поставщику (supplier) деньги исчезнут из учёта.
          - >-
            Расхождение в том, что было до среза, — настоящая ошибка: принимаю правду
            казначейства (treasury), пишу корректировку с причиной и поднимаю алерт (alert).
          - >-
            Снапшот (snapshot) применяется одной транзакцией (transaction) вместе с отметкой «сообщение
            обработано».
        traps:
          - >-
            Слепо перезаписать состояние снапшотом (snapshot): шкала забывает про свежий инвойс (invoice), и
            лимит (credit limit) можно выдать на миллион сверх.
      - id: read-model-availability
        question: Клиенты читают «сколько свободно» постоянно. Как отдаёшь это быстро и честно?
        likelihood: medium
        tags: [api, nfr]
        asks: >-
          Разделяешь ли ты путь записи и путь чтения и можешь ли назвать, насколько чтение
          может отставать.
        answer:
          - >-
            Ответ — лимит (credit limit) минус сумма активных резервов (reservation); денормализованный счётчик держать
            можно, но его надо сверять с журналом (ledger).
          - >-
            Чтение отдаёт версию состояния и признак превышения, а не отрицательное
            доступное (available).
          - >-
            Кэш (cache) на чтение с коротким TTL допустим только с явным контрактом по свежести:
            клиент должен знать, что видит значение не старше N секунд.
          - >-
            Самопроверка: итог по журналу (ledger) пересчитывается и сравнивается с текущим числом.
      - id: local-runnable-delivery
        question: Как проверяющий запустит твоё решение? Что в README, что в compose-файле?
        likelihood: medium
        tags: [scope, ops]
        asks: >-
          Отношение к чужому времени: одна команда, тестовые данные, пример токена,
          миграции на старте.
        answer:
          - >-
            Docker compose поднимает сервис, PostgreSQL и Kafka, миграции (migration) применяются на
            старте, сиды дают программу (program), пару инвойсов (invoice) и тестовый токен.
          - >-
            README отвечает на три вопроса: как поднять, как аутентифицироваться, какие
            решения приняты и что сознательно не сделано.
          - >-
            Короткие ADR на каждый открытый вопрос задания: формат событий, кто прав при
            расхождении, источник курсов (FX rate), частичное погашение (partial repayment).
        traps:
          - >-
            Приложить длинный README без запуска одной командой. Проверяющий оценит именно
            второе.
      - id: tests-that-prove-the-hard-parts
        question: Какие тесты ты считаешь доказательством, что решение работает?
        likelihood: high
        tags: [tests]
        asks: >-
          Ждут тестов на то, что ломается: гонки, дубли, опоздавшие снапшоты, — а не
          покрытия CRUD.
        answer:
          - >-
            Конкурентный тест (concurrency test) на лимит (credit limit): N параллельных резервов (reservation), успешных ровно столько,
            на сколько хватает места.
          - >-
            Тест идемпотентности (idempotency): повтор запроса и повторная доставка сообщения не меняют
            состояние, но возвращают тот же ответ.
          - >-
            Тест опоздавшего снапшота (snapshot): срез в прошлом, свежий резерв (reservation) остаётся.
          - >-
            Тест недопустимого освобождения (release): освободить больше зарезервированного нельзя,
            повтор освобождения — no-op.
          - >-
            Остальное — интеграционные тесты (integration tests) через настоящий Postgres, потому что инвариант (invariant)
            живёт в базе.
        traps:
          - >-
            Мокать базу. Тогда главный инвариант (invariant) проверяется против мока, а не против
            Postgres.
      - id: what-was-left-out
        question: Что ты сознательно не сделал и почему?
        likelihood: high
        tags: [scope, tradeoff]
        asks: >-
          Зрелость: senior отличается тем, что знает границу своего решения и называет её
          раньше, чем её найдут.
        answer:
          - >-
            Называю три-четыре вырезанных куска и цену каждого: переоценка по курсу (FX rate), UI,
            реальный провайдер курсов, полноценная сага.
          - >-
            Для каждого — что случится в проде без этого и когда это станет блокером.
          - >-
            Отдельно — что сделал бы иначе при требовании «завтра в прод».
        traps:
          - >-
            Сказать «всё сделал». Задание гарантированно оставило дыры, и первая найденная
            читается как невнимательность.

  - id: node-nestjs
    title: Node.js, TypeScript и NestJS
    side: technical
    domain: backend-node
    intro: >-
      Второй слой после защиты задания. Отвечать конкретно — механизмами и порядком
      вызовов, а не «в NestJS это из коробки».
    wiki_refs: [nodejs-event-loop-and-latency, nestjs-request-lifecycle-and-scopes, nodejs-memory-gc-and-leaks]
    questions:
      - id: node-event-loop-blocking
        question: Сервис под нагрузкой начал отвечать по три секунды, CPU при этом десять процентов. С чего начнёшь?
        likelihood: high
        tags: [nfr, ops]
        asks: >-
          Различаешь ли ты блокировку event loop, ожидание ввода-вывода и медленную
          внешнюю зависимость.
        answer:
          - >-
            Сначала лаг event loop и профиль: если лаг растёт при низком CPU, это очередь
            на одном потоке, а не нехватка ядер.
          - >-
            Ищу синхронную работу в горячем пути: разбор больших JSON, криптография,
            тяжёлые регулярки, обход больших массивов, синхронные файловые вызовы.
          - >-
            Проверяю пул соединений (connection pool) к базе и таймауты (timeout): очередь на пуле выглядит как
            медленный сервис.
          - >-
            Дальше выношу тяжёлое в отдельные потоки или в очередь и только потом
            добавляю реплики (replica).
      - id: nestjs-request-lifecycle
        question: Что происходит с запросом в NestJS от сокета до контроллера и как ты этим пользуешься?
        likelihood: medium
        tags: [api]
        asks: >-
          Знаешь ли порядок middleware, guards, interceptors, pipes, handler и куда вешать
          сквозные вещи.
        answer:
          - >-
            Порядок: middleware, guards, interceptors до обработчика, pipes, обработчик,
            interceptors после, фильтры исключений.
          - >-
            Аутентификация (authentication) и тенант (tenant) — guard: он срабатывает до валидации тела и может
            отклонить запрос раньше.
          - >-
            Валидация DTO — pipe со строгим режимом, чтобы лишние поля не доезжали до
            домена.
          - >-
            Единый формат ошибок и идентификатор запроса — interceptor плюс фильтр, вместо
            try-catch в каждом контроллере.
        traps:
          - >-
            Валидировать в контроллере руками и оставить второй путь записи без валидации.
      - id: nestjs-module-boundaries
        question: Как делишь приложение на модули, чтобы через полгода оно не стало одним файлом?
        likelihood: medium
        tags: [scope]
        asks: >-
          Границы по возможностям, а не по типам файлов, и запрет на циклические
          зависимости между модулями.
        answer:
          - >-
            Модуль — это возможность (лимиты, инвойсы, выплаты), а не слой; контроллеры и
            репозитории живут внутри своей возможности.
          - >-
            Модули общаются через узкий публичный сервис, внутренние провайдеры не
            экспортируются.
          - >-
            Домен не знает про HTTP: DTO на границе, доменные типы внутри.
          - >-
            Циклическая зависимость между модулями — сигнал, что граница проведена не там.
      - id: graceful-shutdown
        question: Как сервис ведёт себя при деплое под нагрузкой?
        likelihood: medium
        tags: [ops, nfr]
        asks: >-
          Порядок: снять готовность, дождаться текущих запросов, закоммитить офсеты, и
          только потом умереть.
        answer:
          - >-
            Первым снимается признак готовности, чтобы балансировщик перестал присылать
            трафик.
          - >-
            Затем ждём текущие запросы и не принимаем новые; консьюмер (consumer) останавливается так,
            чтобы офсеты (offset) закоммитились после обработки.
          - >-
            Таймаут (timeout) дренажа меньше, чем grace period в Kubernetes, иначе pod убивают на
            середине запроса.
          - >-
            Сигнал завершения обрабатывается явно: хук жизненного цикла — место для
            закрытия пула и консьюмеров (consumer).
        traps:
          - >-
            Закрыть пул базы раньше, чем завершились запросы в полёте.
      - id: typescript-boundary-typing
        question: Где у тебя TypeScript заканчивается и начинается валидация?
        likelihood: medium
        tags: [api, money]
        asks: >-
          Понимание, что типы стираются: данные из сети, из Kafka и из базы приходят как
          неизвестное, пока их не проверили.
        answer:
          - >-
            Типы — про внутреннюю согласованность (consistency); на границе стоит проверка схемы в
            рантайме.
          - >-
            Одна схема и есть источник типа: тип выводится из неё, а не пишется рядом и не
            разъезжается.
          - >-
            Деньги приходят и уходят строкой: число в контракте — заявка на потерю копеек.
          - >-
            Строгий режим в конфиге компилятора, и любое исключение из правила видно в
            диффе.

  - id: postgres
    title: "PostgreSQL: схема, транзакции (transaction), миграции (migration)"
    side: technical
    domain: data
    intro: >-
      Постгрес здесь не фон: в задании он держит инвариант. Вопросы идут от схемы к
      миграциям, и на каждом ждут конкретики — типа колонки, индекса, уровня изоляции.
    wiki_refs: [postgres-schema-design-and-normalisation, postgres-mvcc-isolation-and-locking, postgres-zero-downtime-migrations, postgres-query-plans-and-indexing]
    questions:
      - id: schema-for-capacity
        question: Нарисуй схему для программ (program), резервов (reservation) и журнала (ledger). Почему именно так?
        likelihood: high
        tags: [postgres, money]
        asks: >-
          Два решения: денормализованный счётчик занятого против суммы по резервам, и
          деньги как целые минорные единицы.
        answer:
          - >-
            Программа (program): идентификатор, тенант (tenant), валюта, лимит (credit limit) в минорных единицах, занятое,
            версия.
          - >-
            Резерв (reservation): программа (program), инвойс (invoice), сумма в валюте программы, исходная сумма и валюта,
            сохранённый курс, статус, уникальный индекс по активным резервам инвойса.
          - >-
            Журнал (ledger): только добавление, что, на сколько, почему, ссылка на запрос или
            сообщение.
          - >-
            Деньги — целые минорные единицы (minor units) плюс код валюты; курс (FX rate) хранится вместе с
            источником и временем.
          - >-
            Счётчик занятого держим ради атомарного условного обновления, но он выводим из
            журнала (ledger) и сверяется с ним.
        traps:
          - >-
            Хранить деньги в плавающей точке или в десятичном без явного масштаба и забыть,
            что у части валют три знака после запятой.
      - id: isolation-and-locks
        question: Какой уровень изоляции (isolation level) выставляешь и почему?
        likelihood: medium
        tags: [postgres, concurrency]
        asks: >-
          Знаешь ли ты, что уровень по умолчанию не спасает от схемы «прочитал —
          проверил — записал», и что блокировка строки создаёт очередь.
        answer:
          - >-
            По умолчанию — чтение зафиксированного: для атомарного условного обновления его
            достаточно, потому что условие перепроверяется после снятия блокировки.
          - >-
            Повторяемое чтение уместно для согласованного среза, например при сверке (reconciliation)
            программы (program).
          - >-
            Сериализуемый уровень — когда инвариант (invariant) сложнее одной строки; тогда обязательны
            ретраи (retry) на ошибки сериализации.
          - >-
            Блокировку строки (row lock) беру осознанно: она сериализует всех, кто ждёт эту программу (program),
            и превращает нагрузку в очередь.
      - id: deadlock-discipline
        question: Два запроса блокируют друг друга. Как это предупреждаешь?
        likelihood: medium
        tags: [postgres, concurrency]
        asks: >-
          Дисциплина порядка блокировок и понимание, что дедлок — это порядок в коде, а не
          сюрприз базы.
        answer:
          - >-
            Единый порядок захвата: сначала строка программы (program), потом резервы (reservation), всегда по
            возрастанию идентификатора.
          - >-
            Короткие транзакции (transaction): никакого сетевого вызова внутри транзакции.
          - >-
            Дедлок (deadlock) — повод починить порядок, а не только добавить ретрай (retry); ретрай обязателен
            как страховка, но он маскирует причину.
          - >-
            В логах видно, какие два запроса столкнулись: смотрю активность сессий и текст
            ошибки.
      - id: zero-downtime-migration
        question: Нужно добавить обязательную колонку на таблицу с миллионами строк в проде. Как?
        likelihood: medium
        tags: [postgres, ops]
        asks: >-
          Знание схемы «расширить — заполнить — сжать» и того, что долгая блокировка на
          запись останавливает сервис.
        answer:
          - >-
            Расширение: добавляю колонку допускающую пустое, новый код пишет в оба места,
            старые строки заполняю пачками.
          - >-
            Проверяю, что новый код работает со старыми строками: чтение терпит пустое,
            запись заполняет.
          - >-
            Сжатие: ограничение обязательности и валидация — отдельным деплоем после
            заполнения.
          - >-
            Индексы (index) создаются без блокировки записи, вне транзакции (transaction).
        traps:
          - >-
            Одна миграция (migration), которая в один деплой добавляет колонку со значением по
            умолчанию и обязательностью на большую таблицу.
      - id: query-plan-and-index
        question: Эндпоинт доступности (availability) стал медленным. Как выясняешь, где именно?
        likelihood: medium
        tags: [postgres, nfr]
        asks: >-
          Рефлексы: план запроса с фактическим временем, а не «добавлю индекс».
        answer:
          - >-
            План запроса с фактическими строками и буферами: расхождение оценки с фактом в
            разы означает устаревшую статистику.
          - >-
            Смотрю на последовательное чтение большой таблицы и на то, покрывает ли индекс (index)
            условие и порядок.
          - >-
            Проверяю N+1: часто «медленный запрос» — это двести быстрых.
          - >-
            Индекс (index) добавляю под конкретный предикат: лишний индекс замедляет запись.

  - id: kafka
    title: "Kafka: дубли, порядок, отказы"
    side: technical
    domain: messaging
    intro: >-
      Казначейство приходит через Kafka, и это второй источник правды. Ждут не «я знаю
      Kafka», а конкретики про ключ, офсеты, дедупликацию и плохие письма.
    wiki_refs: [kafka-producer-delivery-semantics, kafka-partitioning-and-ordering, kafka-dead-letter-handling, outbox-idempotency-and-sagas]
    questions:
      - id: consumer-semantics-at-least-once
        question: Kafka даёт доставку хотя бы один раз. Что из этого следует для твоего кода?
        likelihood: high
        tags: [kafka, idempotency]
        asks: >-
          Что «ровно один раз» не является бесплатным свойством брокера и что
          идемпотентность обеспечивается на твоей стороне.
        answer:
          - >-
            Обработка должна быть идемпотентной: эффект применяется один раз независимо от
            числа доставок.
          - >-
            Идемпотентность (idempotency) живёт в базе: уникальный идентификатор сообщения и отметка в
            той же транзакции (transaction), что и эффект.
          - >-
            Офсет (offset) коммитится после фиксации эффекта; автокоммит выключен.
          - >-
            Порядок гарантирован только внутри партиции (partition), поэтому ключ — идентификатор
            программы (program).
      - id: kafka-rebalance-and-offsets
        question: Что происходит с консьюмером (consumer) при ребалансе (rebalance) и как ты не теряешь работу?
        likelihood: medium
        tags: [kafka, ops]
        asks: >-
          Понимание, что ребаланс — это пауза, а не ошибка, и что слишком долгая обработка
          ведёт к шторму ребалансов.
        answer:
          - >-
            При ребалансе (rebalance) партиции (partition) перераспределяются, и обработка должна отдать партицию,
            не потеряв прогресс.
          - >-
            Обработка дольше максимального интервала опроса выкидывает консьюмера (consumer) из
            группы — отсюда шторм и повторная доставка.
          - >-
            Пачка обрабатывается с коммитом по мере продвижения, а не одним коммитом в
            конце.
          - >-
            Кооперативное распределение и статическое членство уменьшают область
            перераспределения.
      - id: kafka-dlq-and-retries
        question: "Письмо не обрабатывается: в данных ошибка. Что делаешь?"
        likelihood: high
        tags: [kafka, ops]
        asks: >-
          Что бесконечный повтор одного плохого письма блокирует ленту, и что очередь
          отказов — признание проблемы, а не её решение.
        answer:
          - >-
            Ретраи (retry) ограничены по числу и с задержкой; после лимита (credit limit) сообщение уходит в
            очередь отказов (dead letter queue) вместе с причиной и исходными данными.
          - >-
            Лента продолжает двигаться: главное — не блокировать партицию (partition) одним плохим
            письмом.
          - >-
            Очередь отказов (dead letter queue) просматривается и разбирается: после исправления данные
            прогоняются отдельно, а не повторной доставкой.
          - >-
            Метрики на размер очереди и долю отказов, иначе она тихо растёт.
      - id: kafka-schema-evolution
        question: Казначейство (treasury) добавляет поле в событие. Как не упасть?
        likelihood: medium
        tags: [kafka, api]
        asks: >-
          Совместимость: новый читатель против старого писателя, и что откат деплоя — тоже
          сценарий.
        answer:
          - >-
            Новые поля опциональны; читатель терпит их отсутствие и не падает на неизвестных.
          - >-
            Схема в реестре с проверкой совместимости в конвейере (pipeline), а не договорённость в чате.
          - >-
            Номер поля не переиспользуется и его смысл не меняется.
          - >-
            Версия в самом сообщении, чтобы старые сообщения разбирались при повторной
            обработке.
      - id: kafka-transactional-outbox
        question: Нужно, чтобы изменение лимита (credit limit) и публикация события были согласованы. Как?
        likelihood: medium
        tags: [kafka, idempotency]
        asks: >-
          Знание схемы исходящей очереди в базе: сначала запись, потом публикация из
          журнала, а не две записи в две системы.
        answer:
          - >-
            Событие пишется в таблицу исходящих в той же транзакции (transaction), что и изменение
            состояния.
          - >-
            Отдельный публикатор читает её и отправляет, помечая отправленные; повторы
            безопасны благодаря ключу.
          - >-
            Двойная запись «база плюс брокер» даёт окно, в котором одно есть, а другого нет,
            и это окно всегда находят в проде.
          - >-
            Собственный ответ клиенту читается из базы: событие — для других сервисов.

  - id: api-contracts
    title: API, контракты и аутентификация (authentication)
    side: technical
    domain: network
    intro: >-
      Вакансия отдельно называет REST, версионирование, пагинацию, модель ошибок и
      идемпотентность. Здесь спрашивают форму контракта, а не список эндпоинтов.
    wiki_refs: [rest-resource-modelling-and-idempotency, api-pagination-and-error-models, api-contract-evolution]
    questions:
      - id: error-model
        question: Как выглядит твоя ошибка в API?
        likelihood: high
        tags: [api]
        asks: >-
          Может ли клиент отличить свою ошибку от нашей и повторимую от неповторимой, не
          читая текст сообщения.
        answer:
          - >-
            Один формат: машинный класс ошибки, человекочитаемое сообщение, идентификатор
            запроса, детали по полям.
          - >-
            Коды по смыслу: клиент сломал контракт, конфликт состояния, семантика, лимит (credit limit)
            запросов, наша ошибка.
          - >-
            Наружу не уходит стектрейс и текст ошибки базы; внутренний идентификатор для
            поддержки — уходит.
          - >-
            Доменный отказ «не хватает лимита» — отдельный тип с полем доступного (available), чтобы
            клиент мог показать причину.
      - id: idempotency-header
        question: Клиент просит идемпотентность (idempotency) на всех изменяющих эндпоинтах. Как бы ты её спроектировал?
        likelihood: medium
        tags: [api, idempotency]
        asks: >-
          Детали: ключ хранится вместе с ответом, у ключа есть срок жизни, параллельный
          повтор не создаёт второй эффект.
        answer:
          - >-
            Ключ в запросе, уникальный в пределах тенанта (tenant) и эндпоинта.
          - >-
            Храню отпечаток тела: тот же ключ с другим телом — семантическая ошибка, а не
            тихая перезапись.
          - >-
            Храню код и тело ответа, чтобы повтор вернул тот же результат, включая
            заголовок расположения созданного ресурса.
          - >-
            Параллельный повтор получает «в обработке», а не второй эффект.
        traps:
          - >-
            Хранить ключи вечно. Нужен срок жизни и понимание, что после него повтор снова
            может создать эффект.
      - id: rest-vs-grpc
        question: Внутри платформы выберешь REST, gRPC или GraphQL? По какому критерию?
        likelihood: medium
        tags: [api, tradeoff]
        asks: >-
          Критерий из эксплуатации: кто клиент, какие ошибки, что с версионированием и
          отладкой.
        answer:
          - >-
            Сервис-к-сервису с жёстким контрактом — gRPC: схема, генерация кода, дедлайны.
          - >-
            Публичное и партнёрское API — REST: предсказуемость, кэширование (cache), инструменты,
            документация.
          - >-
            GraphQL — когда клиентских сценариев много и они разные; для одного экрана он
            добавляет стоимость без пользы.
          - >-
            Критерий — не вкус, а кто клиент и как ты будешь отлаживать ошибку в три часа
            ночи.
      - id: auth-and-tenant
        question: Все эндпоинты должны быть аутентифицированы. Что именно проверяешь в токене (token)?
        likelihood: high
        tags: [auth, tenancy]
        asks: >-
          Что «есть ли токен» — не аутентификация: нужны подпись, тенант, права и
          фильтрация в каждом запросе к базе.
        answer:
          - >-
            Подпись, издатель, срок и аудитория; полям из неподписанного тела не верю.
          - >-
            Арендатор (tenant) берётся из проверенного токена (token) и применяется фильтром в каждом
            запросе к базе.
          - >-
            Права узкие: чтение отдельно от записи, проверка на входе в обработчик.
          - >-
            Чужая программа (program) — «не найдено», а не «запрещено»: второй код подтверждает, что
            она существует.
        traps:
          - >-
            Брать тенант (tenant) из заголовка запроса вместо токена (token): заголовок подделывается
            клиентом.
      - id: pagination-and-consistency
        question: Клиент листает журнал (ledger) изменений. Как пагинируешь?
        likelihood: medium
        tags: [api, nfr]
        asks: >-
          Постраничный сдвиг против курсора и согласованность при вставках во время
          листания.
        answer:
          - >-
            Курсор (cursor) по паре «время создания плюс идентификатор», а не смещение: смещение на
            растущей таблице даёт пропуски и дубли.
          - >-
            Курсор (cursor) — непрозрачная строка, чтобы реализацию можно было сменить.
          - >-
            Порядок стабильный по паре полей, потому что время создания не уникально.
          - >-
            Размер страницы ограничен сверху и объявлен в контракте.

  - id: architecture-ops
    title: Эксплуатация, надёжность и работа с людьми
    side: technical
    domain: architecture
    intro: >-
      Роль включает on-call, постмортемы, ревью и менторство, поэтому эти вопросы идут
      наравне с техническими. Отвечать случаями и механизмами, а не принципами.
    wiki_refs: [resiliency-timeouts-retries-and-bulkheads, slos-and-error-budgets, incident-response-and-postmortems, redis-distributed-locks, mentoring-and-code-review]
    questions:
      - id: observability-what-to-instrument
        question: "Тебя будят в три ночи: «лимиты врут». Что смотришь первым?"
        likelihood: high
        tags: [ops, nfr]
        asks: >-
          Есть ли метрики по смыслу домена, а не только по CPU и памяти.
        answer:
          - >-
            Доменные метрики: сумма занятого по программам (program) против суммы из журнала (ledger), отказы
            по причинам, доля превышений лимита (over limit).
          - >-
            Признак расхождения с казначейством (treasury): сколько снапшотов (snapshot) применено и сколько
            ушло в корректировку.
          - >-
            Латентность и доля ошибок по операциям, отставание консьюмера (consumer), размер очереди
            отказов.
          - >-
            Трассировка (tracing) конкретного запроса по идентификатору до строки в журнале (ledger).
      - id: retries-and-bulkheads
        question: Вызов казначейства (treasury) начал тормозить. Как твой сервис не ложится вместе с ним?
        likelihood: medium
        tags: [ops, nfr]
        asks: >-
          Таймауты и изоляция: без таймаута любой медленный сосед становится твоим
          падением.
        answer:
          - >-
            Таймаут (timeout) и дедлайн на каждый внешний вызов, меньше собственного бюджета запроса.
          - >-
            Ретраи (retry) только на идемпотентные вызовы, с ростом задержки, джиттером и общим
            бюджетом.
          - >-
            Размыкатель (circuit breaker) и ограничение параллелизма, чтобы медленный путь не съел пул.
          - >-
            Осознанная деградация (degradation): чтение доступности (availability) работает, даже когда внешняя сверка (reconciliation)
            недоступна.
      - id: cicd-and-rollback
        question: Как выглядит путь от коммита до прода у тебя?
        likelihood: medium
        tags: [ops, postgres]
        asks: >-
          Конкретика: миграции до кода, фича-флаги, канареечный шаг, откат и его границы.
        answer:
          - >-
            Конвейер (pipeline): типы, тесты, линт, сборка образа; миграции (migration) проверяются на пустой базе
            и на копии схемы.
          - >-
            Деплой: расширение схемы, новый код, сжатие схемы — в разное время.
          - >-
            Откат (rollback) кода не откатывает данные: любое изменение схемы совместимо с предыдущей
            версией.
          - >-
            Флаг на изменение поведения, а не на деплой.
        traps:
          - >-
            Считать, что откат (rollback) — это обратный коммит и тот же конвейер (pipeline) в другую сторону.
      - id: redis-where-it-helps
        question: Где в этом сервисе Redis действительно нужен?
        likelihood: medium
        tags: [tradeoff, nfr]
        asks: >-
          Скепсис: кэш поверх инварианта — второй источник правды, а распределённая
          блокировка вместо решения вопроса в базе — его маскировка.
        answer:
          - >-
            Кэш (cache) на чтение доступности (availability) с коротким сроком и явной границей свежести; никогда
            не кэш лимита (credit limit) для решения о записи.
          - >-
            Ограничение частоты по клиентам — идеальное место.
          - >-
            Идемпотентность (idempotency) и блокировки — нет: это в базе, иначе рестарт или разделение
            ленты ломают защиту.
          - >-
            Если нужен горячий счётчик, сначала измеряю, действительно ли база узкое место.
      - id: on-call-and-incident
        question: Расскажи про инцидент (incident), который ты вёл.
        likelihood: medium
        tags: [ops]
        asks: >-
          Как человек ведёт себя под давлением: порядок действий, коммуникация, что
          изменилось после.
        answer:
          - >-
            Начинаю с действий: как обнаружили, что было видно в метриках, что сделали
            первым.
          - >-
            Роли и коммуникация: кто ведёт, кто копает, кто говорит с бизнесом, обновления
            по расписанию.
          - >-
            Разбор без поиска виноватых: какого механизма не было и какой чек это поймает.
          - >-
            Закрываю конкретикой: что уже влито, когда проверю, что теперь мониторится.
        traps:
          - >-
            Рассказывать одну длинную историю успеха. Спрашивают про процесс, а не про
            героизм.
      - id: mentoring-and-review
        question: Как проводишь код-ревью (code review) и что делаешь с человеком, который не согласен?
        likelihood: medium
        tags: [process]
        asks: >-
          Senior-поведение: ревью на границы и инварианты, а не на вкус, и умение уступать
          там, где нет ставки.
        answer:
          - >-
            Блокирую только то, что ломает инварианты (invariant), безопасность или эксплуатацию;
            стиль — линтером и отдельным разговором.
          - >-
            Комментарий несёт причину, а не приказ: что случится в проде без правки.
          - >-
            Несогласие по вкусу решает автор; несогласие по факту — тест или замер, а не
            авторитет.
          - >-
            Учу задачей чуть выше уровня, а не исправлением за человеком.

  - id: scf-basics
    title: "Домен: что такое SCF и кто в сделке"
    side: domain
    domain: fintech
    intro: >-
      Доменную часть спросят мягче по форме и жёстче по содержанию: проверят, чьи деньги
      и чей риск ты считаешь. Отвечать через участников сделки, а не через термины.
    wiki_refs: [limits-risk-and-trade-finance, payment-lifecycle]
    questions:
      - id: what-is-scf
        question: Что такое supply chain finance и что именно финансирует банк в этой схеме?
        likelihood: high
        tags: [money]
        asks: >-
          Базовая модель: платят поставщику раньше срока под подтверждённый долг покупателя,
          риск — на крупном покупателе.
        answer:
          - >-
            Поставщик (supplier) отгрузил и ждёт оплаты, скажем, девяносто дней; покупатель (buyer) подтвердил
            долг на платформе.
          - >-
            Банк платит поставщику (supplier) сейчас, с дисконтом (discount), и получает деньги от покупателя (buyer) в
            срок.
          - >-
            Риск оценивается по покупателю (buyer), поэтому ставка ниже, чем банк дал бы самому
            поставщику (supplier).
          - >-
            Разновидность называется payables finance, или reverse factoring: инициирует
            покупатель (buyer), а не поставщик (supplier).
      - id: why-limit-on-buyer
        question: Почему лимит (credit limit) привязан к покупателю (buyer), а не к поставщику (supplier)?
        likelihood: high
        tags: [money, scope]
        asks: >-
          Понимание, сколько риска банк держит одновременно и на кого именно.
        answer:
          - >-
            Все деньги в итоге вернёт покупатель (buyer); если он обанкротится, банк потеряет всё
            выданное и не возвращённое.
          - >-
            Лимит (credit limit) — ответ на вопрос, сколько риска на этого покупателя (buyer) банк готов держать
            одновременно.
          - >-
            Поставщиков (supplier) у покупателя (buyer) много, а лимит (credit limit) один на программу, поэтому резервы
            разных поставщиков конкурируют за одно место.
          - >-
            Лимит (credit limit) возобновляемый: погашенное возвращается и снова может быть использовано.
      - id: discount-calculation
        question: Как из тысячи получается девятьсот восемьдесят пять?
        likelihood: medium
        tags: [money, fx]
        asks: >-
          Механика дисконта и то, что база расчёта — триста шестьдесят дней, а не триста
          шестьдесят пять.
        answer:
          - >-
            Дисконт (discount) — плата за ожидание: ставка умножается на срок и делится на базу дней (day count basis).
          - >-
            Шесть процентов годовых на девяносто дней при базе триста шестьдесят дают
            полтора процента, то есть пятнадцать долларов на тысяче.
          - >-
            База дней (day count basis) — часть контракта: триста шестьдесят против трёхсот шестидесяти пяти
            меняет сумму, поэтому она берётся из настроек, а не из константы в коде.
          - >-
            Сумма к выплате (payout) и сумма резерва (reservation) — разные числа: резерв обычно по номиналу (face value)
            инвойса.
      - id: invoice-lifecycle
        question: Какие состояния у инвойса (invoice) и в каких из них наш модуль участвует?
        likelihood: high
        tags: [money, reconciliation]
        asks: >-
          Что модель резерва привязана к двум дверям — одобрение к досрочной оплате и
          погашение, — а не ко всем состояниям подряд.
        answer:
          - >-
            Загружен, подтверждён покупателем (approved by buyer), одобрен к досрочной оплате (approved for early payment), профинансирован (funded),
            наступил срок, погашен.
          - >-
            Резерв (reservation) создаётся на одобрении к досрочной оплате (approved for early payment) и живёт до погашения (repayment).
          - >-
            Отмена (cancellation) до выплаты (payout) освобождает резерв (reservation), хотя денег не было; частичное погашение
            освобождает долю.
          - >-
            Просрочка (overdue) резерв (reservation) не освобождает: деньги поставщику (supplier) уже ушли.
      - id: partial-and-cancel
        question: Инвойс (invoice) погасили на сорок процентов. Что происходит с резервом (reservation)?
        likelihood: medium
        tags: [money]
        asks: >-
          Аккуратность: пропорциональное освобождение и запрет освободить больше остатка.
        answer:
          - >-
            Резерв (reservation) переходит в состояние частичного освобождения (release) и уменьшается на
            пропорциональную долю.
          - >-
            Остаток остаётся занятым, пока не будет погашено остальное.
          - >-
            Освободить больше остатка нельзя: это сделало бы доступное (available) больше лимита (credit limit).
          - >-
            Каждое изменение — новая строка в журнале (ledger), а не правка прежней.

  - id: money-fx
    title: Деньги, валюты, курсы (FX rate) и округление
    side: domain
    domain: fintech
    intro: >-
      Самая частая зона провала в этом задании: инвойс в евро, программа в долларах.
      Здесь проверяют, умеешь ли ты считать деньги так, чтобы расхождение не появилось
      само.
    wiki_refs: [cross-border-funding-flow, postgres-schema-design-and-normalisation]
    questions:
      - id: minor-units
        question: Инвойс (invoice) в EUR, программа (program) в USD. Как считаешь и что хранишь?
        likelihood: high
        tags: [money, fx]
        asks: >-
          Деньги: целые минорные единицы, код валюты рядом, число знаков по стандарту — не
          везде два.
        answer:
          - >-
            Суммы — целые минорные единицы (minor units) плюс код валюты; в API — строкой.
          - >-
            Число знаков берётся из стандарта валют: у динара Кувейта три, у иены ноль.
          - >-
            Курс (FX rate) сохраняется на момент резерва (reservation) вместе с источником и временем.
          - >-
            Пересчёт в валюте программы (program) делается один раз, при резерве (reservation), и фиксируется.
      - id: fx-drift-on-release
        question: Курс (FX rate) ушёл за девяносто дней. Сколько освободить?
        likelihood: high
        tags: [fx, money]
        asks: >-
          Ключевая ловушка: освобождается сохранённая сумма, а не пересчитанная по новому
          курсу.
        answer:
          - >-
            Освобождаю ровно ту сумму в валюте программы (program), которая была занята при резерве (reservation).
          - >-
            Пересчёт по текущему курсу (FX rate) либо создаёт лимит (credit limit) из воздуха, либо съедает его.
          - >-
            При частичном погашении (partial repayment) освобождается пропорциональная доля сохранённой суммы.
          - >-
            Переоценка риска по рынку — отдельный отчёт, а не изменение резервов (reservation).
      - id: rounding-direction
        question: В какую сторону округлять при конвертации?
        likelihood: medium
        tags: [money, fx]
        asks: >-
          Наличие правила и его обоснования: резерв вверх, чтобы не выдать сверх лимита.
        answer:
          - >-
            Резерв (reservation) округляется вверх: лучше занять на цент больше, чем выдать на цент сверх
            лимита (credit limit).
          - >-
            Освобождение (release) идёт по сохранённой сумме, без нового округления.
          - >-
            Правило записано в решении, потому что оно продуктовое, а не техническое.
          - >-
            Остаток от округления виден в журнале (ledger), иначе он всплывёт как непонятное
            расхождение.
      - id: float-in-money
        question: Почему нельзя использовать number для денег в Node.js?
        likelihood: high
        tags: [money]
        asks: >-
          Приведёт ли человек пример и решение: целые единицы, bigint или десятичная
          библиотека.
        answer:
          - >-
            Двоичная плавающая точка не представляет десятичные доли точно: одна десятая
            плюс две десятых не равны трём десятым.
          - >-
            В базу — целые минорные единицы (minor units) или десятичный тип; в Node — bigint или
            десятичная библиотека.
          - >-
            На границе API суммы передаются строкой, чтобы разбор JSON не превратил их в
            плавающее число.
          - >-
            Количество знаков проверяется по валюте на входе: три знака для доллара —
            ошибка, для динара — норма.
      - id: stale-rate-policy
        question: Откуда берутся курсы (FX rate) и что если они устарели?
        likelihood: medium
        tags: [fx, ops]
        asks: >-
          Эксплуатационное мышление: источник, свежесть и отказ вместо тихого расчёта по
          старым данным.
        answer:
          - >-
            Курсы (FX rate) приходят от провайдера или из казначейства (treasury) вместе со временем и
            источником.
          - >-
            Порог свежести: старше N минут — отказ с понятной ошибкой, а не расчёт по
            устаревшим данным.
          - >-
            Использованный курс (FX rate) хранится вместе с операцией, иначе спор о сумме неразрешим.
          - >-
            Откат (rollback) на последний известный курс (FX rate) допустим только с явной пометкой в ответе.

  - id: treasury-reconciliation
    title: Казначейство (treasury), сверка (reconciliation) и две правды
    side: domain
    domain: fintech
    intro: >-
      Вторая половина сложности задания: изменения приходят не только от клиентов, но и
      от казначейства, и эти два источника не договариваются заранее.
    wiki_refs: [reconciliation-and-drift, consistency-models-and-business-tolerance, kafka-partitioning-and-ordering]
    questions:
      - id: system-of-record
        question: Наши данные разошлись с казначейством (treasury). Кто прав?
        likelihood: high
        tags: [reconciliation, scope]
        asks: >-
          Называет ли человек источник истины и не пытается ли усреднить две правды.
        answer:
          - >-
            Казначейство (treasury) — источник истины (system of record): там учитываются реальные деньги.
          - >-
            Наш модуль — быстрая рабочая копия для решений в реальном времени.
          - >-
            Расхождение разрешается в пользу казначейства (treasury), но с записью корректировки и
            причины.
          - >-
            В задании этого нет, значит это допущение, и его место в README и в решении.
      - id: staleness-and-sequence
        question: Снапшот (snapshot) помечен временем десять ноль-ноль. Почему номер последовательности надёжнее часов?
        likelihood: medium
        tags: [reconciliation, kafka]
        asks: >-
          Понимание распределённого времени: часы двух систем расходятся, порядок по ним не
          строится.
        answer:
          - >-
            Часы двух машин всегда немного расходятся, поэтому «кто позже по времени» не
            задаёт порядок.
          - >-
            Номер последовательности от источника даёт монотонный порядок, по которому видно
            устаревшее.
          - >-
            Всё, что меньше уже применённого номера, пропускается и логируется.
          - >-
            Время среза нужно для наложения наших изменений, номер — для отбрасывания
            старых снапшотов (snapshot).
      - id: reconciliation-correction
        question: Снапшот (snapshot) расходится с нами в том, что было до среза. Что делаешь?
        likelihood: high
        tags: [reconciliation, audit]
        asks: >-
          Различает ли человек «снапшот старый» и «мы потеряли событие», и что делает во
          втором случае.
        answer:
          - >-
            Это настоящая ошибка: принимаю данные казначейства (treasury) как истину на момент среза.
          - >-
            Пишу корректировку с причиной «сверка» и ссылкой на сообщение.
          - >-
            Поднимаю алерт (alert): расхождение значит, что событие потерялось или обработалось
            неверно.
          - >-
            Разбираю причину по журналу (ledger); идеально, когда итог журнала сходится с
            казначейством (treasury) после корректировки.
      - id: utilization-and-alerts
        question: Какие доменные метрики ты бы отдал риск-менеджеру?
        likelihood: medium
        tags: [nfr, ops]
        asks: >-
          Понимание, что «доступно» — не единственное интересное число в этой системе.
        answer:
          - >-
            Загрузка по программам (program): занятое к лимиту (credit limit) и распределение, а не одно среднее.
          - >-
            Число отказов «не хватило лимита» — это упущенная выручка, её замечают.
          - >-
            Превышение лимита (over limit) — отдельный сигнал, он требует человека.
          - >-
            Расхождения с казначейством (treasury) и размер очереди отказов.
      - id: over-limit-behaviour
        question: Лимит (credit limit) снизили с десяти миллионов до трёх, а занято три и шесть десятых. Что отдаёшь клиенту?
        likelihood: high
        tags: [money, api]
        asks: >-
          Продуктовое решение: не отменять обещанное, блокировать новое, отдавать ноль и
          отдельное поле превышения.
        answer:
          - >-
            Существующие резервы (reservation) не отменяются: деньги поставщикам (supplier) уже обещаны или
            выплачены.
          - >-
            Новые резервы (reservation) блокируются, освобождения (release) продолжают приниматься.
          - >-
            В ответе доступное (available) равно нулю и отдельное поле превышения, а не отрицательное
            доступное.
          - >-
            Событие алерта (alert) риск-менеджеру: лимит (credit limit) надо либо вернуть, либо ждать погашений (repayment).

  - id: compliance-audit
    title: Аудит, тенанты (tenant), комплаенс
    side: domain
    domain: fintech
    intro: >-
      Платформа white-label, на ней работают разные банки, и компания живёт с
      требованиями аудита. Эти вопросы задают, чтобы понять, думаешь ли ты о
      доказуемости, а не только о работоспособности.
    wiki_refs: [kyc-aml-and-audit-trails, double-entry-ledgers, kubernetes-rbac-and-multi-tenancy]
    questions:
      - id: tenant-isolation
        question: Платформа белая метка. Как гарантируешь, что банк A не видит программы (program) банка B?
        likelihood: high
        tags: [tenancy, auth]
        asks: >-
          Модель угроз: тенант из токена, фильтр в каждом запросе, «не найдено» вместо
          «запрещено».
        answer:
          - >-
            Тенант (tenant) берётся только из проверенного токена (token) и попадает в каждый запрос к базе.
          - >-
            Строка программы (program) не читается без условия по тенанту (tenant), и это делается в слое
            доступа к данным, а не в контроллере.
          - >-
            Чужая программа (program) — «не найдено», чтобы не подтверждать её существование.
          - >-
            Тест изоляции в конвейере (pipeline): токен (token) первого тенанта (tenant) на данных второго даёт «не
            найдено», а не данные.
        traps:
          - >-
            Проверять тенант (tenant) в одном сервисе и не проверять в консьюмере (consumer) Kafka.
      - id: audit-trail
        question: Аудитор спрашивает, почему третьего марта в четырнадцать ноль пять доступно было миллион двести. Что покажешь?
        likelihood: high
        tags: [audit]
        asks: >-
          Журнал только на добавление: если в базе лежит одно текущее число, ответить нечем.
        answer:
          - >-
            Журнал (ledger) только на добавление: что, на сколько, кто, почему, ссылка на запрос или
            сообщение.
          - >-
            Исправление — новая строка-корректировка, а не правка прежней.
          - >-
            Текущее число пересчитывается из журнала (ledger) и сверяется с хранимым: бесплатная
            самопроверка.
          - >-
            Записи неизменяемы: удаление и правка запрещены правами в базе.
      - id: kyc-context
        question: Где в этом сервисе заканчивается KYC и AML и начинается твой модуль?
        likelihood: medium
        tags: [scope, audit]
        asks: >-
          Границы ответственности: проверки контрагентов и допуск к финансированию — до
          резерва, а не внутри него.
        answer:
          - >-
            Проверки контрагентов и риск-лимитов делаются до одобрения к досрочной оплате (approved for early payment).
          - >-
            Мой модуль получает уже одобренное решение и отвечает за учёт лимита (credit limit), а не за
            допуск сторон.
          - >-
            Всё, что делает модуль, объяснимо аудитору: у каждой операции есть инициатор и
            причина.
          - >-
            Персональные данные здесь не нужны — только идентификаторы сторон.
      - id: secrets-and-supply-chain
        question: Что сделаешь с секретами и зависимостями в этом сервисе?
        likelihood: medium
        tags: [ops, auth]
        asks: >-
          Гигиена: секреты вне репозитория, минимальные права, проверка зависимостей в
          конвейере.
        answer:
          - >-
            Секреты не в репозитории и не в образе: окружение или секретное хранилище,
            отдельно по средам.
          - >-
            Права минимальны: отдельный пользователь базы с правами на свою схему, роль без
            административных прав.
          - >-
            Сканирование зависимостей и фиксированный lockfile в конвейере (pipeline), обновления по
            расписанию, а не по инциденту (incident).
          - >-
            Образ из минимальной базы, подписанный; деплой по короткоживущим токенам (token), а не
            по долгоживущим ключам.
      - id: soc2-readiness
        question: Компания готовится к SOC 2. Что это меняет в твоей работе?
        likelihood: medium
        tags: [audit, ops]
        asks: >-
          Реализм: изменения через ревью, след доступа, неизменяемые логи, разделение
          обязанностей.
        answer:
          - >-
            Каждое изменение в прод — через ревью и конвейер (pipeline), без ручных правок на сервере.
          - >-
            Доступ к проду — по заявке и с журналом (ledger); временное повышение прав ограничено
            сроком.
          - >-
            Логи доступа и изменений неизменяемы и хранятся заданный срок.
          - >-
            Процедуры описаны — инцидент (incident), изменение, доступ, — и есть доказательства, что
            они исполняются.

  - id: pitch-and-demo
    title: "Питч и демо: первые три минуты"
    side: technical
    domain: fintech
    intro: >-
      Пока идёт знакомство, тебя уже оценивают по тому, как ты рассказываешь. Структура одна
      на все вопросы защиты: решение, почему так, чем заплатил, когда передумаю, где
      доказательство. Ответ без ссылки на тест или решение звучит как мнение.
    wiki_refs: [limits-risk-and-trade-finance, incident-response-and-postmortems]
    questions:
      - id: pitch-60-seconds
        question: "Расскажи про своё решение за минуту."
        likelihood: high
        tags: [demo, scope]
        asks: >-
          Есть ли один скелет рассказа: что за сервис, какое требование главное, чем оно
          доказано, — или человек перечисляет технологии и надеется, что перебьёт.
        answer:
          - >-
            Начинаю с одной фразы о смысле: сервис держит лимит программы SCF (supply chain
            finance) в реальном времени — резерв (reservation) при одобрении инвойса,
            освобождение (release) при погашении, сверка (reconciliation) с казначейством
            (treasury) через Kafka.
          - >-
            Сразу называю главное требование: никогда не выдать больше лимита, поэтому всё
            построено вокруг одной короткой транзакции PostgreSQL с замком на строке
            программы (row lock).
          - >-
            Дальше форма: модульный монолит, один образ и две роли — api для REST, worker для
            Kafka, плюс outbox и джобы.
          - >-
            Закрываю доказательством: от лишнего отказался сознательно — gRPC, Redis,
            Debezium, микросервисы — и записал, когда передумаю; каждое требование PRD
            доказано тестом с его номером в имени.
        traps:
          - >-
            Начать с технологий. Слушателя интересует, какую задачу решает система; стек он
            спросит сам.
          - >-
            Сказать «микросервисы», если это монолит: рассыпется на первом уточняющем
            вопросе, и дальше не поверят уже ничему.
        follow_ups:
          - Что здесь самое сложное?
      - id: pitch-three-minutes
        question: "Три минуты — тот же питч плюс три истории. Какие истории выберешь?"
        likelihood: medium
        tags: [demo, tests]
        asks: >-
          Умеешь ли подняться с описания на уровень доказательств и не растянуться при этом
          на десять минут.
        answer:
          - >-
            Лимит не пробить: FOR UPDATE по строке программы и SQL-страж в WHERE. Тест AC-01 —
            пятьдесят одновременных резервов (reservation) при лимите на десять, успешных
            ровно десять.
          - >-
            Повторы безопасны: ключ идемпотентности (idempotency) пишется в той же
            транзакции, без FOR UPDATE; второй запрос ждёт на уникальном индексе и получает
            сохранённый ответ первого.
          - >-
            Сверка (reconciliation) без слепой перезаписи: watermark отличает «банк ещё не
            видел» от «банк потерял». Если резерв потерян, держим HOLD и поднимаем тревогу, а
            не освобождаем.
          - >-
            Каждая история заканчивается тем, где лежит доказательство: номер теста или
            решение в ADR.
        traps:
          - >-
            Рассказывать четыре истории вместо трёх. Три истории по три минуты — это уже
            десять минут, и слушать перестают.
      - id: demo-script
        question: "Что покажешь на демо и в каком порядке?"
        likelihood: high
        tags: [demo, api]
        asks: >-
          Готов ли сценарий, который за десять минут показывает инвариант, идемпотентность,
          тенанта и журнал, — а не экран Swagger с эндпоинтами.
        answer:
          - >-
            Сначала README с таблицей «требование → где доказательство»: это отвечает на
            вопрос «а это точно сделано» раньше, чем он прозвучит.
          - >-
            Дальше Swagger: Authorize локальным OAuth2, где client id и есть банк; чтение
            доступности (availability) — суммы строками, в JSON нет float.
          - >-
            Потом резерв (reservation) по EUR-инвойсу (invoice): курс (FX rate) от
            казначейства (treasury), округление вверх, курс сохранён в резерве.
          - >-
            Повтор с тем же Idempotency-Key — тот же ответ и тот же код; тот же ключ с другим
            телом — 422 idempotency-key-mismatch.
          - >-
            Тенант: тот же запрос токеном второго банка даёт 404, а не 403.
          - >-
            Журнал (ledger): только дописывается, триггер в базе запрещает UPDATE и DELETE.
          - >-
            В конце make demo: семь сценариев через настоящую Kafka — урезание лимита,
            дубль, беспорядок, битое письмо в DLQ, устаревший курс, опоздавший снимок.
        traps:
          - >-
            Показывать код в редакторе. Демо — про поведение; код смотрят в репозитории, и
            время на него уже потрачено там.
        follow_ups:
          - А если Kafka не поднялась?
      - id: demo-failure
        question: "Демо не поднялось. Что делаешь?"
        likelihood: medium
        tags: [demo, ops]
        asks: >-
          Спокойствие и запасной путь: не чинить вживую, а показать то же самое по README,
          тестам и записанным цифрам.
        answer:
          - >-
            Не чиню на созвоне: живая отладка съедает время и читается как паника.
          - >-
            Переключаюсь на README, тесты и цифры: доказательство то же, источник другой.
          - >-
            Говорю прямо, что именно не поднялось и что проверю после звонка.
          - >-
            Заранее держу прогон make demo на записи, чтобы был запас, если Docker на машине
            не поднимется.
        traps:
          - >-
            Молча ковыряться в терминале. Пауза без объяснения читается хуже, чем сломанное
            демо.

  - id: tradeoffs
    title: "Трейд-оффы: почему так, а не иначе"
    side: technical
    domain: architecture
    intro: >-
      Главная проверка senior-уровня: названа ли альтернатива, и названа ли цена. Каждый
      ответ держится на четырёх шагах — решение, почему, чем заплатил, когда передумаю.
      Ответ без «чем заплатил» звучит как реклама.
    wiki_refs: [modular-monolith-vs-services, resiliency-timeouts-retries-and-bulkheads, consistency-models-and-business-tolerance]
    questions:
      - id: tradeoff-for-update
        question: "Почему FOR UPDATE, а не атомарный UPDATE с условием в WHERE?"
        likelihood: high
        tags: [tradeoff, postgres, concurrency]
        asks: >-
          Знаешь ли, что оба варианта корректны, и можешь ли объяснить, почему выбрал второй
          по счёту.
        answer:
          - >-
            Атомарное условие в WHERE у меня тоже есть — как страж: лимит проверяется в том же
            операторе, что и запись.
          - >-
            Но резерву (reservation) нужно больше одной строки: курс (FX rate), натуральный
            ключ, журнал (ledger), outbox, сохранённый ответ под ключом идемпотентности.
          - >-
            Всё это обязано попасть в одну транзакцию (transaction) вместе с проверкой лимита,
            иначе поток рвётся на середине.
          - >-
            FOR UPDATE даёт это одним замком на строку программы (row lock) и предсказуемый
            порядок блокировок.
        traps:
          - >-
            Сказать «так надёжнее» и остановиться. Вторая половина ответа — чем заплатили:
            записи по одной программе (program) идут последовательно.
      - id: tradeoff-optimistic-locking
        question: "Почему не оптимистичная блокировка?"
        likelihood: high
        tags: [tradeoff, postgres, concurrency]
        asks: >-
          Понимаешь ли, во что превращается compare-and-swap на горячей строке, и знаешь ли,
          для чего версия всё-таки осталась.
        answer:
          - >-
            На горячей строке она превращается в шторм повторов (retry) и непредсказуемую
            задержку: проигравший перечитывает и пробует снова.
          - >-
            Пессимистичный замок короткой транзакции честнее: очередь вместо лотереи.
          - >-
            Версия при этом осталась — для ETag и для пересчёта плана сверки
            (reconciliation), но не как способ занять место.
          - >-
            Граница решения: при редких и разрозненных записях оптимистичный вариант был бы
            дешевле.
      - id: tradeoff-hot-program
        question: "Горячая программа — узкое место?"
        likelihood: high
        tags: [tradeoff, nfr, concurrency]
        asks: >-
          Признаёшь ли ограничение и можешь ли назвать цифру, после которой оно начнёт болеть.
        answer:
          - >-
            Да, сознательно: все записи по одной программе (program) идут последовательно.
          - >-
            Цифра: двадцать записей в секунду, p95 резерва (reservation) до 58 мс. Для SCF
            это много — тысячи инвойсов (invoice) в день на банк, а не в секунду.
          - >-
            Следующий шаг назван: capacity buckets — лимит (credit limit) делится на N строк,
            резерв берёт строку с запасом, чтение суммирует; конкуренция падает в N раз.
          - >-
            Порядок работ важен: сначала измерить потолок, потом строить. Строить buckets, не
            зная потолка, — это оптимизация вслепую.
        traps:
          - >-
            Сказать «масштабируется горизонтально». Горизонтально масштабируется api; инвариант
            живёт в одной строке, и это разные утверждения.
      - id: tradeoff-postgres-only
        question: "Почему PostgreSQL — единственный источник правды, а не счётчик в Redis?"
        likelihood: high
        tags: [tradeoff, postgres, nfr]
        asks: >-
          Видишь ли, что кэш значения, которое не может устареть, — это инвалидация внутри
          транзакции, то есть сложность без выигрыша.
        answer:
          - >-
            Одна транзакция держит всё: состояние, журнал (ledger), inbox, outbox и ключ
            идемпотентности. Второй источник правды это ломает.
          - >-
            Чтение уже занимает три-четыре миллисекунды: кэшировать нечего.
          - >-
            Счётчик в Redis пришлось бы инвалидировать внутри транзакции базы — сложность,
            которая ничего не ускоряет.
          - >-
            Чем заплатили: все чтения идут на primary. Когда нагрузка на чтение станет
            проблемой — реплика (replica), потом кэш.
      - id: tradeoff-outbox-vs-debezium
        question: "Почему outbox с опросом, а не Debezium?"
        likelihood: high
        tags: [tradeoff, kafka]
        asks: >-
          Сравниваешь ли по гарантиям, а не по модности, и знаешь ли цену логической
          репликации.
        answer:
          - >-
            Гарантии те же — at-least-once; выигрыша в корректности Debezium не даёт.
          - >-
            Добавляет вторую инфраструктуру: Kafka Connect, logical WAL и риск раздуть WAL при
            остановленном слоте.
          - >-
            Outbox с курьером на опросе не требует ничего нового и не теряет событий.
          - >-
            Граница: переходить, когда курьер перестаёт успевать. Потолок у одного курьера
            есть, и он честно назван слабым местом.
        traps:
          - >-
            Сказать «Debezium надёжнее». Надёжность здесь не отличается — отличается задержка
            и стоимость эксплуатации.
      - id: tradeoff-orm-and-schema
        question: "Почему Kysely, а не ORM, и почему zod в OpenAPI, а не декораторы Nest?"
        likelihood: medium
        tags: [tradeoff, api, postgres]
        asks: >-
          Понимание, что ключевая логика этого сервиса живёт в SQL и в контракте, и что ORM
          спрятал бы именно её.
        answer:
          - >-
            Ключевая логика — в SQL: замки, ON CONFLICT, set-based сверка через unnest. ORM
            спрятал бы ровно то, что надо показать на ревью.
          - >-
            Схема zod одна и для валидации, и для контракта; конвейер сравнивает
            закоммиченный openapi.yaml с генерируемым, поэтому контракт не может разойтись с
            кодом.
          - >-
            Цена: больше SQL руками и никаких декораторов Nest.
          - >-
            Nest при этом остаётся только во входных адаптерах: домен и use cases
            тестируются без фреймворка.
      - id: tradeoff-no-grpc
        question: "В вакансии есть gRPC — почему у тебя его нет?"
        likelihood: medium
        tags: [tradeoff, api, scope]
        asks: >-
          Отличаешь «нет потребителя» от «не умею», и можешь ли оценить цену второго
          транспорта на денежном сервисе.
        answer:
          - >-
            Потребителя нет: единственный клиент — REST из задания. Второй транспорт удваивает
            границу денежного сервиса без пользы.
          - >-
            Это решение записано, а не забыто: отдельный ADR с условием пересмотра.
          - >-
            Когда появится вызывающий, адаптер займёт около дня: use cases от транспорта не
            зависят.
          - >-
            Опыт с gRPC есть, и в вакансии просят опыт, а не фичу без потребителя.
        traps:
          - >-
            Оправдываться. Ответ силён именно тем, что называет условие, при котором решение
            изменится.

  - id: production
    title: "Продакшен: топология, отказы, миграции"
    side: technical
    domain: infra
    intro: >-
      Вопросы «как это будет жить» отделяют домашнее задание от production code. Ждут
      конкретики: что за сервис перед базой, что рвётся при failover, какой SLO и какой
      алерт его поймает.
    wiki_refs: [aws-database-operations, kubernetes-workload-objects, slos-and-error-budgets, postgres-zero-downtime-migrations]
    questions:
      - id: prod-topology-aws
        question: "Как это живёт в AWS?"
        likelihood: high
        tags: [ops, nfr]
        asks: >-
          Совпадает ли топология в голове с тем, что лежит в репозитории, и есть ли у ролей
          понятная причина существовать.
        answer:
          - >-
            Вход: ALB или ingress на api (ECS или EKS, N реплик, порт 3000); ops-порт живёт
            только внутри VPC.
          - >-
            MSK по IAM и TLS: worker двумя ролями — консьюмеры (consumer) делят партиции
            (partition), курьер outbox один активный по lease, второй в резерве.
          - >-
            RDS или Aurora Multi-AZ и RDS Proxy; секреты из Secrets Manager в переменные
            окружения; OpenTelemetry в CloudWatch и X-Ray; ключи IdP по JWKS.
          - >-
            api масштабируется по CPU и задержке, координации нет: блокирует база.
          - >-
            migrate — Job до раскатки; readiness красный, пока не записана последняя миграция
            (migration).
        traps:
          - >-
            Рисовать микросервисы, которых нет. Топология должна совпадать с репозиторием, и
            это первое, что сверят.
      - id: prod-failover
        question: "Что будет при failover базы?"
        likelihood: high
        tags: [ops, postgres]
        asks: >-
          Понимаешь ли, что рвутся транзакции, и что ключ идемпотентности при этом
          откатывается вместе с ними.
        answer:
          - >-
            Рвутся только текущие транзакции (57P01, 08006) и откатываются целиком — вместе с
            ключом идемпотентности (idempotency).
          - >-
            Клиент получает 503 и повторяет с тем же ключом: ключ откатился, поэтому повтор
            снова даёт ровно один эффект.
          - >-
            RPO определяется бэкапами и синхронной репликой Multi-AZ — около нуля для отказа
            зоны доступности; RTO — failover плюс прогрев, порядка минуты-двух.
          - >-
            После восстановления на точку во времени сверка (reconciliation) с казначейством
            (treasury) выравнивает состояние, а outbox доотправляет события.
        traps:
          - >-
            Сказать «переключится на реплику и всё продолжит работать». Транзакции рвутся, и
            то, что клиент это увидит, — часть ответа.
      - id: prod-slo-alerts
        question: "Какие SLO и какие алерты?"
        likelihood: high
        tags: [nfr, ops]
        asks: >-
          Меришь ли ты смысл домена, а не только код ответа, и связаны ли алерты с
          метриками, которые действительно есть.
        answer:
          - >-
            Доступность API 99,9% за тридцать дней по коду ответа; задержка резерва
            (reservation) p95 не выше 50 мс.
          - >-
            Свежесть казначейства p95 не выше 5 секунд — по лагу консьюмера со стороны
            брокера, а не по самоотчёту сервиса.
          - >-
            Отставание outbox: меньше тысячи событий и меньше минуты.
          - >-
            Корректность: ноль программ с расхождением журнала (ledger) и проекции.
          - >-
            Алерты как код в репозитории: DLQ растёт, outbox отстаёт, инвариант разошёлся,
            программа (program) в превышении (over limit), доля ошибок API.
        traps:
          - >-
            Перечислить только технические метрики. Половина алертов здесь — про смысл
            домена, и именно их ждут.
      - id: prod-capacity
        question: "Как масштабировать: соединения, горячая программа, сто банков?"
        likelihood: high
        tags: [nfr, ops]
        asks: >-
          Есть ли числа и границы, и понимаешь ли, что делить по операциям нельзя.
        answer:
          - >-
            Соединения: (api + worker) × 10 меньше max_connections, иначе RDS Proxy. Код уже
            совместим с transaction pooling — сессионного состояния нет.
          - >-
            Горячая программа: сначала замер потолка, потом capacity buckets.
          - >-
            Сто банков — ячейки: тот же образ, своя база на банк, маршрутизация по тенанту
            (tenant).
          - >-
            По операциям делить нельзя: резерв (reservation) и освобождение (release) связаны
            одним инвариантом, это одна транзакция, а не два сервиса.
        traps:
          - >-
            Предложить шардирование по идентификатору инвойса (invoice). Инвариант живёт на
            программе, а не на инвойсе, — шардирование по инвойсу его не защищает.
      - id: prod-security
        question: "Что с безопасностью и что сознательно не сделано?"
        likelihood: medium
        tags: [auth, ops]
        asks: >-
          Отличаешь ли сделанное от обещанного, и умеешь ли назвать дыру раньше, чем её
          назовут.
        answer:
          - >-
            JWT: издатель, аудитория, срок, допуск часов тридцать секунд, scopes, отказ по
            умолчанию; на незнакомый kid jose перечитывает JWKS.
          - >-
            Тенант (tenant) только из токена и никогда из тела; ключи в базе составные по
            тенанту; чужое — 404.
          - >-
            Границы: zod на HTTP и на Kafka, лимит размера тела, ошибки по RFC 9457 без
            внутренностей, ops-порт не выходит наружу, образ non-root.
          - >-
            В конвейере: CodeQL, Trivy по образу и lockfile, gitleaks, ZAP baseline.
          - >-
            Не сделано и названо честно: rate limiting — на gateway, mTLS — через mesh, ZAP не
            сканирует аутентифицированное API.
        traps:
          - >-
            Ответить «всё закрыто». Интервьюер ждёт список того, что осталось за границей
            объёма, — это и есть проверка зрелости.
  - id: edge-cases
    title: "Граничные случаи: что покажет тест"
    side: technical
    domain: fintech
    intro: >-
      Здесь проверяют не знание теории, а память о том, что уже ломалось. Называть сценарий,
      поведение и доказательство: интервьюер сверяет, совпадает ли твой рассказ с кодом.
    wiki_refs: [idempotency-and-once-only-effects, limits-risk-and-trade-finance, postgres-mvcc-isolation-and-locking]
    questions:
      - id: edge-money-boundaries
        question: "Назови граничные случаи по деньгам и что вернёт API."
        likelihood: high
        tags: [money, fx, api]
        asks: >-
          Различаешь ли 400 от 422 — «ты сломал запрос» и «состояние не позволяет» — и помнишь
          ли, где именно деньги теряются.
        answer:
          - >-
            Сложение дробных не проблема по построению: деньги — целые минорные единицы (minor
            units), и это стерегут property-тесты.
          - >-
            У динара три знака: сумма «100.00» для KWD — 400 validation-error; сумма не больше
            нуля или мусорный формат — тоже 400.
          - >-
            Сумма больше тридцати двух символов — 400, а не 500: переполнение поймали на
            ревью, а не в проде.
          - >-
            Резерв (reservation) в EUR на USD-программу (program) — перевод с округлением
            вверх, курс (FX rate) сохранён; нет курса или он старше 24 часов — 422
            fx-rate-unavailable.
          - >-
            Освобождение (release) в чужой валюте — 400; освободить больше остатка — 422
            release-exceeds-remaining.
        traps:
          - >-
            Сказать «валидация есть». Разница 400 и 422 — это разница между ошибкой клиента и
            состоянием системы, и её спрашивают именно здесь.
      - id: edge-idempotency-corners
        question: "Что с ключом идемпотентности в неудобных случаях?"
        likelihood: high
        tags: [idempotency, api]
        asks: >-
          Отличаешь ли ключ запроса от натурального ключа инвойса, и знаешь ли, что бывает с
          ключом на неудачном запросе.
        answer:
          - >-
            Тот же ключ и то же тело — тот же ответ и тот же код, включая 201.
          - >-
            Тот же ключ с другим телом — 422 idempotency-key-mismatch, а не тихая перезапись.
          - >-
            Ошибка валидации с ключом: ключ не занимается, исправленный запрос пройдёт.
          - >-
            Тот же инвойс (invoice) без ключа — 409 reservation-conflict: натуральный ключ
            работает и сам по себе.
          - >-
            Таймаут клиента после коммита — повтор с ключом вернёт тот же 201, второго резерва
            не будет.
          - >-
            Обрыв базы посреди транзакции (transaction) — откат целиком, 503, ключ свободен.
        traps:
          - >-
            Смешать два механизма в один ответ. Ключ запроса и натуральный ключ инвойса решают
            разные конфликты, и это стоит сказать явно.
      - id: edge-concurrency-corners
        question: "Какие конкурентные случаи ты проверил?"
        likelihood: high
        tags: [concurrency, tests]
        asks: >-
          Помнишь ли сценарии, которые действительно ломались, а не только общее «покрыл
          тестами».
        answer:
          - >-
            Пятьдесят одновременных резервов (reservation) при лимите на десять — успешных
            ровно десять (AC-01).
          - >-
            Два одновременных запроса с одним ключом: второй ждёт на уникальном индексе и
            получает ответ первого.
          - >-
            Два освобождения одного резерва одновременно — без дедлока (deadlock), потому что
            внешний ключ сделан отложенным.
          - >-
            Тот же releaseRef с другой суммой — 409 release-ref-mismatch.
          - >-
            Программа изменилась между планом сверки и замком — план пересчитывается по
            версии.
        traps:
          - >-
            Отвечать «покрыл тестами». Называют сценарии: интервьюер проверяет, помнишь ли ты,
            что именно ломалось в каждом.
      - id: edge-auth-corners
        question: "Что отдаёшь без токена, с чужим scope и при упавшем IdP?"
        likelihood: medium
        tags: [auth, tenancy]
        asks: >-
          Различаешь ли 401, 403, 404 и 503 по смыслу, или все четыре для тебя «ошибка
          доступа».
        answer:
          - >-
            Без токена, с истёкшим токеном, с чужим audience — 401; нет нужного scope — 403.
          - >-
            Чужая программа (program) — 404, чтобы не подтверждать её существование.
          - >-
            Упавший IdP — 503, а не 401: иначе клиент пойдёт перевыпускать токен, который ни
            при чём.
          - >-
            Огромное тело без токена — 401 до разбора тела, а не 413.
          - >-
            Ключ Kafka не того банка — DLQ tenant-mismatch: тенанту (tenant) из тела не
            доверяем.
      - id: edge-time-and-infra
        question: "Часы между репликами, SIGTERM посреди запроса, недокатанные миграции."
        likelihood: medium
        tags: [ops, postgres]
        asks: >-
          Думаешь ли о вещах, которые не видны на ноутбуке: расхождение часов, дренаж,
          readiness по схеме.
        answer:
          - >-
            Время lease и retention берётся из базы (now()), а не из процесса: часы реплик
            (replica) расходятся, и это не гипотеза.
          - >-
            SIGTERM посреди запроса: текущий доделывается, новые не принимаются, закладки
            ставятся; на весь shutdown 25 секунд, консьюмеру (consumer) — 40%.
          - >-
            Миграции (migration) не докатились — readiness красный, трафика нет.
          - >-
            Retention ниже 24 часов в конфиге — сервис не стартует: окно идемпотентности
            (idempotency) нельзя сократить случайно.

  - id: edge-stream
    title: "Kafka и сверка: края"
    side: technical
    domain: messaging
    intro: >-
      Второй вход в модуль — поток от казначейства, и почти вся сложность живёт в его краях:
      дубли, порядок, битые письма, опоздавшие снимки. Каждый ответ заканчивается тем, что
      произойдёт с лентой дальше.
    wiki_refs: [kafka-partitioning-and-ordering, kafka-dead-letter-handling, reconciliation-and-drift]
    questions:
      - id: edge-kafka-duplicates-and-order
        question: "Дубль письма, письма не по порядку, ключ не того банка — что произойдёт?"
        likelihood: high
        tags: [kafka, idempotency]
        asks: >-
          Знаешь ли, что дедупликация по бизнес-полям ломается, а порядок держится только
          внутри партиции.
        answer:
          - >-
            Одно письмо дважды — один эффект: inbox по идентификатору сообщения, отметка в той
            же транзакции (transaction).
          - >-
            Номер последовательности три, потом два — второе пропускается как устаревшее, с
            записью в лог.
          - >-
            Ключ партиции (partition) — программа (program): порядок внутри ленты
            сохраняется, и события одной программы не перемешиваются.
          - >-
            Ключ Kafka не того банка — DLQ tenant-mismatch: тенант (tenant) берём из проверенной
            стороны, а не из тела.
          - >-
            Падение до коммита офсета (offset) — повторная доставка, inbox отсеет.
        traps:
          - >-
            Дедуплицировать по сумме и номеру инвойса (invoice). Так теряются настоящие разные
            события с совпавшими полями.
      - id: edge-kafka-poison-and-outage
        question: "Битое письмо и недоступная база — как ведёт себя лента?"
        likelihood: high
        tags: [kafka, ops]
        asks: >-
          Понимаешь ли, что бесконечный повтор блокирует всю ленту, а пауза при недоступной
          базе — это не DLQ.
        answer:
          - >-
            Битый JSON или неизвестная валюта — в DLQ, метрика и алерт; следующее письмо
            обрабатывается, лента не встаёт.
          - >-
            База недоступна — пауза ленты с backoff, без DLQ: это временный отказ, а не плохие
            данные.
          - >-
            Разбор DLQ — по runbook, повторная доставка после исправления, а не «доставим ещё
            раз и посмотрим».
          - >-
            Метрика на размер DLQ и на долю отказов: очередь отказов не должна расти тихо.
      - id: edge-snapshot-watermark
        question: "Как отличаешь «банк ещё не видел» от «банк потерял»?"
        likelihood: high
        tags: [reconciliation, kafka]
        asks: >-
          Ключевая проверка домена: две очень разные ситуации выглядят одинаково, если
          сравнивать только суммы.
        answer:
          - >-
            «Банк ещё не видел» — резерв создан выше watermark: он свежий, и снимок (snapshot)
            его просто не мог содержать, поэтому он остаётся.
          - >-
            «Банк потерял» — резерв ниже watermark и в снимке его нет: это настоящая ошибка,
            поэтому HOLD и расхождение (drift), а не освобождение.
          - >-
            Снимок старше уже применённого пропускается по номеру последовательности.
          - >-
            Ошибки несимметричны: ложное освобождение — это перевыдача денег, ложное удержание
            — временное неудобство.
        traps:
          - >-
            Сказать «применяю снимок и пересчитываю». Именно это и теряет только что обещанные
            поставщику (supplier) деньги.
      - id: edge-snapshot-limits
        question: "Снимок на пятьдесят тысяч и одну строку. И тысячи расхождений в нём."
        likelihood: medium
        tags: [reconciliation, nfr]
        asks: >-
          Есть ли предел, названный числом, и понимаешь ли, почему событие о расхождении нельзя
          отдавать целиком.
        answer:
          - >-
            Снимок больше пятидесяти тысяч резервов уходит в DLQ до любых проверок: это предел
            разумного сообщения, и он настраивается.
          - >-
            Событие о расхождении обрезается до ста строк плюс счётчик и признак «обрезано»:
            получатель видит масштаб, а не стену текста.
          - >-
            Два одинаковых снимка одновременно: один применяется, второй распознаётся как
            дубль, staging-таблица остаётся пустой.
          - >-
            Расхождение — инцидент первого приоритета: пишем корректировку и поднимаем алерт,
            а не «починим молча».
      - id: edge-snapshot-fallback
        question: "Снимок пришёл без watermark. Что делаешь?"
        likelihood: medium
        tags: [reconciliation, kafka]
        asks: >-
          Есть ли у тебя честный ответ на неполные данные казначейства, или система просто
          ломается.
        answer:
          - >-
            Откатываюсь на время с запасом: всё, что старше пяти минут, считаю известным банку;
            пишу в лог reconciliation_fallback.
          - >-
            Запас нужен, чтобы свежие резервы не попали в «банк потерял» из-за расхождения
            часов.
          - >-
            Это решение записано в ADR: fallback — допущение, а не норма.
          - >-
            Метрика на долю fallback-применений: если она растёт, казначейство перестало слать
            watermark, и это надо чинить на их стороне.

  - id: hard-questions
    title: "Трудные вопросы: готовый ответ на каждый"
    side: technical
    domain: architecture
    intro: >-
      Эти вопросы задают почти всегда, и почти всегда в этой формулировке. Ответ должен быть
      коротким и заканчиваться тем, где лежит доказательство: длинный ответ здесь читается
      как оправдание.
    wiki_refs: [outbox-idempotency-and-sagas, consistency-models-and-business-tolerance, api-contract-evolution]
    questions:
      - id: hard-exactly-once
        question: "Exactly-once — как ты его обеспечиваешь?"
        likelihood: high
        tags: [idempotency, kafka]
        asks: >-
          Знаешь ли, что транзакции брокера не покрывают запись в базу, и не пытаешься ли
          продать «ровно один раз» бесплатно.
        answer:
          - >-
            Никакого exactly-once: at-least-once плюс идемпотентный (idempotency) эффект.
          - >-
            На входе — inbox по идентификатору сообщения; на выходе — идентификатор события в
            outbox.
          - >-
            Транзакции Kafka не покрывают запись в PostgreSQL: эффект живёт в базе, и
            гарантировать надо именно её.
          - >-
            Проверка на практике: одно письмо дважды — один эффект; падение до коммита офсета
            — повторная доставка, inbox отсеет.
      - id: hard-crash-between-commit-and-send
        question: "Упал между коммитом и отправкой события. Что произойдёт?"
        likelihood: high
        tags: [kafka, idempotency]
        asks: >-
          Понимаешь ли, почему событие пишется в базу, а не отправляется сразу.
        answer:
          - >-
            Событие уже в outbox: коммит состояния и запись события — одна транзакция
            (transaction), поэтому «сохранил, но не отправил» невозможно.
          - >-
            Курьер прочитает и отправит; падение между отправкой и отметкой даёт дубль.
          - >-
            Дубль безопасен: получатели дедуплицируют по идентификатору события.
          - >-
            Обратное направление — «отправил, но не сохранил» — исключено тем же порядком.
      - id: hard-two-couriers
        question: "Два курьера outbox одновременно. Кто прав?"
        likelihood: medium
        tags: [kafka, concurrency]
        asks: >-
          Знаешь ли про fencing, или считаешь, что «блокировка по строке» решает всё.
        answer:
          - >-
            Lease с epoch: отметку «опубликовано» может поставить только владелец с текущим
            epoch и неистёкшим сроком — это одно SQL-выражение.
          - >-
            Старый курьер может прислать дубль, но не может нарушить порядок отметок.
          - >-
            Lease тридцать секунд и продлевается на каждой пачке; пачка — двести событий.
          - >-
            Зависший курьер (сборка мусора, сеть) отдаёт lease, новый подхватывает со следующим
            epoch.
      - id: hard-hold-vs-release
        question: "Почему при расхождении HOLD, а не RELEASE?"
        likelihood: high
        tags: [reconciliation, tradeoff]
        asks: >-
          Понимаешь ли асимметрию ошибок, а не только «так безопаснее».
        answer:
          - >-
            Ошибки несимметричны: ложное освобождение (release) — это перевыдача денег, ложное
            удержание — временное неудобство.
          - >-
            Освобождение необратимо, удержание обратимо — поэтому по умолчанию удерживаем.
          - >-
            Лимит (credit limit) при этом занят больше, чем мог бы, и это видно в загрузке
            (utilization).
          - >-
            Режим переключается настройкой по решению банка, а не правкой кода.
      - id: hard-health-without-token
        question: "В задании «все эндпоинты аутентифицированы», а health у тебя без токена."
        likelihood: high
        tags: [auth, scope]
        asks: >-
          Замечаешь ли противоречие сам и можешь ли его объяснить, а не замолчать.
        answer:
          - >-
            Это осознанная трактовка, и она записана как допущение: ops-порт внутренний,
            ingress его не маршрутизирует, оркестратор не шлёт JWT.
          - >-
            Весь бизнес-API под токеном, без исключений.
          - >-
            При требовании закрыть метрики — флаг на токен для /metrics, без переделки
            остального.
          - >-
            Формулировка для ответа: «я различаю бизнес-эндпоинты и служебные пробы, и вот
            граница, на которой это различение опирается».
        traps:
          - >-
            Сказать «health не считается». Считается; защищается граница и её обоснование.
      - id: hard-mutation-tests
        question: "Как ты убедился, что тест не проходит сам по себе?"
        likelihood: high
        tags: [tests]
        asks: >-
          Проверяют отношение к зелёному цвету: тест, который не может упасть, — это
          документация, а не доказательство.
        answer:
          - >-
            Мутационные пробы: убрал SQL-страж — тест на лимит упал; убрал сравнение с журналом
            (ledger) — упал тест инварианта; убрал fencing — упал тест курьера.
          - >-
            Тесты конкурентности идут на настоящей базе, а не на моке: инвариант живёт в
            PostgreSQL, и проверять его надо там.
          - >-
            Повторное ревью свежим контекстом: ревью нашло ошибку при полностью зелёных
            тестах, потому что тест проверял не то.
          - >-
            Проверка утверждений в документации: каждое утверждение ссылается на существующий
            тест, и это проверяется автоматически.
      - id: hard-domain-without-framework
        question: "Почему NestJS только в адаптерах?"
        likelihood: medium
        tags: [scope, api]
        asks: >-
          Отличаешь ли домен от транспорта, и не придётся ли переписывать бизнес-логику при
          смене фреймворка.
        answer:
          - >-
            Nest живёт во входных адаптерах и в сборке приложения; домен и use cases от него не
            зависят.
          - >-
            Тесты домена идут без фреймворка, поэтому они быстрые и не падают от правок в
            инфраструктуре.
          - >-
            Замена транспорта — адаптер, а не переписывание правил резерва (reservation).
          - >-
            Цена: чуть больше ручной сборки, чем даёт модуль Nest из коробки.
      - id: hard-what-not-finish
        question: "Что не успел и что сделал бы иначе?"
        likelihood: high
        tags: [scope, process]
        asks: >-
          Зрелость: называешь границы сам и по приоритету, а не признаёшься под давлением.
        answer:
          - >-
            Измерить потолок одной программы и сделать capacity buckets — первое, за что взялся
            бы.
          - >-
            Экспортировать лаг консьюмера из самого сервиса, а не только со стороны брокера.
          - >-
            Скан аутентифицированного API сканером, а не только baseline.
          - >-
            Прогнать конвейер (pipeline) в GitHub и добавить тест readiness для недокатанной
            схемы.
          - >-
            Порядок важен: это список по влиянию на риск, а не список того, что не доделано.
      - id: hard-budget
        question: "Сколько времени это заняло и как ты его распределял?"
        likelihood: medium
        tags: [process, scope]
        asks: >-
          Умеешь ли планировать работу по этапам и честно говорить о расширении бюджета.
        answer:
          - >-
            Плановый бюджет — пять часов на первые три этапа: каркас, домен, API и тесты.
          - >-
            Четвёртый этап — нагрузка, сканеры, манифесты Kubernetes — доделан после расширения
            бюджета, и это записано в журнале.
          - >-
            Расширение названо, а не спрятано: «бюджет вырос, потому что я решил проверить
            нагрузку на настоящей базе».
          - >-
            Журнал бюджета лежит в репозитории рядом с состоянием проекта, а не в памяти.
  - id: ai-questions
    title: "Вопросы про ИИ: их зададут"
    side: technical
    domain: architecture
    intro: >-
      В репозитории видно, как он сделан, поэтому вопрос прозвучит. Позиция одна: ИИ —
      инструмент, ответственность и решения мои. Говорить спокойно, конкретно и без
      оправданий в обе стороны.
    wiki_refs: [incident-response-and-postmortems, mentoring-and-code-review]
    questions:
      - id: ai-who-wrote-the-code
        question: "Это написал ИИ?"
        likelihood: high
        tags: [ai, process]
        asks: >-
          Спокойствие и ответственность: можешь ли назвать свою роль в процессе, не оправдываясь
          и не принижая результат.
        answer:
          - >-
            Код писали ИИ-агенты по моему процессу, а я отвечал за требования, архитектуру,
            ревью и приёмку.
          - >-
            Процесс описан в репозитории: PRD с номерами требований, пять этапов, на каждое
            требование тест с его номером в имени.
          - >-
            Независимое ревью всего, что касается денег и конкурентности, — отдельный шаг
            процесса, а не пожелание.
          - >-
            Проверка утверждений автоматическая: каждое утверждение в документах ссылается на
            существующий тест.
        traps:
          - >-
            Оправдываться или делать вид, что писал всё сам. Оба ответа читаются как неправда
            и проверяются одним вопросом по существу.
      - id: ai-how-verified
        question: "Как проверял, что ИИ не наврал?"
        likelihood: high
        tags: [ai, tests]
        asks: >-
          Есть ли процесс проверки, или только «я всё просматривал».
        answer:
          - >-
            Только по фактам: зелёные команды и цитаты их вывода, а не пересказ.
          - >-
            Мутационные пробы: если убрать защиту, тест обязан упасть — иначе тест ничего не
            доказывает.
          - >-
            Повторное ревью свежим контекстом: оно нашло ошибку, которую зелёные тесты
            пропустили.
          - >-
            Пример: защита искала программу (program) во всех банках, и лимит (credit limit)
            второго банка уходил в DLQ — тест проверял не то, поэтому был зелёным.
        traps:
          - >-
            Сказать «я всё просматривал». Проверка глазами — не процесс; процесс — мутации,
            свежий контекст и автоматическая сверка утверждений с тестами.
      - id: ai-what-you-understand
        question: "Что ты сам понимаешь в этом коде?"
        likelihood: high
        tags: [ai, scope]
        asks: >-
          Проверяют готовность отвечать по существу на любой вопрос и честность в том, чего не
          проверял.
        answer:
          - >-
            Отвечаю на любой вопрос из разделов про домен, деньги, Kafka и сверку
            (reconciliation) без подсказок — это и есть критерий.
          - >-
            Объясняю каждое решение через альтернативу и цену, а не пересказом кода.
          - >-
            Показываю, где проходит инвариант и каким тестом он доказан.
          - >-
            Границы честные: чего не проверял на практике — говорю, что не проверял, и что
            сделал бы, чтобы проверить.

  - id: star-stories
    title: "Истории в формате STAR"
    side: technical
    domain: architecture
    intro: >-
      На «расскажи про сложный баг» нужна одна история с конкретикой, а не список технологий.
      Формат держать жёстко: ситуация, задача, действие, результат — и одна строка про то, что
      изменилось после.
    wiki_refs: [postgres-mvcc-isolation-and-locking, incident-response-and-postmortems, slos-and-error-budgets]
    questions:
      - id: star-deadlock-two-releases
        question: "Расскажи про самый неочевидный баг."
        likelihood: high
        tags: [concurrency, postgres, tests]
        asks: >-
          Умеешь ли доходить до причины, а не до «добавил повторы».
        answer:
          - >-
            Ситуация: два одновременных освобождения (release) одного резерва (reservation)
            зависали.
          - >-
            Задача: найти причину, а не лечить повторами.
          - >-
            Действие: внешний ключ брал разделяемый замок на строку резерва до замка программы
            (row lock) и нарушал порядок блокировок; ключ сделан отложенным, то есть проверка
            ушла на коммит.
          - >-
            Результат: тест проходит, правило порядка блокировок записано в решении — теперь
            его не нарушит следующий.
      - id: star-tenant-leak
        question: "Расскажи, как ревью поймало то, что тесты пропустили."
        likelihood: high
        tags: [tenancy, tests]
        asks: >-
          Понимаешь ли, что зелёный прогон — это не приёмка, и есть ли процесс, который ловит
          слепые зоны тестов.
        answer:
          - >-
            Ситуация: после прогона в чужой сессии всё было зелёным.
          - >-
            Задача: принять работу или найти причину не принимать.
          - >-
            Действие: ревью свежим контекстом показало, что «защита» искала программу
            (program) во всех банках, а требование просило только свою.
          - >-
            Результат: поиск убран, тест переписан так, чтобы проверять именно изоляцию
            тенантов (tenancy); правило «любую логику, пересекающую тенантов, сверять с
            требованием» записано.
      - id: star-cold-start-bench
        question: "Как ты получил честные цифры производительности?"
        likelihood: medium
        tags: [nfr, tests]
        asks: >-
          Отличаешь ли замер от демонстрации: прогрев, порядок фаз, пороги, падение прогона.
        answer:
          - >-
            Ситуация: README обещал 1,3 секунды на горячей программе — цифра выглядела хорошо и
            была неправдой.
          - >-
            Задача: проверить вывод, а не поверить ему.
          - >-
            Действие: поменял фазы местами — медленной стала первая, то есть холодный старт;
            добавил прогрев и пороги в сам прогон.
          - >-
            Результат: честные 19–58 мс, и прогон теперь падает, если требование по задержке не
            выполнено.
      - id: star-dead-alert
        question: "Был ли у тебя алерт, который ничего не мог поймать?"
        likelihood: medium
        tags: [ops, nfr]
        asks: >-
          Смотришь ли на наблюдаемость как на проверяемое утверждение, а не как на список
          правил.
        answer:
          - >-
            Ситуация: правило «DLQ растёт» существовало, а метрики, на которую оно опирается, не
            было.
          - >-
            Задача: заметить это до инцидента, а не во время.
          - >-
            Действие: добавил счётчик и тест на него, поправил документ с алертами.
          - >-
            Результат: наблюдаемость больше не обещает того, чего нет; каждое правило теперь
            указывает на существующую метрику.

  - id: weak-spots
    title: "Слабые места: сказать честно и первым"
    side: technical
    domain: architecture
    intro: >-
      Список слабостей готовится заранее и произносится первым. Признание, которое вытащили из
      тебя, стоит дороже того же признания, сделанного добровольно, — и звучит как диагноз
      вместо силы.
    wiki_refs: [slos-and-error-budgets, kubernetes-workload-objects, container-images-and-supply-chain]
    questions:
      - id: weak-measured-ceiling
        question: "Какой у решения потолок и почему он не измерен?"
        likelihood: high
        tags: [nfr, scope]
        asks: >-
          Отличаешь ли измеренное от предположенного и называешь ли следующий шаг числом.
        answer:
          - >-
            Измерено двадцать записей в секунду на одну программу (program), p95 резерва
            (reservation) до 58 мс.
          - >-
            Потолок не измерен сознательно: для SCF это с запасом — тысячи инвойсов (invoice) в
            день на банк, а не в секунду.
          - >-
            Следующий шаг конкретный: замер потолка, потом capacity buckets.
          - >-
            Формулировка: «сначала измерение, потом оптимизация» — иначе это гадание.
      - id: weak-observability-and-ci
        question: "Какие пробелы в наблюдаемости и в конвейере?"
        likelihood: medium
        tags: [ops, scope]
        asks: >-
          Знаешь ли, где именно проходит граница твоей работы, и не выдаёшь ли заготовку за
          готовое.
        answer:
          - >-
            Лаг консьюмера (consumer) сервис сам не экспортирует: брокер видит его лучше —
            MaxOffsetLag и kafka-exporter.
          - >-
            Конвейер локально зелёный, но в GitHub ни разу не запускался: при первом push это
            проверится.
          - >-
            Манифесты Kubernetes проверены валидацией, но не применялись: Helm и ingress вне
            объёма.
          - >-
            Сканер безопасности — только baseline, аутентифицированный скан следующий шаг.
      - id: weak-k8s-and-scanners
        question: "Kubernetes и сканеры — что реально сделано?"
        likelihood: medium
        tags: [ops, auth]
        asks: >-
          Проверяют, различаешь ли «написано» и «работает», и умеешь ли не преувеличивать
          сделанное.
        answer:
          - >-
            Манифесты прошли kubeconform; в кластере не применялись — и я говорю это прямо.
          - >-
            Образ non-root, сканирование образа и lockfile в конвейере, поиск секретов в
            истории.
          - >-
            ZAP только baseline: аутентифицированное API он не обходит.
          - >-
            Чего не хватает для прода: применение манифестов, ingress, секреты из хранилища,
            и это отдельный список работ.

  - id: vocabulary
    title: "Глоссарий SCF: если заговорят на языке домена"
    side: domain
    domain: fintech
    intro: >-
      На защите доменный язык используют как обычный: anchor, tenor, headroom. Отвечать надо
      тем же словарём и сразу переводить на свою систему — это показывает, что модель у тебя
      одна, а не две.
    wiki_refs: [limits-risk-and-trade-finance, payment-lifecycle, reconciliation-and-drift]
    questions:
      - id: vocab-participants
        question: "Anchor, supplier, buyer, funder — кто есть кто в сделке?"
        likelihood: high
        tags: [money, scope]
        asks: >-
          Свободно ли владеешь четырьмя ролями, или путаешь покупателя с фондером.
        answer:
          - >-
            Поставщик (supplier) отгрузил и ждёт денег; покупатель (buyer, он же anchor) —
            крупная компания, на чей риск смотрит банк.
          - >-
            Фондер (funder) — банк или фонд, который платит поставщику сейчас.
          - >-
            Платформа — система банка, где всё это происходит; наш модуль живёт в ней.
          - >-
            Anchor силён, поэтому ставка ниже: банк оценивает его риск, а не риск маленького
            поставщика.
      - id: vocab-limit-terms
        question: "Limit, capacity, headroom, utilization, drawdown — чем отличаются?"
        likelihood: high
        tags: [money, nfr]
        asks: >-
          Понимаешь ли, что это пять разных чисел, и можешь ли показать, где каждое живёт в
          твоём API.
        answer:
          - >-
            Limit и capacity — одно и то же: максимум, который банк держит в долге
            одновременно, в валюте программы (program).
          - >-
            Headroom — свободный остаток: лимит (credit limit) минус активные резервы
            (reservation); в API это поле доступного (available).
          - >-
            Utilization — загрузка, доля занятого к лимиту; в API отдельным полем, чтобы не
            считать на клиенте.
          - >-
            Drawdown и disbursement — выдача денег; отдельного состояния у нас нет, это
            допущение, и оно записано.
          - >-
            Over limit — занято больше лимита после его урезания: доступное ноль плюс отдельное
            поле превышения.
      - id: vocab-watermark-recon
        question: "Watermark и reconciliation — что это в твоей системе?"
        likelihood: high
        tags: [reconciliation, kafka]
        asks: >-
          Можешь ли объяснить доменный термин механизмом своей системы, а не общим
          определением.
        answer:
          - >-
            Watermark — «учёл ваши события до номера N», и приходит он от казначейства
            (treasury) вместе со снимком (snapshot).
          - >-
            Он нужен, чтобы не путать «банк ещё не видел» с «банк потерял»: в первом случае
            резерв (reservation) остаётся, во втором — удержание и расхождение (drift).
          - >-
            Reconciliation — приведение нашей копии к официальному учёту; источник истины
            (system of record) — казначейство.
          - >-
            У расхождения всегда есть след: корректировка в журнале (ledger) с причиной и
            ссылкой на сообщение.
      - id: vocab-tenor-discount
        question: "Tenor, discount, maturity — назови и объясни на примере."
        likelihood: medium
        tags: [money, fx]
        asks: >-
          Считаешь ли дисконт в голове: ставка, срок и база дней — и знаешь ли, почему база не
          всегда 365.
        answer:
          - >-
            Tenor — срок до оплаты, например девяносто дней; maturity date — дата, когда
            покупатель (buyer) обязан заплатить.
          - >-
            Discount — плата за ожидание: ставка умножается на срок и делится на базу дней;
            при базе 360 шесть процентов годовых на девяносто дней дают полтора процента.
          - >-
            База дней — часть контракта, поэтому она берётся из настроек, а не из константы в
            коде.
          - >-
            Сумма к выплате (payout) и сумма резерва (reservation) — разные числа: резерв
            обычно по номиналу инвойса (invoice).

