id: 7d2f5b91-4c6a-4a3e-9f18-2e5c8b7a1d34
slug: finverity-senior-node-js
lang: ru
title: Finverity · Senior Node.js Engineer — защита тестового и разговор с CTO
summary: >-
  Репетиция под один конкретный заход: вакансия Senior Node.js Engineer в британском
  финтехе на SCF-платформе, тестовое задание Program Capacity & Invoice Reservation и
  техническое интервью на 1–1,5 часа с CTO. Группы идут в том порядке, в котором их
  спрашивают: сначала защита решения, потом Node и данные, потом домен, в конце — аудит
  и комплаенс. high — спросят почти наверняка, medium — всплывает как follow-up.

target:
  role: Senior Node.js / TypeScript Engineer
  company: Finverity (рекрутинг — Itentio)
  domain: fintech
  stack: [Node.js, NestJS, TypeScript, PostgreSQL, Redis, Kafka, Docker, Kubernetes, AWS]

stages:
  - name: Знакомство с рекрутером
    minutes: 30
    note: >-
      Мотивация, релевантный опыт, вилка, сроки выхода, уровень английского. Технику
      почти не спрашивают, но фиксируют, насколько внятно ты рассказываешь о своём
      опыте: это те же навыки, что нужны на созвонах с Product и Support.
  - name: Тестовое задание
    minutes: 120
    note: >-
      Program Capacity & Invoice Reservation: резервы лимита программы, освобождения,
      доступность, поток от казначейства через Kafka, мультивалютность, аутентификация и
      локальный запуск. Оценивают не объём, а отсутствие дыр в ядре и честный README.
  - name: Техническое интервью с CTO
    minutes: 90
    note: >-
      Защита решения и техническая дискуссия. Идут по краям: одновременные запросы,
      дубли и опоздавшие письма, валюты, тенанты, аудит. Плюс общие вопросы про Node,
      Postgres, Kafka и API — на уровне «объясни механизм», а не «перечисли фичи».
  - name: Финальный раунд
    minutes: 30
    note: >-
      CEO и соучредитель. Продукт, культура, ожидания, как ты работаешь с
      неопределённостью. Здесь важнее честность про то, чего ты не знаешь, чем
      вылизанная история успеха.

groups:
  - id: assignment-core
    title: Защита ядра решения
    side: technical
    domain: fintech
    intro: >-
      Первый вопрос почти всегда один и тот же: расскажи, что ты построил. Дальше CTO
      идёт по краям — там, где решение могло развалиться. Держи ответ в форме «три
      операции, один инвариант, где он живёт, что сознательно не сделал».
    wiki_refs: [limits-risk-and-trade-finance, idempotency-and-once-only-effects, reconciliation-and-drift]
    questions:
      - id: assignment-architecture-walkthrough
        question: Расскажи архитектуру сервиса за две минуты. Что в нём есть и почему именно так?
        likelihood: high
        asks: >-
          Есть ли в голове модель целиком — операции, границы, место инварианта, — или
          это набор файлов, написанных по очереди.
        answer:
          - >-
            Сначала три операции и один инвариант (invariant): резерв (reservation), освобождение (release), чтение
            доступности, и занятое никогда не превышает лимит.
          - >-
            Потом границы: HTTP-слой (аутентификация, валидация, идемпотентность),
            доменный слой (переходы резерва), хранилище — единственное место, где лимит (credit limit)
            проверяется.
          - >-
            Дальше два входа в одну модель: синхронный API и консьюмер (consumer) казначейства (treasury).
            Они меняют одни и те же строки, поэтому правила живут в базе, а не в памяти
            сервиса.
          - >-
            В конце — что осталось за рамками: переоценка по курсу (FX rate), UI, настоящий
            провайдер курсов.
        traps:
          - >-
            Перечислять микросервисы вместо операций. Задание на пару часов, и
            количество сервисов уровень не показывает.
        follow_ups:
          - Если бы дали ещё два дня, что сделал бы первым?
      - id: limit-race-atomic-update
        question: Два резерва (reservation) на 800 и 700 тысяч приходят одновременно, свободно миллион. Как гарантируешь, что пройдёт только один?
        likelihood: high
        asks: >-
          Ищут не слово «транзакция», а понимание, что проверка и запись должны быть
          одной операцией в базе.
        answer:
          - >-
            Называю окно «прочитал — проверил — записал» источником бага: два читателя
            видят миллион и оба проходят проверку.
          - >-
            Проверка уезжает внутрь записи: условие в WHERE перепроверяется после того,
            как первая транзакция (transaction) отпустит строку, и ноль обновлённых строк означает
            отказ.
          - >-
            Альтернатива — SELECT FOR UPDATE по строке программы (program) в транзакции (transaction), но тогда
            порядок блокировок надо дисциплинировать, иначе дедлок (deadlock).
          - >-
            Обязательный тест: пятьдесят параллельных резервов (reservation) на лимит (credit limit), которого
            хватает на десять. Успешных должно быть ровно десять.
        traps:
          - >-
            Добавить распределённую блокировку (distributed lock) в Redis поверх строки в базе — второй
            источник правды при живом первом.
          - >-
            Сказать «SERIALIZABLE» и не упомянуть, что это ошибки сериализации и их надо
            ретраить (retry), причём идемпотентно.
        follow_ups:
          - Что произойдёт, если такие запросы придут на разные реплики?
      - id: idempotency-key-design
        question: Клиент не дождался ответа и повторил запрос на резерв (reservation). Что произойдёт?
        likelihood: high
        asks: >-
          Различаешь ли ты повтор и конфликт: тот же запрос с той же суммой против того
          же инвойса с другой суммой.
        answer:
          - >-
            Естественный ключ: один инвойс (invoice) — один активный резерв (reservation), уникальный индекс (index) по
            программе и инвойсу.
          - >-
            Повтор с теми же данными возвращает уже созданный резерв (reservation) и тот же ответ,
            включая код статуса.
          - >-
            Тот же инвойс (invoice) с другой суммой — не повтор, а конфликт: отдельный код и запись
            в журнал (ledger), а не молчаливая перезапись.
          - >-
            Для операций без естественного ключа принимаю Idempotency-Key и храню
            результат вместе с телом ответа.
        traps:
          - >-
            Держать ключ идемпотентности (idempotency) в памяти процесса: после рестарта защита
            исчезает.
      - id: kafka-consumer-dedup
        question: Письмо Kafka пришло дважды. Что именно дедуплицируешь (deduplication) и где ставишь отметку?
        likelihood: high
        asks: >-
          Порядок записи: отметка «обработано» и изменение лимита должны попасть в одну
          транзакцию, иначе остаётся окно, в котором эффект применится дважды.
        answer:
          - >-
            Таблица обработанных сообщений с уникальным идентификатором сообщения или
            парой «программа плюс номер последовательности».
          - >-
            Отметка пишется в той же транзакции (transaction), что и эффект. Падение между шагами тогда
            откатывает (rollback) оба.
          - >-
            Ключ партиционирования (partition) — идентификатор программы (program): порядок сохраняется внутри
            одной ленты, а одна программа живёт в одной ленте.
          - >-
            Дубль после успешной обработки — no-op и метрика, а не ошибка.
        traps:
          - >-
            Дедуплицировать (deduplication) по бизнес-полям вроде суммы и номера инвойса (invoice) и потерять
            настоящие разные события.
      - id: reconciliation-snapshot-asof
        question: Приходит снапшот (snapshot) сверки (reconciliation) за 10:00, а в 10:02 ты зарезервировал ещё миллион. Как его применяешь?
        likelihood: high
        asks: >-
          Ключевая проверка домена: понимаешь ли ты, что снапшот — истина на момент, а не
          истина сейчас.
        answer:
          - >-
            Снапшот (snapshot) несёт момент, на который он верен: время среза и номер
            последовательности. Всё, что старше уже применённого, пропускается с записью в
            лог.
          - >-
            Применяю как базу на момент среза, а сверху накладываю свои изменения после
            него — иначе только что обещанные поставщику (supplier) деньги исчезнут из учёта.
          - >-
            Расхождение в том, что было до среза, — настоящая ошибка: принимаю правду
            казначейства (treasury), пишу корректировку с причиной и поднимаю алерт (alert).
          - >-
            Снапшот (snapshot) применяется одной транзакцией (transaction) вместе с отметкой «сообщение
            обработано».
        traps:
          - >-
            Слепо перезаписать состояние снапшотом (snapshot): шкала забывает про свежий инвойс (invoice), и
            лимит (credit limit) можно выдать на миллион сверх.
      - id: read-model-availability
        question: Клиенты читают «сколько свободно» постоянно. Как отдаёшь это быстро и честно?
        likelihood: medium
        asks: >-
          Разделяешь ли ты путь записи и путь чтения и можешь ли назвать, насколько чтение
          может отставать.
        answer:
          - >-
            Ответ — лимит (credit limit) минус сумма активных резервов (reservation); денормализованный счётчик держать
            можно, но его надо сверять с журналом (ledger).
          - >-
            Чтение отдаёт версию состояния и признак превышения, а не отрицательное
            доступное (available).
          - >-
            Кэш (cache) на чтение с коротким TTL допустим только с явным контрактом по свежести:
            клиент должен знать, что видит значение не старше N секунд.
          - >-
            Самопроверка: итог по журналу (ledger) пересчитывается и сравнивается с текущим числом.
      - id: local-runnable-delivery
        question: Как проверяющий запустит твоё решение? Что в README, что в compose-файле?
        likelihood: medium
        asks: >-
          Отношение к чужому времени: одна команда, тестовые данные, пример токена,
          миграции на старте.
        answer:
          - >-
            Docker compose поднимает сервис, PostgreSQL и Kafka, миграции (migration) применяются на
            старте, сиды дают программу (program), пару инвойсов (invoice) и тестовый токен.
          - >-
            README отвечает на три вопроса: как поднять, как аутентифицироваться, какие
            решения приняты и что сознательно не сделано.
          - >-
            Короткие ADR на каждый открытый вопрос задания: формат событий, кто прав при
            расхождении, источник курсов (FX rate), частичное погашение (partial repayment).
        traps:
          - >-
            Приложить длинный README без запуска одной командой. Проверяющий оценит именно
            второе.
      - id: tests-that-prove-the-hard-parts
        question: Какие тесты ты считаешь доказательством, что решение работает?
        likelihood: high
        asks: >-
          Ждут тестов на то, что ломается: гонки, дубли, опоздавшие снапшоты, — а не
          покрытия CRUD.
        answer:
          - >-
            Конкурентный тест (concurrency test) на лимит (credit limit): N параллельных резервов (reservation), успешных ровно столько,
            на сколько хватает места.
          - >-
            Тест идемпотентности (idempotency): повтор запроса и повторная доставка сообщения не меняют
            состояние, но возвращают тот же ответ.
          - >-
            Тест опоздавшего снапшота (snapshot): срез в прошлом, свежий резерв (reservation) остаётся.
          - >-
            Тест недопустимого освобождения (release): освободить больше зарезервированного нельзя,
            повтор освобождения — no-op.
          - >-
            Остальное — интеграционные тесты (integration tests) через настоящий Postgres, потому что инвариант (invariant)
            живёт в базе.
        traps:
          - >-
            Мокать базу. Тогда главный инвариант (invariant) проверяется против мока, а не против
            Postgres.
      - id: what-was-left-out
        question: Что ты сознательно не сделал и почему?
        likelihood: high
        asks: >-
          Зрелость: senior отличается тем, что знает границу своего решения и называет её
          раньше, чем её найдут.
        answer:
          - >-
            Называю три-четыре вырезанных куска и цену каждого: переоценка по курсу (FX rate), UI,
            реальный провайдер курсов, полноценная сага.
          - >-
            Для каждого — что случится в проде без этого и когда это станет блокером.
          - >-
            Отдельно — что сделал бы иначе при требовании «завтра в прод».
        traps:
          - >-
            Сказать «всё сделал». Задание гарантированно оставило дыры, и первая найденная
            читается как невнимательность.

  - id: node-nestjs
    title: Node.js, TypeScript и NestJS
    side: technical
    domain: backend-node
    intro: >-
      Второй слой после защиты задания. Отвечать конкретно — механизмами и порядком
      вызовов, а не «в NestJS это из коробки».
    wiki_refs: [nodejs-event-loop-and-latency, nestjs-request-lifecycle-and-scopes, nodejs-memory-gc-and-leaks]
    questions:
      - id: node-event-loop-blocking
        question: Сервис под нагрузкой начал отвечать по три секунды, CPU при этом десять процентов. С чего начнёшь?
        likelihood: high
        asks: >-
          Различаешь ли ты блокировку event loop, ожидание ввода-вывода и медленную
          внешнюю зависимость.
        answer:
          - >-
            Сначала лаг event loop и профиль: если лаг растёт при низком CPU, это очередь
            на одном потоке, а не нехватка ядер.
          - >-
            Ищу синхронную работу в горячем пути: разбор больших JSON, криптография,
            тяжёлые регулярки, обход больших массивов, синхронные файловые вызовы.
          - >-
            Проверяю пул соединений (connection pool) к базе и таймауты (timeout): очередь на пуле выглядит как
            медленный сервис.
          - >-
            Дальше выношу тяжёлое в отдельные потоки или в очередь и только потом
            добавляю реплики (replica).
      - id: nestjs-request-lifecycle
        question: Что происходит с запросом в NestJS от сокета до контроллера и как ты этим пользуешься?
        likelihood: medium
        asks: >-
          Знаешь ли порядок middleware, guards, interceptors, pipes, handler и куда вешать
          сквозные вещи.
        answer:
          - >-
            Порядок: middleware, guards, interceptors до обработчика, pipes, обработчик,
            interceptors после, фильтры исключений.
          - >-
            Аутентификация (authentication) и тенант (tenant) — guard: он срабатывает до валидации тела и может
            отклонить запрос раньше.
          - >-
            Валидация DTO — pipe со строгим режимом, чтобы лишние поля не доезжали до
            домена.
          - >-
            Единый формат ошибок и идентификатор запроса — interceptor плюс фильтр, вместо
            try-catch в каждом контроллере.
        traps:
          - >-
            Валидировать в контроллере руками и оставить второй путь записи без валидации.
      - id: nestjs-module-boundaries
        question: Как делишь приложение на модули, чтобы через полгода оно не стало одним файлом?
        likelihood: medium
        asks: >-
          Границы по возможностям, а не по типам файлов, и запрет на циклические
          зависимости между модулями.
        answer:
          - >-
            Модуль — это возможность (лимиты, инвойсы, выплаты), а не слой; контроллеры и
            репозитории живут внутри своей возможности.
          - >-
            Модули общаются через узкий публичный сервис, внутренние провайдеры не
            экспортируются.
          - >-
            Домен не знает про HTTP: DTO на границе, доменные типы внутри.
          - >-
            Циклическая зависимость между модулями — сигнал, что граница проведена не там.
      - id: graceful-shutdown
        question: Как сервис ведёт себя при деплое под нагрузкой?
        likelihood: medium
        asks: >-
          Порядок: снять готовность, дождаться текущих запросов, закоммитить офсеты, и
          только потом умереть.
        answer:
          - >-
            Первым снимается признак готовности, чтобы балансировщик перестал присылать
            трафик.
          - >-
            Затем ждём текущие запросы и не принимаем новые; консьюмер (consumer) останавливается так,
            чтобы офсеты (offset) закоммитились после обработки.
          - >-
            Таймаут (timeout) дренажа меньше, чем grace period в Kubernetes, иначе pod убивают на
            середине запроса.
          - >-
            Сигнал завершения обрабатывается явно: хук жизненного цикла — место для
            закрытия пула и консьюмеров (consumer).
        traps:
          - >-
            Закрыть пул базы раньше, чем завершились запросы в полёте.
      - id: typescript-boundary-typing
        question: Где у тебя TypeScript заканчивается и начинается валидация?
        likelihood: medium
        asks: >-
          Понимание, что типы стираются: данные из сети, из Kafka и из базы приходят как
          неизвестное, пока их не проверили.
        answer:
          - >-
            Типы — про внутреннюю согласованность (consistency); на границе стоит проверка схемы в
            рантайме.
          - >-
            Одна схема и есть источник типа: тип выводится из неё, а не пишется рядом и не
            разъезжается.
          - >-
            Деньги приходят и уходят строкой: число в контракте — заявка на потерю копеек.
          - >-
            Строгий режим в конфиге компилятора, и любое исключение из правила видно в
            диффе.

  - id: postgres
    title: "PostgreSQL: схема, транзакции (transaction), миграции (migration)"
    side: technical
    domain: data
    intro: >-
      Постгрес здесь не фон: в задании он держит инвариант. Вопросы идут от схемы к
      миграциям, и на каждом ждут конкретики — типа колонки, индекса, уровня изоляции.
    wiki_refs: [postgres-schema-design-and-normalisation, postgres-mvcc-isolation-and-locking, postgres-zero-downtime-migrations, postgres-query-plans-and-indexing]
    questions:
      - id: schema-for-capacity
        question: Нарисуй схему для программ (program), резервов (reservation) и журнала (ledger). Почему именно так?
        likelihood: high
        asks: >-
          Два решения: денормализованный счётчик занятого против суммы по резервам, и
          деньги как целые минорные единицы.
        answer:
          - >-
            Программа (program): идентификатор, тенант (tenant), валюта, лимит (credit limit) в минорных единицах, занятое,
            версия.
          - >-
            Резерв (reservation): программа (program), инвойс (invoice), сумма в валюте программы, исходная сумма и валюта,
            сохранённый курс, статус, уникальный индекс по активным резервам инвойса.
          - >-
            Журнал (ledger): только добавление, что, на сколько, почему, ссылка на запрос или
            сообщение.
          - >-
            Деньги — целые минорные единицы (minor units) плюс код валюты; курс (FX rate) хранится вместе с
            источником и временем.
          - >-
            Счётчик занятого держим ради атомарного условного обновления, но он выводим из
            журнала (ledger) и сверяется с ним.
        traps:
          - >-
            Хранить деньги в плавающей точке или в десятичном без явного масштаба и забыть,
            что у части валют три знака после запятой.
      - id: isolation-and-locks
        question: Какой уровень изоляции (isolation level) выставляешь и почему?
        likelihood: medium
        asks: >-
          Знаешь ли ты, что уровень по умолчанию не спасает от схемы «прочитал —
          проверил — записал», и что блокировка строки создаёт очередь.
        answer:
          - >-
            По умолчанию — чтение зафиксированного: для атомарного условного обновления его
            достаточно, потому что условие перепроверяется после снятия блокировки.
          - >-
            Повторяемое чтение уместно для согласованного среза, например при сверке (reconciliation)
            программы (program).
          - >-
            Сериализуемый уровень — когда инвариант (invariant) сложнее одной строки; тогда обязательны
            ретраи (retry) на ошибки сериализации.
          - >-
            Блокировку строки (row lock) беру осознанно: она сериализует всех, кто ждёт эту программу (program),
            и превращает нагрузку в очередь.
      - id: deadlock-discipline
        question: Два запроса блокируют друг друга. Как это предупреждаешь?
        likelihood: medium
        asks: >-
          Дисциплина порядка блокировок и понимание, что дедлок — это порядок в коде, а не
          сюрприз базы.
        answer:
          - >-
            Единый порядок захвата: сначала строка программы (program), потом резервы (reservation), всегда по
            возрастанию идентификатора.
          - >-
            Короткие транзакции (transaction): никакого сетевого вызова внутри транзакции.
          - >-
            Дедлок (deadlock) — повод починить порядок, а не только добавить ретрай (retry); ретрай обязателен
            как страховка, но он маскирует причину.
          - >-
            В логах видно, какие два запроса столкнулись: смотрю активность сессий и текст
            ошибки.
      - id: zero-downtime-migration
        question: Нужно добавить обязательную колонку на таблицу с миллионами строк в проде. Как?
        likelihood: medium
        asks: >-
          Знание схемы «расширить — заполнить — сжать» и того, что долгая блокировка на
          запись останавливает сервис.
        answer:
          - >-
            Расширение: добавляю колонку допускающую пустое, новый код пишет в оба места,
            старые строки заполняю пачками.
          - >-
            Проверяю, что новый код работает со старыми строками: чтение терпит пустое,
            запись заполняет.
          - >-
            Сжатие: ограничение обязательности и валидация — отдельным деплоем после
            заполнения.
          - >-
            Индексы (index) создаются без блокировки записи, вне транзакции (transaction).
        traps:
          - >-
            Одна миграция (migration), которая в один деплой добавляет колонку со значением по
            умолчанию и обязательностью на большую таблицу.
      - id: query-plan-and-index
        question: Эндпоинт доступности (availability) стал медленным. Как выясняешь, где именно?
        likelihood: medium
        asks: >-
          Рефлексы: план запроса с фактическим временем, а не «добавлю индекс».
        answer:
          - >-
            План запроса с фактическими строками и буферами: расхождение оценки с фактом в
            разы означает устаревшую статистику.
          - >-
            Смотрю на последовательное чтение большой таблицы и на то, покрывает ли индекс (index)
            условие и порядок.
          - >-
            Проверяю N+1: часто «медленный запрос» — это двести быстрых.
          - >-
            Индекс (index) добавляю под конкретный предикат: лишний индекс замедляет запись.

  - id: kafka
    title: "Kafka: дубли, порядок, отказы"
    side: technical
    domain: messaging
    intro: >-
      Казначейство приходит через Kafka, и это второй источник правды. Ждут не «я знаю
      Kafka», а конкретики про ключ, офсеты, дедупликацию и плохие письма.
    wiki_refs: [kafka-producer-delivery-semantics, kafka-partitioning-and-ordering, kafka-dead-letter-handling, outbox-idempotency-and-sagas]
    questions:
      - id: consumer-semantics-at-least-once
        question: Kafka даёт доставку хотя бы один раз. Что из этого следует для твоего кода?
        likelihood: high
        asks: >-
          Что «ровно один раз» не является бесплатным свойством брокера и что
          идемпотентность обеспечивается на твоей стороне.
        answer:
          - >-
            Обработка должна быть идемпотентной: эффект применяется один раз независимо от
            числа доставок.
          - >-
            Идемпотентность (idempotency) живёт в базе: уникальный идентификатор сообщения и отметка в
            той же транзакции (transaction), что и эффект.
          - >-
            Офсет (offset) коммитится после фиксации эффекта; автокоммит выключен.
          - >-
            Порядок гарантирован только внутри партиции (partition), поэтому ключ — идентификатор
            программы (program).
      - id: kafka-rebalance-and-offsets
        question: Что происходит с консьюмером (consumer) при ребалансе (rebalance) и как ты не теряешь работу?
        likelihood: medium
        asks: >-
          Понимание, что ребаланс — это пауза, а не ошибка, и что слишком долгая обработка
          ведёт к шторму ребалансов.
        answer:
          - >-
            При ребалансе (rebalance) партиции (partition) перераспределяются, и обработка должна отдать партицию,
            не потеряв прогресс.
          - >-
            Обработка дольше максимального интервала опроса выкидывает консьюмера (consumer) из
            группы — отсюда шторм и повторная доставка.
          - >-
            Пачка обрабатывается с коммитом по мере продвижения, а не одним коммитом в
            конце.
          - >-
            Кооперативное распределение и статическое членство уменьшают область
            перераспределения.
      - id: kafka-dlq-and-retries
        question: "Письмо не обрабатывается: в данных ошибка. Что делаешь?"
        likelihood: high
        asks: >-
          Что бесконечный повтор одного плохого письма блокирует ленту, и что очередь
          отказов — признание проблемы, а не её решение.
        answer:
          - >-
            Ретраи (retry) ограничены по числу и с задержкой; после лимита (credit limit) сообщение уходит в
            очередь отказов (dead letter queue) вместе с причиной и исходными данными.
          - >-
            Лента продолжает двигаться: главное — не блокировать партицию (partition) одним плохим
            письмом.
          - >-
            Очередь отказов (dead letter queue) просматривается и разбирается: после исправления данные
            прогоняются отдельно, а не повторной доставкой.
          - >-
            Метрики на размер очереди и долю отказов, иначе она тихо растёт.
      - id: kafka-schema-evolution
        question: Казначейство (treasury) добавляет поле в событие. Как не упасть?
        likelihood: medium
        asks: >-
          Совместимость: новый читатель против старого писателя, и что откат деплоя — тоже
          сценарий.
        answer:
          - >-
            Новые поля опциональны; читатель терпит их отсутствие и не падает на неизвестных.
          - >-
            Схема в реестре с проверкой совместимости в конвейере (pipeline), а не договорённость в чате.
          - >-
            Номер поля не переиспользуется и его смысл не меняется.
          - >-
            Версия в самом сообщении, чтобы старые сообщения разбирались при повторной
            обработке.
      - id: kafka-transactional-outbox
        question: Нужно, чтобы изменение лимита (credit limit) и публикация события были согласованы. Как?
        likelihood: medium
        asks: >-
          Знание схемы исходящей очереди в базе: сначала запись, потом публикация из
          журнала, а не две записи в две системы.
        answer:
          - >-
            Событие пишется в таблицу исходящих в той же транзакции (transaction), что и изменение
            состояния.
          - >-
            Отдельный публикатор читает её и отправляет, помечая отправленные; повторы
            безопасны благодаря ключу.
          - >-
            Двойная запись «база плюс брокер» даёт окно, в котором одно есть, а другого нет,
            и это окно всегда находят в проде.
          - >-
            Собственный ответ клиенту читается из базы: событие — для других сервисов.

  - id: api-contracts
    title: API, контракты и аутентификация (authentication)
    side: technical
    domain: network
    intro: >-
      Вакансия отдельно называет REST, версионирование, пагинацию, модель ошибок и
      идемпотентность. Здесь спрашивают форму контракта, а не список эндпоинтов.
    wiki_refs: [rest-resource-modelling-and-idempotency, api-pagination-and-error-models, api-contract-evolution]
    questions:
      - id: error-model
        question: Как выглядит твоя ошибка в API?
        likelihood: high
        asks: >-
          Может ли клиент отличить свою ошибку от нашей и повторимую от неповторимой, не
          читая текст сообщения.
        answer:
          - >-
            Один формат: машинный класс ошибки, человекочитаемое сообщение, идентификатор
            запроса, детали по полям.
          - >-
            Коды по смыслу: клиент сломал контракт, конфликт состояния, семантика, лимит (credit limit)
            запросов, наша ошибка.
          - >-
            Наружу не уходит стектрейс и текст ошибки базы; внутренний идентификатор для
            поддержки — уходит.
          - >-
            Доменный отказ «не хватает лимита» — отдельный тип с полем доступного (available), чтобы
            клиент мог показать причину.
      - id: idempotency-header
        question: Клиент просит идемпотентность (idempotency) на всех изменяющих эндпоинтах. Как бы ты её спроектировал?
        likelihood: medium
        asks: >-
          Детали: ключ хранится вместе с ответом, у ключа есть срок жизни, параллельный
          повтор не создаёт второй эффект.
        answer:
          - >-
            Ключ в запросе, уникальный в пределах тенанта (tenant) и эндпоинта.
          - >-
            Храню отпечаток тела: тот же ключ с другим телом — семантическая ошибка, а не
            тихая перезапись.
          - >-
            Храню код и тело ответа, чтобы повтор вернул тот же результат, включая
            заголовок расположения созданного ресурса.
          - >-
            Параллельный повтор получает «в обработке», а не второй эффект.
        traps:
          - >-
            Хранить ключи вечно. Нужен срок жизни и понимание, что после него повтор снова
            может создать эффект.
      - id: rest-vs-grpc
        question: Внутри платформы выберешь REST, gRPC или GraphQL? По какому критерию?
        likelihood: medium
        asks: >-
          Критерий из эксплуатации: кто клиент, какие ошибки, что с версионированием и
          отладкой.
        answer:
          - >-
            Сервис-к-сервису с жёстким контрактом — gRPC: схема, генерация кода, дедлайны.
          - >-
            Публичное и партнёрское API — REST: предсказуемость, кэширование (cache), инструменты,
            документация.
          - >-
            GraphQL — когда клиентских сценариев много и они разные; для одного экрана он
            добавляет стоимость без пользы.
          - >-
            Критерий — не вкус, а кто клиент и как ты будешь отлаживать ошибку в три часа
            ночи.
      - id: auth-and-tenant
        question: Все эндпоинты должны быть аутентифицированы. Что именно проверяешь в токене (token)?
        likelihood: high
        asks: >-
          Что «есть ли токен» — не аутентификация: нужны подпись, тенант, права и
          фильтрация в каждом запросе к базе.
        answer:
          - >-
            Подпись, издатель, срок и аудитория; полям из неподписанного тела не верю.
          - >-
            Арендатор (tenant) берётся из проверенного токена (token) и применяется фильтром в каждом
            запросе к базе.
          - >-
            Права узкие: чтение отдельно от записи, проверка на входе в обработчик.
          - >-
            Чужая программа (program) — «не найдено», а не «запрещено»: второй код подтверждает, что
            она существует.
        traps:
          - >-
            Брать тенант (tenant) из заголовка запроса вместо токена (token): заголовок подделывается
            клиентом.
      - id: pagination-and-consistency
        question: Клиент листает журнал (ledger) изменений. Как пагинируешь?
        likelihood: medium
        asks: >-
          Постраничный сдвиг против курсора и согласованность при вставках во время
          листания.
        answer:
          - >-
            Курсор (cursor) по паре «время создания плюс идентификатор», а не смещение: смещение на
            растущей таблице даёт пропуски и дубли.
          - >-
            Курсор (cursor) — непрозрачная строка, чтобы реализацию можно было сменить.
          - >-
            Порядок стабильный по паре полей, потому что время создания не уникально.
          - >-
            Размер страницы ограничен сверху и объявлен в контракте.

  - id: architecture-ops
    title: Эксплуатация, надёжность и работа с людьми
    side: technical
    domain: architecture
    intro: >-
      Роль включает on-call, постмортемы, ревью и менторство, поэтому эти вопросы идут
      наравне с техническими. Отвечать случаями и механизмами, а не принципами.
    wiki_refs: [resiliency-timeouts-retries-and-bulkheads, slos-and-error-budgets, incident-response-and-postmortems, redis-distributed-locks, mentoring-and-code-review]
    questions:
      - id: observability-what-to-instrument
        question: "Тебя будят в три ночи: «лимиты врут». Что смотришь первым?"
        likelihood: high
        asks: >-
          Есть ли метрики по смыслу домена, а не только по CPU и памяти.
        answer:
          - >-
            Доменные метрики: сумма занятого по программам (program) против суммы из журнала (ledger), отказы
            по причинам, доля превышений лимита (over limit).
          - >-
            Признак расхождения с казначейством (treasury): сколько снапшотов (snapshot) применено и сколько
            ушло в корректировку.
          - >-
            Латентность и доля ошибок по операциям, отставание консьюмера (consumer), размер очереди
            отказов.
          - >-
            Трассировка (tracing) конкретного запроса по идентификатору до строки в журнале (ledger).
      - id: retries-and-bulkheads
        question: Вызов казначейства (treasury) начал тормозить. Как твой сервис не ложится вместе с ним?
        likelihood: medium
        asks: >-
          Таймауты и изоляция: без таймаута любой медленный сосед становится твоим
          падением.
        answer:
          - >-
            Таймаут (timeout) и дедлайн на каждый внешний вызов, меньше собственного бюджета запроса.
          - >-
            Ретраи (retry) только на идемпотентные вызовы, с ростом задержки, джиттером и общим
            бюджетом.
          - >-
            Размыкатель (circuit breaker) и ограничение параллелизма, чтобы медленный путь не съел пул.
          - >-
            Осознанная деградация (degradation): чтение доступности (availability) работает, даже когда внешняя сверка (reconciliation)
            недоступна.
      - id: cicd-and-rollback
        question: Как выглядит путь от коммита до прода у тебя?
        likelihood: medium
        asks: >-
          Конкретика: миграции до кода, фича-флаги, канареечный шаг, откат и его границы.
        answer:
          - >-
            Конвейер (pipeline): типы, тесты, линт, сборка образа; миграции (migration) проверяются на пустой базе
            и на копии схемы.
          - >-
            Деплой: расширение схемы, новый код, сжатие схемы — в разное время.
          - >-
            Откат (rollback) кода не откатывает данные: любое изменение схемы совместимо с предыдущей
            версией.
          - >-
            Флаг на изменение поведения, а не на деплой.
        traps:
          - >-
            Считать, что откат (rollback) — это обратный коммит и тот же конвейер (pipeline) в другую сторону.
      - id: redis-where-it-helps
        question: Где в этом сервисе Redis действительно нужен?
        likelihood: medium
        asks: >-
          Скепсис: кэш поверх инварианта — второй источник правды, а распределённая
          блокировка вместо решения вопроса в базе — его маскировка.
        answer:
          - >-
            Кэш (cache) на чтение доступности (availability) с коротким сроком и явной границей свежести; никогда
            не кэш лимита (credit limit) для решения о записи.
          - >-
            Ограничение частоты по клиентам — идеальное место.
          - >-
            Идемпотентность (idempotency) и блокировки — нет: это в базе, иначе рестарт или разделение
            ленты ломают защиту.
          - >-
            Если нужен горячий счётчик, сначала измеряю, действительно ли база узкое место.
      - id: on-call-and-incident
        question: Расскажи про инцидент (incident), который ты вёл.
        likelihood: medium
        asks: >-
          Как человек ведёт себя под давлением: порядок действий, коммуникация, что
          изменилось после.
        answer:
          - >-
            Начинаю с действий: как обнаружили, что было видно в метриках, что сделали
            первым.
          - >-
            Роли и коммуникация: кто ведёт, кто копает, кто говорит с бизнесом, обновления
            по расписанию.
          - >-
            Разбор без поиска виноватых: какого механизма не было и какой чек это поймает.
          - >-
            Закрываю конкретикой: что уже влито, когда проверю, что теперь мониторится.
        traps:
          - >-
            Рассказывать одну длинную историю успеха. Спрашивают про процесс, а не про
            героизм.
      - id: mentoring-and-review
        question: Как проводишь код-ревью (code review) и что делаешь с человеком, который не согласен?
        likelihood: medium
        asks: >-
          Senior-поведение: ревью на границы и инварианты, а не на вкус, и умение уступать
          там, где нет ставки.
        answer:
          - >-
            Блокирую только то, что ломает инварианты (invariant), безопасность или эксплуатацию;
            стиль — линтером и отдельным разговором.
          - >-
            Комментарий несёт причину, а не приказ: что случится в проде без правки.
          - >-
            Несогласие по вкусу решает автор; несогласие по факту — тест или замер, а не
            авторитет.
          - >-
            Учу задачей чуть выше уровня, а не исправлением за человеком.

  - id: scf-basics
    title: "Домен: что такое SCF и кто в сделке"
    side: domain
    domain: fintech
    intro: >-
      Доменную часть спросят мягче по форме и жёстче по содержанию: проверят, чьи деньги
      и чей риск ты считаешь. Отвечать через участников сделки, а не через термины.
    wiki_refs: [limits-risk-and-trade-finance, payment-lifecycle]
    questions:
      - id: what-is-scf
        question: Что такое supply chain finance и что именно финансирует банк в этой схеме?
        likelihood: high
        asks: >-
          Базовая модель: платят поставщику раньше срока под подтверждённый долг покупателя,
          риск — на крупном покупателе.
        answer:
          - >-
            Поставщик (supplier) отгрузил и ждёт оплаты, скажем, девяносто дней; покупатель (buyer) подтвердил
            долг на платформе.
          - >-
            Банк платит поставщику (supplier) сейчас, с дисконтом (discount), и получает деньги от покупателя (buyer) в
            срок.
          - >-
            Риск оценивается по покупателю (buyer), поэтому ставка ниже, чем банк дал бы самому
            поставщику (supplier).
          - >-
            Разновидность называется payables finance, или reverse factoring: инициирует
            покупатель (buyer), а не поставщик (supplier).
      - id: why-limit-on-buyer
        question: Почему лимит (credit limit) привязан к покупателю (buyer), а не к поставщику (supplier)?
        likelihood: high
        asks: >-
          Понимание, сколько риска банк держит одновременно и на кого именно.
        answer:
          - >-
            Все деньги в итоге вернёт покупатель (buyer); если он обанкротится, банк потеряет всё
            выданное и не возвращённое.
          - >-
            Лимит (credit limit) — ответ на вопрос, сколько риска на этого покупателя (buyer) банк готов держать
            одновременно.
          - >-
            Поставщиков (supplier) у покупателя (buyer) много, а лимит (credit limit) один на программу, поэтому резервы
            разных поставщиков конкурируют за одно место.
          - >-
            Лимит (credit limit) возобновляемый: погашенное возвращается и снова может быть использовано.
      - id: discount-calculation
        question: Как из тысячи получается девятьсот восемьдесят пять?
        likelihood: medium
        asks: >-
          Механика дисконта и то, что база расчёта — триста шестьдесят дней, а не триста
          шестьдесят пять.
        answer:
          - >-
            Дисконт (discount) — плата за ожидание: ставка умножается на срок и делится на базу дней (day count basis).
          - >-
            Шесть процентов годовых на девяносто дней при базе триста шестьдесят дают
            полтора процента, то есть пятнадцать долларов на тысяче.
          - >-
            База дней (day count basis) — часть контракта: триста шестьдесят против трёхсот шестидесяти пяти
            меняет сумму, поэтому она берётся из настроек, а не из константы в коде.
          - >-
            Сумма к выплате (payout) и сумма резерва (reservation) — разные числа: резерв обычно по номиналу (face value)
            инвойса.
      - id: invoice-lifecycle
        question: Какие состояния у инвойса (invoice) и в каких из них наш модуль участвует?
        likelihood: high
        asks: >-
          Что модель резерва привязана к двум дверям — одобрение к досрочной оплате и
          погашение, — а не ко всем состояниям подряд.
        answer:
          - >-
            Загружен, подтверждён покупателем (approved by buyer), одобрен к досрочной оплате (approved for early payment), профинансирован (funded),
            наступил срок, погашен.
          - >-
            Резерв (reservation) создаётся на одобрении к досрочной оплате (approved for early payment) и живёт до погашения (repayment).
          - >-
            Отмена (cancellation) до выплаты (payout) освобождает резерв (reservation), хотя денег не было; частичное погашение
            освобождает долю.
          - >-
            Просрочка (overdue) резерв (reservation) не освобождает: деньги поставщику (supplier) уже ушли.
      - id: partial-and-cancel
        question: Инвойс (invoice) погасили на сорок процентов. Что происходит с резервом (reservation)?
        likelihood: medium
        asks: >-
          Аккуратность: пропорциональное освобождение и запрет освободить больше остатка.
        answer:
          - >-
            Резерв (reservation) переходит в состояние частичного освобождения (release) и уменьшается на
            пропорциональную долю.
          - >-
            Остаток остаётся занятым, пока не будет погашено остальное.
          - >-
            Освободить больше остатка нельзя: это сделало бы доступное (available) больше лимита (credit limit).
          - >-
            Каждое изменение — новая строка в журнале (ledger), а не правка прежней.

  - id: money-fx
    title: Деньги, валюты, курсы (FX rate) и округление
    side: domain
    domain: fintech
    intro: >-
      Самая частая зона провала в этом задании: инвойс в евро, программа в долларах.
      Здесь проверяют, умеешь ли ты считать деньги так, чтобы расхождение не появилось
      само.
    wiki_refs: [cross-border-funding-flow, postgres-schema-design-and-normalisation]
    questions:
      - id: minor-units
        question: Инвойс (invoice) в EUR, программа (program) в USD. Как считаешь и что хранишь?
        likelihood: high
        asks: >-
          Деньги: целые минорные единицы, код валюты рядом, число знаков по стандарту — не
          везде два.
        answer:
          - >-
            Суммы — целые минорные единицы (minor units) плюс код валюты; в API — строкой.
          - >-
            Число знаков берётся из стандарта валют: у динара Кувейта три, у иены ноль.
          - >-
            Курс (FX rate) сохраняется на момент резерва (reservation) вместе с источником и временем.
          - >-
            Пересчёт в валюте программы (program) делается один раз, при резерве (reservation), и фиксируется.
      - id: fx-drift-on-release
        question: Курс (FX rate) ушёл за девяносто дней. Сколько освободить?
        likelihood: high
        asks: >-
          Ключевая ловушка: освобождается сохранённая сумма, а не пересчитанная по новому
          курсу.
        answer:
          - >-
            Освобождаю ровно ту сумму в валюте программы (program), которая была занята при резерве (reservation).
          - >-
            Пересчёт по текущему курсу (FX rate) либо создаёт лимит (credit limit) из воздуха, либо съедает его.
          - >-
            При частичном погашении (partial repayment) освобождается пропорциональная доля сохранённой суммы.
          - >-
            Переоценка риска по рынку — отдельный отчёт, а не изменение резервов (reservation).
      - id: rounding-direction
        question: В какую сторону округлять при конвертации?
        likelihood: medium
        asks: >-
          Наличие правила и его обоснования: резерв вверх, чтобы не выдать сверх лимита.
        answer:
          - >-
            Резерв (reservation) округляется вверх: лучше занять на цент больше, чем выдать на цент сверх
            лимита (credit limit).
          - >-
            Освобождение (release) идёт по сохранённой сумме, без нового округления.
          - >-
            Правило записано в решении, потому что оно продуктовое, а не техническое.
          - >-
            Остаток от округления виден в журнале (ledger), иначе он всплывёт как непонятное
            расхождение.
      - id: float-in-money
        question: Почему нельзя использовать number для денег в Node.js?
        likelihood: high
        asks: >-
          Приведёт ли человек пример и решение: целые единицы, bigint или десятичная
          библиотека.
        answer:
          - >-
            Двоичная плавающая точка не представляет десятичные доли точно: одна десятая
            плюс две десятых не равны трём десятым.
          - >-
            В базу — целые минорные единицы (minor units) или десятичный тип; в Node — bigint или
            десятичная библиотека.
          - >-
            На границе API суммы передаются строкой, чтобы разбор JSON не превратил их в
            плавающее число.
          - >-
            Количество знаков проверяется по валюте на входе: три знака для доллара —
            ошибка, для динара — норма.
      - id: stale-rate-policy
        question: Откуда берутся курсы (FX rate) и что если они устарели?
        likelihood: medium
        asks: >-
          Эксплуатационное мышление: источник, свежесть и отказ вместо тихого расчёта по
          старым данным.
        answer:
          - >-
            Курсы (FX rate) приходят от провайдера или из казначейства (treasury) вместе со временем и
            источником.
          - >-
            Порог свежести: старше N минут — отказ с понятной ошибкой, а не расчёт по
            устаревшим данным.
          - >-
            Использованный курс (FX rate) хранится вместе с операцией, иначе спор о сумме неразрешим.
          - >-
            Откат (rollback) на последний известный курс (FX rate) допустим только с явной пометкой в ответе.

  - id: treasury-reconciliation
    title: Казначейство (treasury), сверка (reconciliation) и две правды
    side: domain
    domain: fintech
    intro: >-
      Вторая половина сложности задания: изменения приходят не только от клиентов, но и
      от казначейства, и эти два источника не договариваются заранее.
    wiki_refs: [reconciliation-and-drift, consistency-models-and-business-tolerance, kafka-partitioning-and-ordering]
    questions:
      - id: system-of-record
        question: Наши данные разошлись с казначейством (treasury). Кто прав?
        likelihood: high
        asks: >-
          Называет ли человек источник истины и не пытается ли усреднить две правды.
        answer:
          - >-
            Казначейство (treasury) — источник истины (system of record): там учитываются реальные деньги.
          - >-
            Наш модуль — быстрая рабочая копия для решений в реальном времени.
          - >-
            Расхождение разрешается в пользу казначейства (treasury), но с записью корректировки и
            причины.
          - >-
            В задании этого нет, значит это допущение, и его место в README и в решении.
      - id: staleness-and-sequence
        question: Снапшот (snapshot) помечен временем десять ноль-ноль. Почему номер последовательности надёжнее часов?
        likelihood: medium
        asks: >-
          Понимание распределённого времени: часы двух систем расходятся, порядок по ним не
          строится.
        answer:
          - >-
            Часы двух машин всегда немного расходятся, поэтому «кто позже по времени» не
            задаёт порядок.
          - >-
            Номер последовательности от источника даёт монотонный порядок, по которому видно
            устаревшее.
          - >-
            Всё, что меньше уже применённого номера, пропускается и логируется.
          - >-
            Время среза нужно для наложения наших изменений, номер — для отбрасывания
            старых снапшотов (snapshot).
      - id: reconciliation-correction
        question: Снапшот (snapshot) расходится с нами в том, что было до среза. Что делаешь?
        likelihood: high
        asks: >-
          Различает ли человек «снапшот старый» и «мы потеряли событие», и что делает во
          втором случае.
        answer:
          - >-
            Это настоящая ошибка: принимаю данные казначейства (treasury) как истину на момент среза.
          - >-
            Пишу корректировку с причиной «сверка» и ссылкой на сообщение.
          - >-
            Поднимаю алерт (alert): расхождение значит, что событие потерялось или обработалось
            неверно.
          - >-
            Разбираю причину по журналу (ledger); идеально, когда итог журнала сходится с
            казначейством (treasury) после корректировки.
      - id: utilization-and-alerts
        question: Какие доменные метрики ты бы отдал риск-менеджеру?
        likelihood: medium
        asks: >-
          Понимание, что «доступно» — не единственное интересное число в этой системе.
        answer:
          - >-
            Загрузка по программам (program): занятое к лимиту (credit limit) и распределение, а не одно среднее.
          - >-
            Число отказов «не хватило лимита» — это упущенная выручка, её замечают.
          - >-
            Превышение лимита (over limit) — отдельный сигнал, он требует человека.
          - >-
            Расхождения с казначейством (treasury) и размер очереди отказов.
      - id: over-limit-behaviour
        question: Лимит (credit limit) снизили с десяти миллионов до трёх, а занято три и шесть десятых. Что отдаёшь клиенту?
        likelihood: high
        asks: >-
          Продуктовое решение: не отменять обещанное, блокировать новое, отдавать ноль и
          отдельное поле превышения.
        answer:
          - >-
            Существующие резервы (reservation) не отменяются: деньги поставщикам (supplier) уже обещаны или
            выплачены.
          - >-
            Новые резервы (reservation) блокируются, освобождения (release) продолжают приниматься.
          - >-
            В ответе доступное (available) равно нулю и отдельное поле превышения, а не отрицательное
            доступное.
          - >-
            Событие алерта (alert) риск-менеджеру: лимит (credit limit) надо либо вернуть, либо ждать погашений (repayment).

  - id: compliance-audit
    title: Аудит, тенанты (tenant), комплаенс
    side: domain
    domain: fintech
    intro: >-
      Платформа white-label, на ней работают разные банки, и компания живёт с
      требованиями аудита. Эти вопросы задают, чтобы понять, думаешь ли ты о
      доказуемости, а не только о работоспособности.
    wiki_refs: [kyc-aml-and-audit-trails, double-entry-ledgers, kubernetes-rbac-and-multi-tenancy]
    questions:
      - id: tenant-isolation
        question: Платформа белая метка. Как гарантируешь, что банк A не видит программы (program) банка B?
        likelihood: high
        asks: >-
          Модель угроз: тенант из токена, фильтр в каждом запросе, «не найдено» вместо
          «запрещено».
        answer:
          - >-
            Тенант (tenant) берётся только из проверенного токена (token) и попадает в каждый запрос к базе.
          - >-
            Строка программы (program) не читается без условия по тенанту (tenant), и это делается в слое
            доступа к данным, а не в контроллере.
          - >-
            Чужая программа (program) — «не найдено», чтобы не подтверждать её существование.
          - >-
            Тест изоляции в конвейере (pipeline): токен (token) первого тенанта (tenant) на данных второго даёт «не
            найдено», а не данные.
        traps:
          - >-
            Проверять тенант (tenant) в одном сервисе и не проверять в консьюмере (consumer) Kafka.
      - id: audit-trail
        question: Аудитор спрашивает, почему третьего марта в четырнадцать ноль пять доступно было миллион двести. Что покажешь?
        likelihood: high
        asks: >-
          Журнал только на добавление: если в базе лежит одно текущее число, ответить нечем.
        answer:
          - >-
            Журнал (ledger) только на добавление: что, на сколько, кто, почему, ссылка на запрос или
            сообщение.
          - >-
            Исправление — новая строка-корректировка, а не правка прежней.
          - >-
            Текущее число пересчитывается из журнала (ledger) и сверяется с хранимым: бесплатная
            самопроверка.
          - >-
            Записи неизменяемы: удаление и правка запрещены правами в базе.
      - id: kyc-context
        question: Где в этом сервисе заканчивается KYC и AML и начинается твой модуль?
        likelihood: medium
        asks: >-
          Границы ответственности: проверки контрагентов и допуск к финансированию — до
          резерва, а не внутри него.
        answer:
          - >-
            Проверки контрагентов и риск-лимитов делаются до одобрения к досрочной оплате (approved for early payment).
          - >-
            Мой модуль получает уже одобренное решение и отвечает за учёт лимита (credit limit), а не за
            допуск сторон.
          - >-
            Всё, что делает модуль, объяснимо аудитору: у каждой операции есть инициатор и
            причина.
          - >-
            Персональные данные здесь не нужны — только идентификаторы сторон.
      - id: secrets-and-supply-chain
        question: Что сделаешь с секретами и зависимостями в этом сервисе?
        likelihood: medium
        asks: >-
          Гигиена: секреты вне репозитория, минимальные права, проверка зависимостей в
          конвейере.
        answer:
          - >-
            Секреты не в репозитории и не в образе: окружение или секретное хранилище,
            отдельно по средам.
          - >-
            Права минимальны: отдельный пользователь базы с правами на свою схему, роль без
            административных прав.
          - >-
            Сканирование зависимостей и фиксированный lockfile в конвейере (pipeline), обновления по
            расписанию, а не по инциденту (incident).
          - >-
            Образ из минимальной базы, подписанный; деплой по короткоживущим токенам (token), а не
            по долгоживущим ключам.
      - id: soc2-readiness
        question: Компания готовится к SOC 2. Что это меняет в твоей работе?
        likelihood: medium
        asks: >-
          Реализм: изменения через ревью, след доступа, неизменяемые логи, разделение
          обязанностей.
        answer:
          - >-
