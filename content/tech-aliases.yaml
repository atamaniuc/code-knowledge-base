# Gazetteer for vacancy parsing: canonical technology -> aliases.
#
# A closed vocabulary beats a small language model on this task: it is
# deterministic, instant, weighs nothing, and never invents a technology that
# is not in the posting. Grows as domains are covered.
technologies:
  - canonical: React
    domain: frontend
    aliases: [reactjs, react.js, реакт]
  - canonical: Next.js
    domain: frontend
    aliases: [nextjs, next js, некст]
  - canonical: Node.js
    domain: backend-node
    aliases: [nodejs, node js, нода]
  - canonical: NestJS
    domain: backend-node
    aliases: [nest.js, nest js, нест]
  - canonical: PHP
    domain: backend-php
    aliases: [php8, php 8, пхп]
