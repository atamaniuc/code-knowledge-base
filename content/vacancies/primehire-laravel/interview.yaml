    questions:
      - id: prime-upgrade-path
        question: 1000 миграций, 550 моделей, переход Laravel 7 → 11. Какой путь
          апгрейда и что вы никогда не делаете?
        likelihood: high
        tags:
          - ops
          - tradeoff
        asks: Понимает ли кандидат пошаговый апгрейд и инстинкт защиты прода, а не
          'обновим и посмотрим'.
        answer:
          - "Апгрейд — по одной мажорной версии за раз: 7→8→9→10→11, каждый шаг
            с зелёными тестами и деплоем до следующего."
          - Официальные upgrade-гайды читаю до начала; Laravel Shift
            автоматизирует механику, но решение остаётся за ревью.
