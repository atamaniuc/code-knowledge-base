  - id: outbox-idempotency
    title: Transactional Outbox / Inbox и идемпотентность
    side: technical
    domain: backend-php
    intro: "Отдельный блок: как сделать «запись в БД + событие в очередь» атомарным
      и почему идемпотентность — не опция, а требование. Это мост между
      интеграциями, биллингом и очередями SQS."
    wiki_refs:
      - laravel-transactional-outbox-inbox
    questions:
      - id: prime-outbox-dual-write
        question: Хендлер вебхука должен пометить инвойс оплаченным в БД и отправить
          событие InvoicePaid в SQS. Как сделать эти два шага атомарными, если
          процесс упадёт между ними?
        likelihood: high
        tags:
          - idempotency
          - concurrency
        asks: Понимает ли кандидат dual-write problem и предлагает transactional outbox
          вместо «опубликую после save».
        answer:
          - "Проблема: коммит в БД и публикация в очередь — два разных
            хранилища, одной атомарной операции между ними нет."
          - "Решение — transactional outbox: событие пишется в таблицу outbox в
            той же транзакции, что и изменение инвойса; они становятся durable
            вместе."
          - Отдельный relay читает неотправленные строки (FOR UPDATE SKIP
            LOCKED), публикует в SQS и помечает sent_at.
          - "Публикация at-least-once: relay может отправить дважды, поэтому
            потребитель обязан быть идемпотентным."
        traps:
          - Публиковать в SQS сразу после save() и считать хендлер готовым.
          - Считать, что ретраи решают проблему без идемпотентности.
        follow_ups:
          - Relay упал после публикации, но до пометки sent. Что произойдёт?
          - Где хранится outbox-таблица и почему в той же БД?
      - id: prime-inbox-dedup
        question: Вебхук от Stripe пришёл дважды. Где вы дедуплицируете его так, чтобы
          дубль не дошёл до бизнес-логики?
        likelihood: high
        tags:
          - idempotency
          - audit
        asks: "Понимает ли кандидат transactional inbox: сначала сохранение с
          unique-ключом, потом обработка."
        answer:
          - Входящий вебхук сначала сохраняется в inbox-таблицу с unique-ключом
            (provider, external_id) — для Stripe это event id.
          - "Вставка — это и есть дедупликация: INSERT ... ON CONFLICT DO
            NOTHING, если вставлено 0 строк — дубль, выходим без сайд-эффектов."
          - "Только после успешной вставки запускается бизнес-логика: статусы,
            outbox, уведомления."
          - "Исходящие вызовы защищаются тем же принципом: Idempotency-Key у
            Stripe."
        traps:
          - Дедуплицировать по памяти или в кэше — при рестарте дубль пройдёт.
          - Отвечать 200 до записи в inbox — событие потеряется, а Stripe
            перестанет ретраить.
        follow_ups:
          - Что если два одинаковых вебхука пришли одновременно?
          - Чем inbox отличается от простого unique constraint на таблице
            событий?
      - id: prime-outbox-nue
        question: Нарисуйте словами пайплайн Stripe-вебхук → статус инвойса → Nue-синк.
          Где тут outbox, inbox и идемпотентность?
        likelihood: medium
        tags:
          - idempotency
          - money
        asks: Собирает ли кандидат оба паттерна в один сквозной пайплайн из вакансии, а
          не отвечает про каждый отдельно.
        answer:
          - Stripe-вебхук попадает в inbox и дедуплицируется по event id — дубль
            становится no-op.
          - Хендлер в одной транзакции помечает инвойс оплаченным и пишет
            InvoicePaid в outbox.
          - Relay публикует outbox-событие в SQS; потребитель синка применяет
            изменение в Nue идемпотентно по external_id.
          - Каждый переход владеет своим ключом дедупликации — поэтому любой
            повтор на любом шаге безопасен.
        traps:
          - Описывать пайплайн без inbox — тогда дубль вебхука дважды пометит
            инвойс.
          - Забыть идемпотентность на шаге Nue-синка.
        follow_ups:
          - Что произойдёт, если Nue-синк упадёт после применения, но до
            подтверждения?
          - Какую сверку вы добавите поверх этого пайплайна?
  - id: integrations
    title: Интеграции и вебхуки
    side: domain
    intro: "15+ интеграций: Nue, Stripe, QuickBooks, Xero, Zapier и другие. Это
      домен вакансии — спрашивают, как вы держите внешний хаос под контролем."
    wiki_refs:
      - stripe-nue-billing-in-laravel
    questions:
      - id: prime-integration-pattern
        question: "У вас 15+ интеграций: Nue, Stripe, QuickBooks, Xero, Zapier... Как вы
          проектируете новую интеграцию, чтобы смена провайдера не переписывала
          модуль?"
        likelihood: high
        tags:
          - tradeoff
          - api
        asks: Думает ли кандидат про порты и адаптеры на границах с внешними системами,
          а не пишет код под каждого провайдера в контроллере.
        answer:
          - Модуль владеет интерфейсом (порт) — например, InvoiceSyncPort с
            методами pushInvoice/pullPayments — а не наоборот.
          - "Каждая интеграция — адаптер за этим портом: StripeAdapter,
            NueAdapter, QuickBooksAdapter."
          - Бизнес-логика зависит только от порта; смена провайдера — это новый
            адаптер, а не правки по всему коду.
          - "Граница оправдана на внешних интеграциях: они волатильны. Внутри
            стабильного модуля тот же уровень абстракции не нужен."
        traps:
          - Писать логику Stripe прямо в сервисах инвойсов.
          - Оборачивать в интерфейсы вообще всё 'на будущее'.
        follow_ups:
          - Как вы тестируете адаптер без сети?
          - Где живёт маппинг полей QuickBooks ↔ ваша модель?
      - id: prime-oauth
        question: Интеграция с QuickBooks Online использует OAuth. Как вы храните токены
          и что делаете, когда refresh token протух?
        likelihood: high
        tags:
          - auth
          - ops
        asks: Понимает ли кандидат жизненный цикл OAuth-токенов и что refresh-токены
          тоже умирают.
        answer:
          - Access-токен живёт минуты, refresh — долго; храним оба
            зашифрованными в БД, привязанными к tenant и интеграции.
          - Перед вызовом проверяем expiry access-токена и обновляем по refresh
            заранее, с локом против гонки параллельных обновлений.
          - "Refresh может протухнуть или быть отозванным — тогда нужен re-auth
            flow: пометить интеграцию disconnected и уведомить пользователя."
          - Никогда не логируем токены; секреты клиента — в конфиге/секретах, не
            в коде.
        traps:
          - Хранить refresh-токены в открытом виде или в localStorage.
          - Считать, что refresh живёт вечно.
        follow_ups:
          - Как не устроить гонку при одновременном обновлении токена?
          - Что такое webhook-подписка у QuickBooks и зачем она?
      - id: prime-race
        question: Синк с внешней системой гоняется с действиями пользователя. Как вы
          разруливаете гонки (race conditions) и частичные сбои?
        likelihood: high
        tags:
          - concurrency
          - idempotency
        asks: Понимает ли кандидат, что интеграция — это распределённая система с
          eventual consistency, и проектирует под неё.
        answer:
          - "Правило первое: одна система — источник правды для каждой сущности;
            остальные — проекции, которые догоняют."
          - "Гонки закрываются идемпотентными операциями и версионированием:
            повторная обработка того же события не применяет изменение дважды."
          - "Частичные сбои — это норма: делю синк на шаги, каждый фиксируется
            отдельно, повтор начинается с незавершённого шага."
          - Сверка (reconciliation) по расписанию находит расхождения, которые
            гонки и сбои всё-таки пропустили.
        traps:
          - Пытаться сделать распределённый синк строго консистентным и
            синхронным.
          - Игнорировать частичный сбой и оставлять полусозданные записи.
        follow_ups:
          - Как выглядит идемпотентный ключ для синка инвойса?
          - Что вы сверите в ночном джобе?
      - id: prime-webhook-security
        question: Как вы проверяете, что вебхук действительно от Stripe, а не подделка?
        likelihood: medium
        tags:
          - auth
          - audit
        asks: Знает ли кандидат про подпись вебхуков и timestamp-защиту от replay, а не
          только про https.
        answer:
          - "Stripe подписывает каждый вебхук: заголовок Stripe-Signature
            содержит timestamp и подписи; проверяю их секретом вебхука."
          - Проверка включает timestamp — старые события отклоняются, это защита
            от replay-атак.
          - Секрет вебхука живёт в конфиге, разные секреты для разных
            endpoint'ов, и он не попадает в логи.
          - После проверки подписи всё равно валидирую содержимое и обрабатываю
            идемпотентно.
        traps:
          - Доверять телу запроса, потому что оно пришло по https.
          - Логировать payload с чувствительными данными.
