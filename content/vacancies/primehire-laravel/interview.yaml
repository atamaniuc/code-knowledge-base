title: PrimeHire · Backend Developer PHP + Laravel — репетиция под вакансию
summary: "Репетиция под вакансию Backend Developer PHP + Laravel: cloud field
  service management платформа, Laravel 11 в миграции с 7, 550 моделей,
  мультитенантность на общей PostgreSQL (Aurora), SQS/Redis, 15+ интеграций
  (Nue, Stripe, QuickBooks, Xero), EKS/Helm и Angular 16. Группы идут в том
  порядке, в котором их спрашивают: язык и ядро Laravel, Eloquent и Postgres,
  мультитенантность, auth, очереди, интеграции и биллинг, тесты, инфраструктура,
  легаси-миграция, затем работа с ИИ и поведенческие. high — спросят почти
  наверняка, medium — всплывает как follow-up. Каждый вопрос размечен темами, и
  тема собирает связанное по всем группам."
target:
  role: "Backend Developer: PHP + Laravel"
  company: PrimeHire — cloud field service management platform (HVAC, plumbing,
    electrical)
  domain: backend-php
  stack:
    - PHP
    - Laravel
    - PostgreSQL
    - AWS Aurora
    - AWS SQS
    - Redis
    - Docker
    - AWS EKS
    - Helm
    - GitHub Actions
    - Angular
    - TypeScript
    - Stripe
    - Nue
stages:
  - name: Скрининг с рекрутером
    minutes: 30
    note: Мотивация, релевантный опыт, перекрытие с US Central, уровень английского.
      Технику почти не спрашивают, но оценивают, насколько внятно вы
      рассказываете о своём опыте.
  - name: Техническое интервью
    minutes: 90
    note: "Laravel/PHP, Eloquent и Postgres, мультитенантность, очереди и
      интеграции, биллинг. Идут по краям: N+1, EXPLAIN, гонки в синках, отзыв
      токенов, граница Stripe/Nue."
  - name: Финальный разговор
    minutes: 45
    note: "Поведенческие и fit: own the ticket, careful with production, comfortable
      in legacy, дисциплинированная работа с ИИ. Здесь же — вопросы про процессы
      и английский."
groups:
  - id: php-lang
    title: PHP 8.2+ и язык
    side: technical
    intro: Проверяют, используете ли вы новые возможности языка для устранения целых
      классов багов, а не ради синтаксиса. Говорите про то, что меняется в
      дизайне кода.
    wiki_refs:
      - php-82-modern-features
    questions:
      - id: prime-php-readonly
        question: Где в коде инвойсов и платежей вы бы применили readonly-классы и
          enum'ы (перечисления), и что это меняет в дизайне?
        likelihood: high
        tags:
          - tradeoff
          - money
        asks: Видит ли кандидат связь между иммутабельностью (неизменяемостью) и
          денежными вычислениями, а не просто пересказывает синтаксис.
        answer:
          - "Readonly-класс — это неизменяемый value object (объект-значение):
            создал сумму в центах — и её уже нельзя случайно поменять по
            ссылке."
          - "Enum закрывает множество статусов: вместо строки 'paid' в сорока
            местах — InvoiceStatus::Paid, и опечатка ловится на уровне типов."
          - "Для денег это критично: если объект суммы можно мутировать, баг
            'изменили чужую сумму' становится возможным; readonly его
            исключает."
          - "Связка с match даёт исчерпывающую обработку: добавили статус —
            компилятор указал все ветки, которые надо пересмотреть."
        traps:
          - "Называть enum 'просто красивой константой' — теряется суть:
            закрытое множество состояний."
          - Говорить про readonly как про защиту от SQL-инъекций.
        follow_ups:
          - Чем backed enum отличается от чистого enum и что вы выберете для
            статуса в БД?
          - Где readonly не спасает — например, если свойство само объект?
      - id: prime-php-enums
        question: Статусы инвойсов сейчас хранятся строками. Как вы переведёте их на
          enum (перечисление), и что при этом может сломаться?
        likelihood: high
        tags:
          - api
          - tradeoff
        asks: Понимает ли кандидат, что enum меняет контракт на границах системы — БД,
          API, внешние интеграции — а не только внутри PHP.
        answer:
          - "Внутри PHP — backed enum со строковым значением, чтобы
            представление в БД не менялось: колонка остаётся строкой."
          - В коде все сравнения и switch заменяются на enum и match; строковые
            литералы 'paid' из кода исчезают.
          - "Границы — это риск: API-клиенты, вебхуки и интеграции шлют строки;
            нужно мапить входящие значения и решить, что делать с неизвестным
            статусом."
          - "Миграция идёт инкрементально: сначала enum на чтении, потом на
            записи, иначе ловишь рассинхрон между сервисами."
        traps:
          - Менять колонку в БД на int ради enum и ломать все внешние интеграции.
          - Считать, что enum сам по себе валидирует входящие данные из API.
        follow_ups:
          - Что делать, если от интеграции пришёл статус, которого нет в enum?
          - Как enum взаимодействует с Eloquent-кастами?
      - id: prime-php-fibers
        question: Зачем в PHP появились Fibers (файберы), если обычный Laravel работает
          в php-fpm?
        likelihood: medium
        tags:
          - nfr
          - ops
        asks: "Понимает ли кандидат разницу моделей исполнения: request-per-process у
          php-fpm против долгоживущих воркеров."
        answer:
          - "Fibers — это кооперативная многозадачность: функция может
            приостановиться и продолжиться, не блокируя весь процесс."
          - В php-fpm каждый запрос — свой процесс, поэтому Fibers приложению
            почти не нужны; там конкурентность даёт сам пул процессов.
          - Fibers нужны долгоживущим рантаймам — ReactPHP, Amp, FrankenPHP в
            режиме воркера — чтобы ждать I/O без блокировки.
          - "Для этой вакансии практический вывод: знаю модель исполнения и не
            тащу асинхронщину туда, где её не требует архитектура."
        traps:
          - Говорить, что Fibers делают PHP многопоточным, как Go.
          - Предлагать переписать Laravel-приложение на Fibers ради скорости.
        follow_ups:
          - Чем кооперативная многозадачность отличается от вытесняющей?
          - Что поменяется, если приложение переедет на FrankenPHP worker mode?
    domain: backend-php
  - id: laravel-core
    title: "Laravel 11: контейнер, middleware, FormRequest"
    side: technical
    intro: Ядро фреймворка, которое спрашивают в первую очередь. Ожидают не
      определения, а куда вы это кладёте в реальном приложении.
    wiki_refs:
      - laravel-service-container
      - laravel-middleware-and-bootstrap
      - laravel-form-request-validation
    questions:
      - id: prime-container-binding
        question: Как вы привяжете интерфейс платёжного шлюза к реализации Stripe, чтобы
          в тестах подставлять fake (заглушку)?
        likelihood: high
        tags:
          - tests
          - api
        asks: Понимает ли кандидат constructor injection и bind в сервис-провайдере, а
          не фасады и не new в каждом месте.
        answer:
          - Класс объявляет зависимость в конструкторе через интерфейс —
            PaymentGateway, а не конкретный StripeGateway.
          - "В сервис-провайдере регистрируется биндинг: интерфейс → реализация;
            контейнер сам строит объект и прокидывает зависимость."
          - В тестах тот же класс создаётся с fake-реализацией интерфейса — без
            изменения продакшен-кода.
          - "Анти-паттерн — вытаскивать app(PaymentGateway::class) внутри
            бизнес-логики: это service locator, зависимость спрятана."
        traps:
          - "Использовать фасад Stripe:: везде и мокать фасад в тестах —
            работает, но не даёт сменить реализацию."
          - Регистрировать биндинг в контроллере, а не в провайдере.
        follow_ups:
          - Где живут биндинги в Laravel 11?
          - Чем bind отличается от singleton и когда singleton опасен для шлюза?
      - id: prime-middleware-order
        question: В Laravel 11 нужно резолвить компанию (tenant) до проверки auth. Где
          вы это регистрируете и как гарантируете порядок?
        likelihood: high
        tags:
          - tenancy
          - auth
        asks: Знает ли кандидат, что в Laravel 11 ядро — это bootstrap/app.php, и что
          порядок middleware определяется порядком регистрации.
        answer:
          - "В Laravel 11 HTTP-ядро настраивается в bootstrap/app.php: там
            регистрируются middleware, роутинг и exception handling."
          - "Tenant-резолвер ставится в глобальный стек до auth: порядок
            регистрации и есть порядок выполнения."
          - append/prepend позволяют управлять позицией явно, а не полагаться на
            дефолты.
          - "Route middleware — второй слой: он работает после глобального и
            может уже полагаться на установленный tenant-контекст."
        traps:
          - Искать старый класс Http/Kernel в Laravel 11.
          - Считать, что middleware сортируются по алфавиту или автоматически.
        follow_ups:
          - Что случится, если tenant-резолвер читает пользователя, но стоит
            после auth?
          - Как проверить порядок тестом?
      - id: prime-formrequest
        question: Куда вы кладёте правила валидации и проверку «может ли пользователь
          это сделать» для нового эндпоинта?
        likelihood: high
        tags:
          - auth
          - api
        asks: Разделяет ли кандидат валидацию, авторизацию и сам экшен, и знает ли
          порядок их выполнения.
        answer:
          - "FormRequest — отдельный класс: rules() отдаёт правила валидации,
            authorize() — проверку прав и tenant-принадлежности."
          - "Laravel выполняет валидацию до метода контроллера: невалидный
            запрос в экшен вообще не попадает."
          - authorize() отрабатывает до валидации — неавторизованный запрос не
            узнаёт, какие поля были бы валидны.
          - prepareForValidation() нормализует входные данные до правил —
            например, цену в центы до проверки формата.
        traps:
          - Валидировать внутри метода контроллера.
          - Отдавать ошибки валидации неавторизованному клиенту.
        follow_ups:
          - Как выглядит ответ невалидного запроса для API-клиента?
          - Куда положить правило, сравнивающее два поля между собой?
      - id: prime-modules
        question: В приложении 90 самодостаточных модулей app/Modules. Как вы решаете,
          что класть в модуль, а что — в общий код?
        likelihood: medium
        tags:
          - scope
          - tradeoff
        asks: Думает ли кандидат про границы модулей и стоимость переиспользования, а не
          складывает всё в shared.
        answer:
          - "Модуль владеет своей фичей целиком: модели, сервисы, роуты, тесты —
            и наружу отдаёт узкий публичный контракт."
          - В общий код уходит только то, что реально переиспользуется
            несколькими модулями и меняется по общим правилам — tenant-скоп,
            деньги, логирование.
          - "Правило: сначала дублирование внутри модуля, потом — вынос в общий
            код, когда появился второй-третий потребитель."
          - "Переиспользование — это обязательство: изменение общей части теперь
            требует проверки всех потребителей."
        traps:
          - Сразу тащить всё в shared/utils — получается второй монолит внутри
            монолита.
          - Разрешать модулям ходить напрямую в таблицы друг друга вместо
            публичного API.
        follow_ups:
          - Как бы вы разрулили зависимость модуля A от модуля B?
          - Где провести границу между модулем и доменом DDD?
    domain: backend-php
  - id: eloquent-postgres
    title: Eloquent и PostgreSQL
    side: technical
    intro: 550 моделей и 1000 миграций — это значит, что вопросы про N+1, планы
      запросов и безопасные миграции будут не теорией, а повседневной работой.
    wiki_refs:
      - laravel-eloquent-relations-and-eager-loading
      - postgres-query-plans-and-indexing
    questions:
      - id: prime-n1
        question: Страница со списком инвойсов делает 201 запрос на 200 строк. Что
          произошло и как чинить?
        likelihood: high
        tags:
          - postgres
          - nfr
        asks: Узнаёт ли кандидат N+1 по описанию и предлагает eager loading, а не
          индекс.
        answer:
          - "Это N+1 (проблема N+1 запросов): один запрос за списком и по одному
            запросу за связанную модель для каждой строки."
          - "Чинится eager loading: Invoice::with('company') — два запроса
            независимо от числа строк."
          - Nested relations грузятся так же — with('company.owner');
            loadMissing — для уже загруженных моделей.
          - "Защита от регресса — Model::preventLazyLoading() в разработке:
            следующая ленивая загрузка упадёт с исключением, а не в проде."
        traps:
          - Предлагать индекс, хотя проблема в 200 round trips, а не в медленном
            запросе.
          - Вызывать with() после того, как модели уже загружены.
        follow_ups:
          - Как ограничить, каких именно companies подгрузить с инвойсами?
          - Что показывает query log после фикса?
      - id: prime-explain
        question: Эндпоинт стал медленным. Вы читаете EXPLAIN ANALYZE (план запроса).
          Что в нём говорит «не хватает индекса», а не «кривой запрос»?
        likelihood: high
        tags:
          - postgres
          - ops
        asks: Читает ли кандидат план по фактическому времени и строкам, а не по оценке,
          и проверяет ли эффект индекса повторным планом.
        answer:
          - EXPLAIN ANALYZE BUFFERS показывает фактическое время и число строк
            по узлам плана, а не только оценки.
          - "Смотрю на доминирующий узел: Seq Scan (последовательное
            сканирование) по колонке, по которой фильтруем — кандидат на
            индекс."
          - "Сравниваю estimated rows и actual rows: большой разрыв — устаревшая
            статистика, а не только индекс."
          - После создания индекса перепрогоняю план и проверяю, что он реально
            используется; индекс не бесплатен — он стоит записи.
        traps:
          - Добавлять индекс, не глядя в план.
          - Верить estimated cost, когда actual time говорит обратное.
        follow_ups:
          - Индекс используется, но всё равно медленно — что дальше?
          - Что такое bitmap heap scan и когда он лучше seq scan?
      - id: prime-migration
        question: Нужно добавить колонку с дефолтом в таблицу на миллионы строк. Как не
          заблокировать запись?
        likelihood: high
        tags:
          - postgres
          - ops
        asks: Знает ли кандидат, какие DDL берут долгие блокировки, и применяет ли
          expand-migrate-contract с батчами.
        answer:
          - Добавление колонки с volatile-дефолтом переписывает таблицу и берёт
            ACCESS EXCLUSIVE — запись встанет.
          - "Безопасная последовательность — expand-migrate-contract: сначала
            nullable или константный дефолт, потом бэкфилл батчами, потом
            финальный дефолт."
          - Бэкфилл — маленькими порциями с паузами, чтобы не держать длинную
            транзакцию.
          - Индексы — CREATE INDEX CONCURRENTLY; перед проделом — lock_timeout и
            мониторинг блокировок.
        traps:
          - Добавлять колонку с дефолтом в горячую таблицу днём.
          - Гнать один гигантский UPDATE на часы.
        follow_ups:
          - Как проверить, что запись не блокировалась во время бэкфилла?
          - Когда переписывание таблицы неизбежно и как его планировать?
      - id: prime-aurora
        question: "Чем Aurora PostgreSQL отличается для вас как разработчика:
          reader/writer endpoints, failover, fast clone?"
        likelihood: medium
        tags:
          - postgres
          - ops
        asks: Понимает ли кандидат, какие возможности Aurora влияют на код и на
          эксплуатацию, а не просто называет сервис AWS.
        answer:
          - Aurora — это PostgreSQL-совместимый движок AWS с разделяемым
            хранилищем и репликами; для SQL это всё тот же Postgres.
          - "Reader endpoint направляет запросы на реплики: тяжёлые отчёты и
            read-only проверки уводим с writer."
          - Failover переключает writer на реплику; приложение должно переживать
            разрыв соединения и повторять запрос.
          - Fast clone даёт копию кластера за минуты — это способ тестировать
            миграции и dangerous-изменения на данных, близких к проду.
        traps:
          - Считать Aurora отдельной СУБД с другим SQL.
          - Гонять отчёты на writer и удивляться деградации записи.
        follow_ups:
          - Как вы проверите миграцию на fast clone перед продом?
          - Что меняет multi-AZ для RTO?
    domain: data
  - id: multitenancy
    title: Мультитенантность
    side: technical
    intro: "Одна база, каждая строка принадлежит компании. Это главный риск
      платформы: вопрос не «как фильтровать», а «как сделать невозможным забыть
      фильтр»."
    wiki_refs:
      - laravel-multitenancy-patterns
    questions:
      - id: prime-tenant-scope
        question: Одна база, каждая строка принадлежит компании. Как сделать так, чтобы
          новый разработчик не мог забыть фильтр по tenant (компании)?
        likelihood: high
        tags:
          - tenancy
          - scope
        asks: Предлагает ли кандидат enforcement по умолчанию (global scope) и
          разрешение tenant'а на уровне middleware, а не дисциплину.
        answer:
          - Global scope на tenant-моделях добавляет where company_id =
            current_company_id к каждому запросу, включая отношения.
          - Текущая компания резолвится в middleware на каждый запрос и кладётся
            туда, откуда scope её читает.
          - withoutGlobalScope — редкое, именованное и ревьюируемое исключение,
            а не инструмент на каждый день.
          - "Второй забор — row-level security в Postgres: даже забытый фильтр
            упадёт с ошибкой доступа, а не отдаст чужие данные."
        traps:
          - Фильтровать только в контроллерах — отношения и фоновые джобы
            останутся дырявыми.
          - Доверять tenant id, который прислал фронтенд.
        follow_ups:
          - Скрипту поддержки нужно пройтись по всем тенантам — как разрешить
            безопасно?
          - Почему RLS — второй забор, а не замена scope?
      - id: prime-tenant-leak
        question: Вы на ревью видите запрос без tenant-фильтра. Что вы пишете и почему
          это критично?
        likelihood: high
        tags:
          - tenancy
          - audit
        asks: Понимает ли кандидат, что cross-tenant утечка — это data breach, а не баг
          отображения, и что ревью — часть системы защиты.
        answer:
          - "Блокирую PR: в shared-database мультитенантности пропущенный фильтр
            — это утечка данных одной компании в другую."
          - "Прошу показать, где запрос получает tenant: глобальный scope, явный
            where или разрешённый withoutGlobalScope с обоснованием."
          - Проверяю не только сам запрос, но и отношения и джобы, которые он
            тянет.
          - Если паттерн повторяется — это сигнал, что нужен ещё один уровень
            защиты (RLS) или trait, который делает пропуск явным.
        traps:
          - Пропустить как 'потом поправим' — в мультитенатном проде это
            инцидент безопасности.
          - Считать, что раз данные скучные, то утечка не страшна.
        follow_ups:
          - Как бы вы искали уже существующие утечки в кодовой базе?
          - Что написать в definition of done, чтобы такие PR не проходили?
      - id: prime-rls
        question: Когда стоит добавить row-level security (RLS) в Postgres поверх global
          scopes?
        likelihood: medium
        tags:
          - tenancy
          - tradeoff
        asks: Взвешивает ли кандидат цену RLS (сложность миграций, хуже ошибки) против
          выгоды второго забора.
        answer:
          - RLS оправдан, когда цена утечки очень высока и хочется, чтобы БД
            сама отклоняла нескоупленный доступ.
          - "Поверх global scopes это defence in depth: баг приложения
            превращается в ошибку БД, а не в отданные чужие данные."
          - "Цена: политики усложняют миграции и отладку, ошибки менее очевидны,
            нужен отдельный пользователь БД для обхода."
          - "Практично: включить RLS на самых чувствительных таблицах — платежи,
            инвойсы — а не на всём сразу."
        traps:
          - Считать RLS заменой прикладных scope — сообщения об ошибках и UX
            станут хуже.
          - Включать RLS везде в первый день, не оценив стоимость.
        follow_ups:
          - Как тестировать RLS-политики?
          - Что будет с миграциями, если RLS активна?
