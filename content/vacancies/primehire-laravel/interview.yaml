          - "Всё, что касается денег, тенантов и безопасности: ИИ может
            предложить вариант, но решение и проверку делаю я."
          - Миграции на проде и изменения схемы БД — только с моим ревью и
            dry-run, не 'сгенерировал и задеплоил'.
          - "Легаси-модули: ИИ плохо знает контекст 15-летнего кода; его
            предложения переписывать — повод насторожиться."
          - Продуктовые решения и приоритеты — за человеком; ИИ не владелец
            тикета.
        traps:
          - Отдавать ИИ писать миграцию для прода и пушить без ревью.
          - Считать, что ИИ 'понимает' домен, потому что сгенерировал связный
            текст.
        follow_ups:
          - Как вы проверите миграцию, сгенерированную ИИ?
          - Что вы ответите, если ИИ предложит переписать модуль целиком?
