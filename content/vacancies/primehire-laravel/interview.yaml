      - id: prime-helm
        question: Как Helm помогает держать окружения одинаковыми, и что такое values и
          rollback?
        likelihood: medium
        tags:
          - ops
        asks: Понимает ли кандидат шаблонизацию чартов и разницу между релизом и values.
        answer:
          - "Helm — пакетный менеджер для Kubernetes: чарт описывает Deployment,
            Service, ConfigMap, а values параметризуют отличия окружений."
          - "Один чарт, разные values: staging и prod отличаются количеством
            реплик, доменами, секретами — не копипастой манифестов."
          - Релиз — это установленный экземпляр чарта с конкретными values; helm
            upgrade обновляет его с историей.
          - Rollback — helm rollback до предыдущей ревизии, когда новый деплой
            сломал прод.
        traps:
          - Держать отдельные копии манифестов на каждое окружение.
          - Не знать, что секреты в values — это плохо, нужен Secret/внешнее
            хранилище.
        follow_ups:
          - Куда вы кладёте секреты, если не в values?
          - Что такое ConfigMap и когда менять его недостаточно?
      - id: prime-s3-presigned
        question: Клиент загружает большие фото из Angular. Как отдать загрузку напрямую
          в S3, не делая бакет публичным?
        likelihood: medium
        tags:
          - api
          - ops
        asks: Знает ли кандидат presigned URL и ограничения такого подхода.
        answer:
          - Клиент спрашивает у Laravel API presigned PUT URL для конкретного
            ключа объекта; API проверяет права и tenant и подписывает.
          - URL короткоживущий, привязан к ключу и content type — это
            единственный делегированный доступ в приватный бакет.
          - Браузер загружает файл напрямую в S3, не прогоняя байты через API.
          - "Ограничения: URL не проверит реальный размер и содержимое;
            валидацию размера/типа делаем до подписания и по событию после
            загрузки."
        traps:
          - Делать бакет публичным вместо presigned URL.
          - Подписывать URL на любой ключ, который попросит клиент.
        follow_ups:
          - Файл 2 ГБ, URL истекает в середине загрузки — что делать?
          - Как потом отдать этот файл для просмотра?
