  - id: queues
    title: Очереди, SQS и кэш
    side: technical
    intro: SQS для очередей, Redis для кэша. Ключевой вопрос — не «как диспатчить
      джоб», а что происходит при повторе и гонках.
    wiki_refs:
      - laravel-queues-and-workers
      - aws-event-driven-messaging
    questions:
      - id: prime-sqs-visibility
        question: Джоб ходит в медленный внешний API до 4 минут. Как настроить
          visibility timeout (таймаут видимости), timeout джоба и ретраи, чтобы
          сообщение не обработалось дважды?
        likelihood: high
        tags:
          - concurrency
          - ops
        asks: Координирует ли кандидат удалённый visibility timeout с локальным timeout
          джоба и понимает ли at-least-once.
        answer:
          - "Механика: SQS прячет сообщение на visibility timeout; если воркер
            не удалил его до истечения — сообщение снова видимо и его возьмут
            повторно."
          - Поэтому visibility timeout ставлю больше максимального времени джоба
            (здесь — больше 4 минут), а timeout джоба согласую с тем же
            пределом.
          - "SQS — at-least-once: повторы и ретраи возможны всегда, значит джоб
            обязан быть идемпотентным (ключ идемпотентности, unique
            constraint)."
          - После исчерпания попыток — dead-letter queue и алерт/человек,
            который её разбирает.
        traps:
          - Ставить visibility timeout меньше джоба в расчёте на ретраи.
          - Считать SQS exactly-once.
        follow_ups:
          - Внешний API завис на 10 минут — что произойдёт с сообщением?
          - "Где вы дедуплицируете: в джобе или в БД?"
      - id: prime-webhook-retry
        question: Вебхук от Stripe пришёл дважды. Где и как вы делаете обработку
          идемпотентной?
        likelihood: high
        tags:
          - idempotency
          - money
        asks: Понимает ли кандидат, что повторная доставка вебхуков неизбежна, и делает
          обработку идемпотентной на уровне данных.
        answer:
          - "Повторная доставка — норма: Stripe ретраит вебхук, пока не получит
            2xx; рассчитывать на 'пришёл один раз' нельзя."
          - "Идемпотентность — на уровне данных: уникальный ключ по event id /
            object id, и повторная обработка превращается в no-op."
          - "Реализация в Laravel: unique constraint или lock на запись,
            проверка 'уже обработан' перед сайд-эффектами."
          - Сайд-эффекты (письма, уведомления) — после фиксации обработки; если
            обработка упала — 5xx, чтобы Stripe пришёл ещё раз.
        traps:
          - Считать, что дедупликация по памяти в кэше достаточна.
          - Отвечать 200 до записи в БД — событие потеряется.
        follow_ups:
          - Чем идемпотентность вебхука отличается от идемпотентности
            API-запроса?
          - Что если два одинаковых вебхука пришли одновременно?
      - id: prime-cache
        question: Что вы кладёте в Redis, а что — нет, в мультитенатном приложении с 550
          моделями?
        likelihood: medium
        tags:
          - ops
          - tenancy
        asks: Понимает ли кандидат, что кэш — это ещё один источник неконсистентности,
          особенно с tenant-ключом.
        answer:
          - "В Redis — горячие чтения: конфиги, тарифы, справочники, результаты
            тяжёлых read-only запросов с коротким TTL."
          - "Ключ всегда с tenant-префиксом: company:42:plans — иначе одна
            компания прочитает кэш другой."
          - "Не кэширую то, что должно быть консистентным: балансы, статусы
            платежей — источник правды БД, а кэш только ускоряет чтение."
          - "Инвалидация — главный вопрос: cache-aside с явным сбросом по
            событию, а не 'поставил TTL и забыл'."
        traps:
          - Кэшировать деньги и считать Redis источником правды.
          - Забыть tenant в ключе кэша.
        follow_ups:
          - Как вы инвалидируете кэш при изменении тарифа?
          - Что такое cache stampede и чем он опасен?
