  - id: billing
    title: Биллинг и деньги
    side: domain
    intro: Платформа принимает платежи и синкается с учётными системами. Ошибка в
      деньгах — это не баг, а потерянные деньги клиента, поэтому спрашивают про
      центы и границы систем.
    wiki_refs:
      - stripe-nue-billing-in-laravel
    questions:
      - id: prime-money-cents
        question: Почему деньги хранят в целых центах, а не во float, и как считать
          proration (пропорциональный пересчёт)?
        likelihood: high
        tags:
          - money
        asks: Понимает ли кандидат двоичную природу float и проектирует вычисления в
          минимальных единицах с явным округлением.
        answer:
          - "Float — двоичная дробь, и десятичные деньги в нём не представимы
            точно: 0.1 + 0.2 != 0.3; накопленная ошибка уходит в центы."
          - Деньги храним целыми центами (минимальная единица валюты) и всегда с
            кодом валюты рядом.
          - Proration считаем в центах по явному правилу округления — например,
            по дням месяца, округление вниз или до ближайшего — и фиксируем его
            в коде.
          - Сумму оборачиваем в иммутабельный value object, чтобы правило жило в
            одном месте, а не в каждом контроллере.
        traps:
          - Округлять float до двух знаков при выводе и считать, что проблема
            решена.
          - Хранить сумму и валюту в разных местах, которые могут разойтись.
        follow_ups:
          - Тариф $10 за место в месяц, клиент добавил место в середине месяца —
            как посчитать?
          - Как быть с валютами без десятичных знаков (JPY)?
      - id: prime-stripe-nue
        question: Компания переезжает со Stripe Billing на Nue, но Stripe остаётся
          платёжным процессором. Что переезжает, что остаётся, где граница?
        likelihood: high
        tags:
          - money
          - tradeoff
        asks: Разделяет ли кандидат платёжный процессинг и quote-to-revenue слой, и
          понимает ли Nue как Salesforce-платформу.
        answer:
          - "Stripe — это два разных продукта: Stripe Payments (двигает деньги)
            и Stripe Billing (подписки, прайсинг, инвойсы) поверх него."
          - "Nue — quote-to-revenue платформа на Salesforce: CPQ, подписки,
            биллинг, revenue-аналитика; она заменяет Stripe Billing, а не
            процессинг."
          - На Stripe остаются payment intents, refunds, chargebacks; на Nue
            уезжают квоты, планы, подписки и инвойсы.
          - "Граница и overlap-окно: для каждой сущности до миграции решаем, кто
            source of truth, и держим идемпотентный синк между системами."
        traps:
          - Описывать Nue как платёжный процессор или полную замену Stripe.
          - Держать обе системы источником правды для одного инвойса.
        follow_ups:
          - Подписка создана в Nue, а платёж в Stripe упал — кто ретраит?
          - Как сверять инвойсы в окно миграции?
      - id: prime-invoice-sync
        question: Инвойс создан в Nue, но платёж в Stripe упал. Кто владеет ретраем и
          как вы сверяете (reconcile) данные?
        likelihood: medium
        tags:
          - money
          - reconciliation
        asks: Понимает ли кандидат ответственность систем и необходимость сверки как
          отдельного процесса.
        answer:
          - "Stripe владеет фактом платежа: если payment intent упал, ретраит
            сам Stripe по своим правилам или мы по его событиям."
          - Nue не должен считать инвойс оплаченным, пока не получил
            подтверждение от Stripe через вебхук или синк.
          - "Сверка — отдельный процесс: регулярный джоб сравнивает статусы
            инвойсов в Nue с платежами в Stripe и подсвечивает расхождения."
          - Расхождения попадают в отчёт/алерт, а не молча 'разруливаются'
            автоматикой.
        traps:
          - Дать Nue и Stripe обоим ретраить платёж — двойное списание.
          - Считать, что вебхуки сами по себе гарантируют консистентность.
        follow_ups:
          - Что пишете в лог сверки, чтобы разбор был быстрым?
          - Как обрабатывать частичную оплату?
