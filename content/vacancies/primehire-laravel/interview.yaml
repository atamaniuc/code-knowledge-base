  - id: auth
    title: Passport, JWT и 2FA
    side: technical
    intro: В стеке Passport (OAuth2), JWT и 2FA. Спрашивают про отзыв доступа — это
      то место, где «просто JWT» перестаёт быть простым.
    wiki_refs:
      - laravel-passport-vs-jwt
    questions:
      - id: prime-passport-jwt
        question: У вас Laravel Passport и JWT. Чем Passport отличается от «просто JWT»,
          когда нужен мгновенный отзыв доступа?
        likelihood: high
        tags:
          - auth
        asks: Понимает ли кандидат разницу между OAuth2-сервером с токенами в БД и
          stateless JWT.
        answer:
          - "Passport — это OAuth2-сервер: токены лежат в базе, и отзыв — это
            удаление или пометка записи; следующий запрос упадёт."
          - «Просто JWT» — подписанный токен, который сервер принимает без
            обращения к БД; отозвать один токен нечем.
          - "Поэтому в вакансии Passport + JWT соседствуют:
            OAuth2-инфраструктура для клиентов и access/refresh токены для
            сессий."
          - "Когда нужен мгновенный отзыв — состояние всё равно возвращается:
            короткоживущие access, revocable refresh, blacklist по jti или
            token_version."
        traps:
          - Говорить, что JWT можно отозвать, поменяв секрет подписи — это
            отзовёт вообще всех.
          - Считать Passport и JWT взаимоисключающими.
        follow_ups:
          - Как быстро отзыв добирается до уже выданного access-токена?
          - Где вы храните refresh-токен и почему?
      - id: prime-revocation
        question: Саппорт должен немедленно отрубить скомпрометированный аккаунт. Что
          это заставляет добавить в JWT-дизайн?
        likelihood: high
        tags:
          - auth
          - audit
        asks: Понимает ли кандидат, что stateless-токен сам по себе неотзываем, и
          проектирует механизм отзыва явно.
        answer:
          - "Честный ответ: подписанный JWT валиден до expiry, поэтому
            мгновенный отзыв требует серверного состояния."
          - "Дизайн: короткоживущие access-токены + revocable refresh-токены;
            отзыв бьёт по refresh, а access доезжает максимум свой TTL."
          - Альтернативы — blacklist по jti или token_version у пользователя,
            который инкрементится при logout/смене пароля.
          - "Refresh rotation с детектом переиспользования ловит кражу: старый
            refresh после ротации — это сигнал тревоги."
          - "Хранение на фронте — часть дизайна: localStorage читается любым
            скриптом, httpOnly cookie — нет, но требует CSRF-защиты."
        traps:
          - Обещать мгновенный отзыв уже выданного access-JWT без состояния.
          - Хранить refresh в localStorage и называть это безопасным.
        follow_ups:
          - Какой TTL у access-токена вы бы выбрали и почему?
          - Что такое reuse detection при ротации refresh-токенов?
      - id: prime-2fa
        question: Как бы вы встроили 2FA (двухфакторную аутентификацию) в существующий
          Passport-флоу?
        likelihood: medium
        tags:
          - auth
          - api
        asks: Понимает ли кандидат, где 2FA встраивается в OAuth2-флоу и как не сломать
          API-клиентов.
        answer:
          - "2FA — это дополнительный шаг после пароля, до выпуска долгоживущих
            токенов: короткий challenge, TOTP-код или push."
          - "В OAuth2-флоу это отдельный grant/scope или промежуточный шаг:
            пароль даёт доступ только к шагу 2FA."
          - После успешной проверки выпускаем обычные access/refresh токены;
            существующие токены можно не трогать.
          - "Важно не сломать machine-to-machine клиентов: для них 2FA не
            применяется, у них свои client credentials."
        traps:
          - Встраивать 2FA как проверку в каждом запросе — убьёт
            производительность и UX.
          - Заставлять API-интеграции проходить TOTP.
        follow_ups:
          - Что делать с уже выданными токенами при включении 2FA?
          - Как обрабатывать backup-коды?
