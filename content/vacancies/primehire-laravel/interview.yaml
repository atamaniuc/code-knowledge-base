          - Считать, что Shift сделает всё и можно не читать upgrade guide.
        follow_ups:
          - Какое изменение Laravel 11 вы бы проверили первым в этой базе?
          - Как не заблокировать QA на время миграции?
      - id: prime-legacy
        question: Вы правите баг в легаси-модуле. Где граница «улучшить то, что трогаю»
          и «не переписывать»?
        likelihood: high
        tags:
          - scope
          - tradeoff
        asks: "Понимает ли кандидат экономику легаси: минимальный честный фикс с
          улучшением рядом, без rewrit'а."
        answer:
          - "Граница: я меняю ровно то, что нужно для фикса, плюс привожу в
            порядок непосредственно затронутые строки — типы, имена, тест."
          - "Не трогаю соседние модули, даже если они 'плохо написаны': rewrite
            ломает то, что работало, и раздувает PR."
          - Если вижу крупную проблему — фиксирую её отдельным тикетом/ADR, а не
            решаю молча внутри баг-фикса.
          - Улучшение — это тест на баг, понятные имена рядом, документация
            находки; не рефакторинг всего файла.
        traps:
          - Рефакторить весь модуль, пока 'всё равно тут'.
          - Оставлять после себя код хуже, чем был, ради 'минимального фикса'.
        follow_ups:
