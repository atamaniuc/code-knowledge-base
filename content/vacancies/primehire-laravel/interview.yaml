  - id: testing
    title: Тесты и отладка
    side: technical
    intro: "В вакансии явно: баг-фикс приходит с тестом, который падает до фикса.
      Спрашивают про дисциплину, а не про знание PHPUnit."
    wiki_refs:
      - laravel-testing-strategy
    questions:
      - id: prime-regression
        question: "Баг: у клиента неверный тотал инвойса. Какой тест вы пишете первым и
          что мокаете?"
        likelihood: high
        tags:
          - tests
          - money
        asks: Пишет ли кандидат падающий регрессионный тест против реального поведения и
          мокает только внешнюю границу.
        answer:
          - Сначала воспроизвожу баг и фиксирую его тестом, который падает на
            текущем коде — это регрессионный тест.
          - "Если баг затрагивает запрос, БД и расчёт — это feature-тест:
            HTTP-запрос, затем проверка состояния БД и ответа."
          - "Мокаю только внешнюю границу: Http::fake для стороннего API; сам
            сервис расчёта не мокаю, иначе тест не проверяет арифметику."
          - После фикса тест зелёный; QA получает шаги воспроизведения и что
            именно проверено.
        traps:
          - Писать тест, который проходит и до, и после фикса.
          - Замокать сервис инвойсов — тест перестаёт проверять баг.
        follow_ups:
          - Как доказать, что тест падает по правильной причине?
          - Когда достаточно unit-теста?
      - id: prime-reproduce
        question: "Тикет: «страница 500-ит». Как вы действуете, прежде чем делать вывод?"
        likelihood: high
        tags:
          - ops
          - process
        asks: "Идёт ли кандидат по evidence: логи, данные, код — и воспроизводит до
          вывода, а не гадает."
        answer:
          - "Сначала читаю тикет и воспроизвожу: на каком tenant, пользователе,
            данных падает; смотрю логи Sentry и трейс."
          - "Смотрю в данные: какие строки участвуют, что с ними не так — часто
            500 это данные, а не код."
          - Нахожу код по трейсу, а не по догадке; формулирую причину, которую
            можно проверить.
          - Фикс — с регрессионным тестом, затем dev-сервер и QA handoff с
            шагами.
        traps:
          - Сразу патчить 'похожее место', не воспроизведя баг.
          - Делать вывод по одному логу, не заглянув в данные.
        follow_ups:
          - Что вы делаете, если не можете воспроизвести локально?
          - Как вы пишете шаги для QA?
      - id: prime-feature-test
        question: RefreshDatabase или DatabaseTransactions — что выберете и когда?
        likelihood: medium
        tags:
          - tests
        asks: Понимает ли кандидат трейд-офф скорости и изоляции, а не просто называет
          один вариант.
        answer:
          - RefreshDatabase мигрирует базу один раз и оборачивает каждый тест в
            транзакцию с откатом — чистая схема на тест.
          - DatabaseTransactions только оборачивает в транзакцию и быстрее, но
            требует уже готовой схемы.
          - Если тест сам коммитит транзакции или ходит в отдельный процесс —
            транзакции не помогут, нужен RefreshDatabase.
          - "Выбор — это трейд-офф: скорость против изоляции; для feature-тестов
            инвойсов обычно беру RefreshDatabase."
        traps:
          - Считать, что DatabaseTransactions изолирует тесты, которые сами
            коммитят.
          - Гонять полные миграции на каждый тест без нужды.
        follow_ups:
          - Как тестировать джобы, которые пишут в БД?
          - Что быстрее на CI и почему?
